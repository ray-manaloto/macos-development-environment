evidence: |
  **Topic 1: Claude Code /dream Command**

  SOURCE: https://raw.githubusercontent.com/Piebald-AI/claude-code-system-prompts/main/system-prompts/agent-prompt-dream-memory-consolidation.md
  - Raw fetch returned full prompt with metadata: ccVersion: 2.1.78
  - Title: "Dream: Memory Consolidation"
  - Description: "reflective pass over your memory files"
  - Memory directory: ${MEMORY_DIR} (templated)
  - Session transcripts: ${TRANSCRIPTS_DIR} (JSONL format)
  - 4 Phases: (1) Orient (ls memory, read index), (2) Gather (logs, diffs, grep JSONL), (3) Consolidate (write/update topic files), (4) Prune (update index under max lines)
  - Returns: brief summary of what was consolidated/updated/pruned
  - Policy: "If nothing changed, say so"

  WHAT IT CONSOLIDATES:
  - File-based memory only (not session state or cloud backups)
  - Priority: Daily logs > Contradicted facts > Transcript searches
  - Converts relative dates to absolute ISO dates for time-invariance
  - Deletes stale/wrong facts; updates contradicted memories

  RELATION TO CLAUDE.MD / AUTO-MEMORY:
  - /dream is the PERIODIC consolidation pass; CLAUDE.md defines the FORMAT/TYPES/POLICIES
  - System prompt's auto-memory section is source of truth for what to save, how to structure, what NOT to save
  - /dream reads that guidance and executes Phase 3 & 4 against file-based memory directory

  IS IT A REPLACEMENT FOR HONCHO?
  - NO. /dream = periodic memory organization within a single session context
  - Honcho = durable peer-memory system (agent-to-agent message queue + persistence layer)
  - /dream does not solve: multi-session durability, inter-agent memory sharing, vector search, LLM integration
  - Use case: /dream for local session memory hygiene; Honcho for production agent teams

  VERSION AVAILABILITY:
  - Confirmed in v2.1.78; v2.1.81 not explicitly listed (Piebald-AI repo may lag behind latest Claude Code releases)
  - ccVersion in system-prompts is dated; assume feature exists in 2.1.81+ unless explicitly removed in release notes

