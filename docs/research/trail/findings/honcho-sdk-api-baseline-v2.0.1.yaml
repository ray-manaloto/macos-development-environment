    - method: "summaries() -> SessionSummaries"
      api_only_safe: false
      llm_required: true
      description: "Get LLM-generated summaries for session (requires LLM)"
      params_required: []
      params_optional: []
      returns: "SessionSummaries"

# ASYNC EQUIVALENTS

async_note: |
  HonchoAio, PeerAio, SessionAio provide identical method signatures to their sync counterparts.
  All methods are async (use with await) and accept the same parameters.
  All have identical api_only_safe classifications.

# TYPE DEFINITIONS & RETURN TYPES

return_types:
  SyncPage: |
    Paginated response container. Implements iterator protocol.
    Returns: SyncPage[ResponseType, ObjectType]
    Usage: for peer in client.peers(): ...

  Message: |
    {id: str, session_id: str, peer_id: str, content: str, created_at: datetime, metadata: dict}

  Peer: |
    Client object with methods: chat(), search(), get_metadata(), set_metadata(), etc.

  Session: |
    Client object with methods: add_messages(), get_context(), search(), etc.

  PeerContextResponse: |
    {representation: str, card: list[str], conclusions: list[Conclusion]}

  SessionContext: |
    {summary: str, messages: list[Message], conclusions: list[Conclusion], openai_format: list, anthropic_format: list}

# API-ONLY SAFETY MATRIX

api_only_safe_operations_count: 32
api_only_unsafe_operations_count: 11

safe_by_category:
  workspace: 8  # peer, peers, session, sessions, workspaces, delete_workspace, get_configuration, set_configuration, get_metadata, set_metadata, refresh, queue_status, schedule_dream
  peer_crud: 6  # message, get_configuration, set_configuration, get_metadata, set_metadata, sessions, refresh, get_card, set_card
  session_crud: 18  # add_messages, messages, update_message, upload_file, add_peers, set_peers, remove_peers, peers, get_peer_configuration, set_peer_configuration, get_configuration, set_configuration, get_metadata, set_metadata, delete, refresh, clone, queue_status

unsafe_operations:
  peer: 6  # chat, chat_stream, context, search, representation, conclusions_of, card
  session: 4  # context, search, representation, summaries
  workspace: 1  # search

# INSTANTIATION & CONFIGURATION

initialization:
  sync: |
    from honcho import Honcho
    client = Honcho(
        api_key="your-api-key",
        environment="production",  # or "local", "demo"
        workspace_id="optional-workspace-id",
        base_url="https://api.honcho.dev"  # optional override
    )

  async: |
    from honcho import HonchoAio
    client = HonchoAio(
        api_key="your-api-key",
        environment="production",
        workspace_id="optional-workspace-id",
        base_url="https://api.honcho.dev"
    )

  env_vars: |
    HONCHO_API_KEY=your-api-key
    HONCHO_BASE_URL=https://api.honcho.dev (optional)
    HONCHO_WORKSPACE_ID=your-workspace (optional)

# PAGINATION

pagination: |
  SyncPage and AsyncPage support iteration:
    for peer in client.peers(filters={"name": "alice"}):
        print(peer.id)

  Also support conversion to list:
    all_peers = list(client.peers())

# DEPENDENCIES

python_version: "3.11+"
dependencies:
  - httpx
  - pydantic
