id: finding-honcho-sdk-api-baseline-v2-0-1
timestamp: "2026-03-24T20:30:00Z"
source: |
  PyPI: https://pypi.org/project/honcho-ai/
  GitHub: https://github.com/plastic-labs/honcho
  Local: honcho-ai==2.0.1 installed package introspection
agent: researcher
finding_type: reference
confidence: confirmed
confident_about: |
  Complete API surface for honcho-ai v2.0.1 (both sync Honcho/Peer/Session and async HonchoAio/PeerAio/SessionAio).
  All method signatures, parameters, return types documented.
  Clear demarcation of CRUD operations (safe in API-only mode) vs LLM operations (500 errors without LLM keys).
gaps: |
  Honcho official docs at docs.honcho.dev appear to use v3 URL structure not yet deployed (404s on all v3/api-reference paths).
  Tested paths: /v3/api-reference/{workspaces,peers,sessions,messages} all return 404.
  No public API reference docs found; relied on package introspection and PyPI README.
evidence: |
  honcho-ai v2.0.1 released Feb 9, 2026 on PyPI.
  Installed via: pip install honcho-ai==2.0.1
  Package introspection via: inspect module + getmembers()
  All methods documented with Pydantic FieldInfo annotations.
implication: |
  API-only deployments (EMBED_MESSAGES=false, no LLM keys) MUST avoid these methods:
  - Peer.chat() / Peer.chat_stream() - require LLM inference
  - Peer.search() / Peer.context() / Peer.representation() - require embedding + inference
  - Peer.conclusions_of() - requires LLM reasoning
  - Session.search() / Session.context() / Session.representation() / Session.summaries() - require LLM
  - Honcho.search() - requires embedding + inference
  All other CRUD operations are safe and will succeed.
tags:
  - honcho-sdk
  - python-api
  - api-only-mode
  - llm-operations
  - crud-operations
  - version-2.0.1
