implication: |
  SkillsMP is the PRIMARY skills marketplace for AI agents - ~7-8x larger than competitors.
  It should be prioritized in:
  1. Skills discovery workflows (search before building)
  2. Integration documentation (MCP server or CLI)
  3. Skill submission/publication strategy
