confident_about: |
  1. Claude Code's official `/plugin` command (built-in) manages plugins from configured marketplaces
  2. Three official marketplaces are pre-configured:
     - claude-code-workflows (72 plugins, by Seth Hobson)
     - claude-plugins-official (Anthropic-managed directory)
     - docker (MCP Toolkit integration)
  3. Marketplace protocol uses marketplace.json with standard schema (anthropic.com/claude-code/marketplace.schema.json)
  4. Plugins stored locally in ~/.claude/plugins/marketplaces/{marketplace-name}/plugins/
  5. Individual plugins use plugin.json format with name, version, description, author, license fields
  6. At least 14 specialized npm CLIs exist for skill/plugin management, discovered Feb-March 2026

gaps: |
  1. No published official Anthropic SDK for programmatic marketplace API (CLI-only)
  2. Plugin content validation rules not fully documented
  3. Marketplace.add protocol details (--file, --url, --github-repo options exist but undocumented)
  4. Cross-marketplace search/discovery not centralized through Claude Code CLI
  5. No official registry-of-registries or aggregation mechanism (community-driven only)
  6. Plugin versioning strategy and SemVer enforcement not found

evidence: |
  **Claude Code Built-In Commands:**
  - `claude plugins list` — shows installed plugins with version/scope/status
  - `claude plugins install <plugin>` — install from marketplace
  - `claude plugins enable/disable <plugin>` — toggle plugin activation
  - `claude plugins marketplace list` — shows configured marketplaces
  - `claude plugins marketplace add <source>` — add marketplace from URL/GitHub/path
  - `claude plugins marketplace update [name]` — sync marketplace changes

  **Official Marketplace Locations:**
  - claude-code-workflows: ~/.claude/plugins/marketplaces/claude-code-workflows/ (GitHub: wshobson/agents)
  - claude-plugins-official: ~/.claude/plugins/marketplaces/claude-plugins-official/ (GitHub: anthropics/claude-plugins-official)
  - docker: ~/.claude/plugins/marketplaces/docker/ (GitHub: docker/claude-plugins)

  **Marketplace.json Structure (claude-code-workflows example):**
  ```json
  {
    "name": "claude-code-workflows",
    "owner": {"name": "Seth Hobson", "email": "seth@major7apps.com"},
    "metadata": {"description": "72 plugins, 112 agents, 146 skills", "version": "1.5.6"},
    "plugins": [
      {
        "name": "code-documentation",
        "source": "./plugins/code-documentation",
        "description": "...",
        "version": "1.2.0",
        "author": {...},
        "category": "documentation",
        "license": "MIT"
      }
    ]
  }
  ```

  **Plugin.json Structure (agent-orchestration example):**
  ```json
  {
    "name": "agent-orchestration",
    "version": "1.2.1",
    "description": "...",
    "author": {"name": "Seth Hobson", "email": "..."},
    "license": "MIT"
  }
  ```

