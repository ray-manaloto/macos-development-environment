implication: |
  1. **Plugin Marketplace Protocol is Decentralized**: Claude Code users can add custom marketplaces via `claude plugins marketplace add`. No centralized registry enforced by Anthropic beyond official three.

  2. **Multiple Skill Management Strategies Coexist**: Each npm CLI (@spardutti, vibeindex, YACS, csreg) represents different approaches to skill discovery/installation, suggesting market fragmentation and user choice, not standardization.

  3. **MCP and Skills are Separable**: mcp-to-skill-with-headers tool indicates MCP servers are conceptually distinct from Claude Code skills, but conversion is possible. This is important for architecture decisions.

  4. **No Official API / CLI-Only**: All skill/plugin management is CLI-driven. There is no published REST API, SDK, or programmatic interface for plugin operations. Cross-tool integration requires spawning subprocesses or parsing CLI output.

  5. **Community-Driven Discovery**: Official Anthropic does not publish a master registry. Community awesome-lists (46k+ stars) and registries (tech-leads-club, skillshub) fill the gap. Skill discovery is outsourced to npm, GitHub, and community projects.

  6. **Schema-Driven Marketplace Architecture**: The presence of marketplace.json + plugin.json schema suggests opportunities for:
     - Automated validation (cf. @lavelle/lint-agent)
     - Version management
     - Cross-marketplace search tools
     - Marketplace aggregation

  7. **For This Project**:
     - The .claude/plugins/marketplaces/ directory and `claude plugins marketplace add` command enable custom enterprise/team marketplaces
     - The 14 npm CLIs present building blocks for composable skill discovery (search one via csreg, install via vibeindex, validate via lint-agent)
     - The schema at anthropic.com/claude-code/marketplace.schema.json should be the authoritative spec for any plugin tooling built here

  8. **Next Steps for Implementation**:
     - Fetch and validate the official marketplace schema
     - Compare schema versions across marketplace.json examples (claude-code-workflows, official, docker) for version skew
     - Catalog skills in the three official marketplaces via direct filesystem analysis (~72 + official + docker)
     - Evaluate whether to compose existing CLIs or build new aggregation tool
