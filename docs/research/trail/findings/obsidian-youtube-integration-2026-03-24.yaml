implication: |
  ## Integration Patterns for AI Agents + YouTube + Obsidian

  **Auto-Ingestion Pipeline:**
  - Claude Code agent → fetches YouTube metadata (title, description, transcripts)
  - Stores in Obsidian vault as structured notes (YAML front-matter + markdown)
  - obsidian-rag indexes notes for semantic search
  - Agent can then RAG-query video content without storing full transcripts

  **Workflow Example (from video #2):**
  1. Agent searches YouTube for topic-related videos
  2. NotebookLM ingests video descriptions/metadata
  3. NotebookLM generates synthesis (outline, key insights, cross-links)
  4. Claude Code writes synthesis results to Obsidian vault
  5. obsidian-rag makes synthesis queryable

  **Video Content Searchability (Core Gap):**
  - Current pattern: Store video metadata + agent-generated summaries
  - Not yet: Full transcript ingestion (likely due to quota/cost)
  - Solution: Use Claude Code agents to request transcripts via YouTube API
  - Alternative: obsidian-rag with embedding-based semantic search over summaries

  **Key Tools Identified:**
  - obsidian-rag: Production-ready RAG layer for Obsidian
  - obsidian-automation: Slash-command driven vault interactions
  - obsidian-knowledge: Knowledge base + retrieval (implementation TBD)
  - Potential: youtube-transcript or similar skill for transcript extraction

