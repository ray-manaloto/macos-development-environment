  class EmbeddingClient:
      """Singleton wrapper with deferred loading."""
      _instance: "_EmbeddingClient | None" = None
      _lock: threading.Lock = threading.Lock()

      def _get_client(self) -> _EmbeddingClient:
          """Get or create the underlying embedding client instance."""
          if self._instance is None:
              with self._lock:
                  if self._instance is None:
                      provider = settings.LLM.EMBEDDING_PROVIDER
                      # ... lazy init happens here ...
  ```

  Module instantiation at end of embedding_client.py:
  ```python
  embedding_client = EmbeddingClient()
  ```
  (Note: This creates the WRAPPER, not the actual client)

  From src/routers/messages.py (deriver import):
  ```python
  from src.deriver import enqueue
  ```

implication: |
  **For users wanting API-only mode (storage without LLM reasoning):**

  1. **Current behavior: FAILS at startup**
     - Even with DERIVER_ENABLED=false, the API cannot start without LLM keys
     - SELECTED_PROVIDERS validation is unconditional

  2. **Workaround: Provide dummy LLM keys**
     ```
     LLM_GEMINI_API_KEY=dummy-key
     DERIVER_ENABLED=false
     SUMMARY_ENABLED=false
     DREAM_ENABLED=false
     ```
     - This lets the API start (validates pass because key exists)
     - Actual API requests to messages/peers/sessions work fine (no LLM calls in request path)
     - Background deriver processing is disabled, so dummy key is never used

  3. **Proper fix: Conditional validation**
     - Only validate SELECTED_PROVIDERS for providers that are actually enabled
     - Requires code change in clients.py

  **For Honcho developers:**
  - This is a design inconsistency: embedding is properly lazy-loaded, but LLM providers are eagerly validated
  - Consider deferring SELECTED_PROVIDERS validation to first-use, similar to EmbeddingClient pattern
  - Or make SELECTED_PROVIDERS conditional on feature flags (ENABLED settings)

