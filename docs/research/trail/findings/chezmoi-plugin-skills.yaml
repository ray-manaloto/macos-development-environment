gaps: |
  1. TROUBLESHOOTING & DIAGNOSTICS
     - chezmoi doctor interpretation (detailed troubleshooting workflow)
     - State management (state dump, delete-bucket for scripts)
     - Diff debugging patterns (chezmoi diff --include, --exclude flags)
     - Merge conflict resolution workflows
     - Version compatibility checking (.chezmoiversion)

  2. ADVANCED CONFIGURATION
     - .chezmoiroot for monorepo/multi-repo setups
     - .chezmoiremove for cleanup workflows
     - .chezmoiignore patterns (include/exclude, templating)
     - Git configuration (autoCommit, autoPush, commitMessageTemplate)
     - Plugin system (hooks, custom commands via plugins)
     - Encryption setup & management (age, gpg key management)

  3. MIGRATION & ONBOARDING
     - Importing from other dotfile managers (stow, yadm, bare git)
     - First-time setup patterns (fresh vs existing repos)
     - One-shot mode (chezmoi init --one-shot)
     - Multi-account SSH setup for dotfiles repos
     - Team/shared dotfiles patterns

  4. TEMPLATE AUTHORING ADVANCED
     - .chezmoitemplates/ directory (include templates, snippets)
     - Template functions (bitwarden, onepassword, lookPath, stat, env)
     - Complex data structures (.chezmoidata/ YAML/TOML nesting)
     - Template recursion & organization patterns
     - Platform-specific script injection (shell vs PowerShell)

  5. CROSS-PLATFORM STRATEGIES
     - Windows PowerShell support (ps1 templates, run_onchange_*.ps1)
     - Linux-specific considerations (systemd, apt, pacman)
     - Container/CI/CD patterns (--no-tty, remote detection)
     - macOS-specific gotchas (M1/M2 arm64 vs x86_64)

  6. PERFORMANCE & SCALABILITY
     - Lazy loading / conditional external resources
     - Refresh periods for external files (.chezmoiexternal)
     - Dependency management between scripts
     - State cleanup patterns (deleting run_once state)
     - Partial applies (chezmoi apply --target)

  7. DEVELOPER EXPERIENCE
     - IDE integration (symlinks to source, editor plugins)
     - Testing templates in isolation
     - Pre-commit hooks for dotfile validation
     - Dry-run strategies (chezmoi apply --dry-run patterns)
     - Debugging template expansion (chezmoi execute-template)
