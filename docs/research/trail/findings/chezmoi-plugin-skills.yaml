implication: |
  Recommended new skills for comprehensive chezmoi plugin:

  HIGH PRIORITY (power users + teams):
  1. chezmoi-troubleshooting
     - Skill focus: doctor interpretation, state debugging, diff analysis
     - Triggers: "chezmoi not working", "fix chezmoi", "debug", "doctor", "state"
     - Scope: 200-250 lines (command reference, common issues table, troubleshooting flowchart)
     - Justification: No current skill covers diagnostic workflow; critical for users with broken setups

  2. chezmoi-migration
     - Skill focus: importing from stow/yadm/bare git, multi-account SSH setup
     - Triggers: "import dotfiles", "migrate", "stow", "yadm", "existing repo", "onboarding"
     - Scope: 200-300 lines (step-by-step migration paths, before/after comparisons)
     - Justification: Onboarding is a major use case; no current skill addresses it

  3. chezmoi-advanced-config
     - Skill focus: .chezmoiroot, .chezmoiremove, git config, plugins, encryption
     - Triggers: "monorepo", "advanced", "plugin", "encryption key", "git config"
     - Scope: 250-350 lines (reference tables, patterns, security considerations)
     - Justification: Current skills only cover basic .chezmoi.toml; missing ~50% of config options

  MEDIUM PRIORITY (template authors + team leads):
  4. chezmoi-template-advanced
     - Skill focus: .chezmoitemplates/, template functions, recursion, data structures
     - Triggers: "template function", "include", "recursive", "template library", "bitwarden", "lookPath"
     - Scope: 200-250 lines (function reference, patterns, examples)
     - Justification: Current config skill covers basics; advanced patterns are missing

  5. chezmoi-cross-platform
     - Skill focus: Windows/Linux/macOS conditionals, platform-specific scripts, CI/CD
     - Triggers: "windows", "powershell", "linux", "container", "ci", "remote"
     - Scope: 150-200 lines (platform conditionals, script templates, examples)
     - Justification: mde-chezmoi focuses on macOS; general cross-platform patterns needed

  LOW PRIORITY (advanced/niche use cases):
  6. chezmoi-state-management
     - Skill focus: state dump, delete-bucket, script idempotency, cleanup
     - Triggers: "state", "script not running", "reset", "idempotent"
     - Scope: 100-150 lines (state overview, reset procedures)
     - Justification: Rarely needed; but critical when needed

  Integration strategy:
  - Keep chezmoi-config as-is (strong foundation, read-only safe)
  - Keep chezmoi-workflows as-is (daily operations are stable)
  - Keep mde-chezmoi-dotfiles for repo-specific patterns
  - ADD 3 new skills (troubleshooting, migration, advanced-config) as HIGH priority
  - ADD 2 new skills (template-advanced, cross-platform) as MEDIUM priority
  - DEFER state-management until user demand signals priority shift
