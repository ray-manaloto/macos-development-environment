implication: >
  The WorktreeCreate hook can safely use `uv sync --frozen` with confidence:
  (1) Resolution is fully skipped — lockfile read is the only dependency check,
  (2) Performance is acceptable: <500ms warm cache, predictable cold cache,
  (3) VIRTUAL_ENV from the parent worktree is automatically ignored — no env manipulation needed
      (though unsetting it suppresses the warning),
  (4) uv creates the .venv in the correct location (worktree dir) without any configuration.

