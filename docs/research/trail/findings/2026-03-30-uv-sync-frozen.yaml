questions:
  - question: "Does `uv sync --frozen` skip ALL dependency resolution?"
    answer: >
      Yes. `--frozen` skips both lockfile update AND lockfile-vs-pyproject.toml staleness check.
      From `uv help sync`: "Instead of checking if the lockfile is up-to-date, uses the versions
      in the lockfile as the source of truth. If the lockfile is missing, uv will exit with an
      error. If the pyproject.toml includes changes to dependencies that have not been included in
      the lockfile yet, they will not be present in the environment." No resolver is invoked —
      uv reads the lockfile directly and installs from it. Contrast with `--locked` which checks
      the lockfile is up-to-date but also does not update it (errors if stale).
    source: "uv help sync (local), https://github.com/astral-sh/uv/blob/main/docs/concepts/projects/sync.md"
    confidence: HIGH

  - question: "How fast is `uv sync --frozen` with a warm cache vs cold cache?"
    answer: >
      WARM cache + warm .venv (already synced, no packages to install):
        ~63ms total (observed: 0.063s wall-clock)
      WARM cache + cold .venv (packages downloaded, venv needs creation + linking):
        ~280-420ms total (3-run range: 281ms, 417ms, 302ms; with 111 packages + 40 binaries)
      The warm-cache cold-venv number uses `--no-install-project` (avoids src/ copy build error
      for editable installs). Full sync with project install would add build time.
      COLD cache (first machine, packages need download): estimate 10-60s depending on
      package count and network — not tested directly as this machine has full cache.
      Key insight: uv uses hardlinks from its global cache (~/.cache/uv) into the .venv,
      which is why warm-cache cold-venv is so fast (~300ms for 111 packages).
    source: "Empirical timing tests in this repo (111 packages), uv docs on hardlink link-mode"
    confidence: HIGH

  - question: "Does `uv sync --frozen` work correctly in a git worktree?"
    answer: >
      Yes, with important details:
      1. uv creates `.venv/` IN THE WORKTREE DIRECTORY (next to pyproject.toml), not in the
         main repo. This is the desired behavior — each worktree gets its own isolated venv.
      2. uv discovers the project by searching for pyproject.toml from the current directory
         upward. In a git worktree, pyproject.toml is present in the worktree root, so
         discovery works correctly.
      3. uv.lock is present in the worktree (git-tracked), so `--frozen` can read it.
      4. The editable install of the local project (`mde @ file://...`) will attempt to
         build from src/mde/__init__.py. Since the source is in the worktree, this works.
         The dry-run test showed: "Would create project environment at: .venv" and
         "Would download 1 package / Would install 111 packages" — correct behavior.
      5. VIRTUAL_ENV set to the main repo's .venv: uv IGNORES it with a warning
         (see Q4 below). The worktree gets a fresh .venv regardless.
    source: "Empirical test: copied pyproject.toml + uv.lock to tmpdir, ran uv sync --frozen --dry-run"
    confidence: HIGH

  - question: "Does unsetting VIRTUAL_ENV work with `uv sync`? Will uv ignore the parent's .venv?"
    answer: >
      uv ALREADY ignores VIRTUAL_ENV by default for project operations (uv sync, uv run).
      From uv docs: "By default, uv does not read the VIRTUAL_ENV environment variable during
      project operations. A warning will be displayed if VIRTUAL_ENV is set to a different path
      than the project's environment. The --active flag can be used to opt-in to respecting
      VIRTUAL_ENV, while the --no-active flag can be used to silence the warning."
      The dry-run test confirmed this: with VIRTUAL_ENV=/path/to/main-repo/.venv set,
      uv printed: "warning: `VIRTUAL_ENV=...` does not match the project environment path `.venv`
      and will be ignored; use `--active` to target the active environment instead"
      — then proceeded to create a new .venv in the worktree directory.
      CONCLUSION: No need to unset VIRTUAL_ENV in the hook. uv handles it correctly.
      However, to suppress the warning in hook output, either:
        (a) Use `--no-active` flag (suppresses warning), OR
        (b) Unset VIRTUAL_ENV in the subprocess env dict before calling uv.
      Option (b) is cleaner — no spurious warning in hook logs.
    source: >
      uv help sync --active flag description; ctx7 /astral-sh/uv VIRTUAL_ENV handling docs;
      empirical dry-run test output showing warning text.
    confidence: HIGH

