## INSTALLATION METHOD SUMMARY

### CLI Tools (npx/npm)
- `npx skills search` / `npx skills add` (skills.sh)
- `npx skillkit` (skillkit)
- `npx skillfile` (skillfile)
- `npx agent-skills-cli` (agent-skills-cli)
- `npx flins` (flins)
- `npx add-skill` (skills ecosystem)

### Installation Methods
- Direct cloning: GitHub repositories
- npm packages: Various as listed
- Web UI: claudemarketplaces.com, skillsmp.com (implied), skillx.sh
- TUI applications: plum, lazyclaude

### API/Integration Points
- marketplace.json files (official Claude marketplace format)
- OpenClaw/MCP bundler compatibility
- CCPI package manager (jeremylongshore)
- Skills specification compliance

## KEY PATTERNS OBSERVED

1. **Vercel skills.sh dominance**: 11K+ stars, official CLI, de facto standard
2. **Awesome lists as discovery**: GitHub community curation as primary discovery
3. **Domain specialization**: 20+ domain-specific marketplaces (SAP, Shopware, Elixir, etc.)
4. **Multi-tool installers**: skillkit, skillfile, agent-skills-cli bridge multiple tools
5. **Aggregators emerging**: plum (750+ plugins from 12 marketplaces), claudemarketplaces.com
6. **NPM ecosystem underutilized**: Compared to pip/cargo, npm has few dedicated marketplace CLI tools
7. **Personal collections**: Long tail of small repos (28-77 stars) serve niche communities
8. **Decentralized experiments**: Bitcoin Lightning, trust-through-usage models (clawmart, squidbay)

