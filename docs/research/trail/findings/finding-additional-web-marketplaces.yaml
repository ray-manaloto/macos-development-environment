     - Search: Web-based + structured descriptions
     - Install: Clone from GitHub or browse curated list
     - Status: ACTIVE + fully operational

  2. **Awesome Claude** (awesomeclaude.ai)
     - Type: Directory/resource aggregator
     - Content: IDE extensions, tools, workflows, resources
     - Search: Web-based categorization
     - Format: Links to official tools (VS Code, JetBrains, etc.)
     - Status: ACTIVE - curated community resource

  3. **Skill.Fish** (skill.fish)
     - Type: Web-based skill manager/marketplace
     - Features: Browse, search, interactive skill tables
     - Format: Supports multiple agent platforms
     - UI: Custom skill manager interface
     - Status: ACTIVE - clean UX, fresh deployment

  4. **LobeHub Skills** (lobehub.com/skills)
     - Type: Marketplace for Claude, Codex, ChatGPT skills
     - Size: 229,095+ skills
     - Format: SKILL.md bundles with version control
     - Features: Most-installed rankings, categorization
     - Install: Via LobeHub CLI or web interface
     - Status: ACTIVE - major marketplace

  5. **SkillsLLM** (skillsllm.com)
     - Type: AI skills marketplace
     - Features: Trending skills, trending authors
     - Integrations: MCP servers category visible
     - Size: Significant skill collection
     - Status: ACTIVE - enterprise-focused

  6. **Agent Skills** (agentskills.in)
     - Type: Universal package manager for AI agent skills
     - CLI: agent-skills-cli (npm global)
     - Size: 175,000+ skills across 42+ platforms
     - Supported agents: Claude, Cursor, Copilot, Windsurf, Cline, Gemini CLI, Zed, Codeium, and 34+ more
