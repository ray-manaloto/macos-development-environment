  - name: "OpenLLMetry"
    url: "https://github.com/traceloop/openllmetry"
    stars: 6939
    python_sdk: "openllmetry"
    category: "OTEL observability"
    description: "Open-source observability built on OpenTelemetry. Standard semantic conventions for LLM, embedding, vector DB calls."
    events_captured:
      - llm_prompts
      - llm_completions
      - embedding_calls
      - vector_db_queries
      - agent_tool_calls
