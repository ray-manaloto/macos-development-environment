# ============================================================================
# Integration Patterns
# ============================================================================

integration_patterns:

  otel_stack:
    description: "Standard OpenTelemetry approach (recommended for flexibility)"
    layers:
      - instrument_code: "OpenLLMetry or Logfire decorators"
      - collect: "OTEL SDK (Python SDK automatically manages)"
      - export: "OTEL exporter (Jaeger, Grafana, Datadog, New Relic, etc.)"
      - store: "Backend of choice (can switch without code changes)"
    python_example: |
      from opentelemetry import trace
      from openllmetry import automatic_instrumentation
      automatic_instrumentation("openai")  # Instruments OpenAI calls automatically

  framework_specific:
    description: "Use agent framework's native event hooks"
    examples:
      langchain: "LangSmith (native) or Langfuse (decorator)"
      crewai: "Built-in telemetry + Langfuse integration"
      autogen: "AutoGen logging + custom event handlers"
      hermes: "Native memory + Honcho for user modeling"

  claude_code_specific:
    description: "Ingest ~/.claude/sessions/*.jsonl files"
    approaches:
      realtime: "Parse JSONL as written (watch file descriptor)"
      batch: "Process JSONL files periodically"
      export: "Use claude-export-session or claude-code-trace to convert format first"
    challenge: "JSONL is fork-aware DAG, not linear log (see claude-session-tools)"

