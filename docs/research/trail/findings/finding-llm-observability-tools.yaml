notes: |
  OTEL SEMANTIC CONVENTIONS FOR GENAI:
  - Official spec: github.com/open-telemetry/semantic-conventions/blob/main/docs/gen-ai/
  - Standard attributes: gen_ai.operation.name, gen_ai.request.model, gen_ai.usage.input_tokens, etc.
  - Most tools (OpenLLMetry, Logfire, Langfuse) implement these automatically

  CLAUDE CODE JSONL FORMAT:
  - Location: ~/.claude/sessions/{timestamp}/{event}.jsonl
  - Not linear: represents a branching DAG (forks possible)
  - Event types: message, thinking, tool_call, tool_result, function_output, etc.
  - Parser libraries: claude-session-tools (understands fork structure)

  RECOMMENDATION FOR USER:
  1. For production AI app: OpenTelemetry + Langfuse or Logfire (easiest on-ramp)
  2. For agent debugging: RagaAI-Catalyst or MLflow (timeline/graph views)
  3. For Claude Code analysis: Start with claude-code-trace (visual), feed to RagaAI/Langfuse
  4. For maximum flexibility: Use OTEL (any exporter), not proprietary solutions
  5. For cost: MLflow (free, self-hosted) + OpenLLMetry (open-source)
