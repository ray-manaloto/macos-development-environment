confident_about: |
  Honcho is a production-ready open-source memory layer for agents. Core architecture consists of:
  - FastAPI server handling REST API endpoints
  - PostgreSQL with pgvector for storage and vector operations
  - Redis for caching
  - Background deriver worker for async reasoning
  - Python SDK (honcho-ai) and TypeScript SDK (@honcho-ai/sdk)
gaps: |
  Detailed type signatures in Python SDK not fully extracted (requires reading sdks/python directly).
  Full router endpoint documentation would require reading each router file.
evidence: |
  README section: "The Honcho project is split between several repositories with this one hosting
  the core service logic. This is implemented as a FastAPI server/API to store data about
  an application's state." Version 3.0.3 confirmed in README badge and pyproject.toml.

  Docker Compose shows: api service, deriver service, database (pgvector/pgvector:pg15),
  redis:8.2, prometheus, and grafana services.

  Models file (src/models.py) confirms SQLAlchemy ORM with tables: workspaces, peers, sessions,
  messages, message_embeddings, collections, documents.

  Main.py imports routers: workspaces, peers, sessions, messages, conclusions, keys, webhooks.
  All routes prefixed with /v3.
implication: |
  For self-hosted deployment, the infrastructure requires:
  1. Postgres 15+ with pgvector extension (pg15-pgvector package)
  2. Redis 8.2+
  3. Python 3.9+ runtime with uv package manager
  4. Multiple LLM provider API keys (Anthropic, OpenAI, Google Gemini, Groq)
  5. Two long-running processes: FastAPI server and deriver worker

  Integration with applications via honcho-ai Python package or @honcho-ai/sdk TypeScript.
  For memory features in mde-py, consider Python SDK for direct integration.
