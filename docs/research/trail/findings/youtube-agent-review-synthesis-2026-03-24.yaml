recommended_architecture: |

  ## Proposed Stack: "YouTube Agent Review System"

  ### Layer 1: Content Acquisition (yt-dlp)
  Tool: composiohq/youtube-downloader (skill.sh) or direct yt-dlp
  - Download video or extract audio
  - Auto-fetch captions if available
  - Output: MP4 video + optional .vtt subtitles

  ### Layer 2: Transcription (faster-whisper or youtube-transcript-api)
  Conditional branching:
  - IF captions exist → use youtube-transcript-api (lightweight)
  - IF captions missing → use faster-whisper (10x faster than vanilla)

  Configuration:
  - Whisper model size: "base" or "small" (balance of speed/accuracy for most domains)
  - Timestamp support: enabled for citation/navigation
  - Output: .txt with timestamps; stored in temp directory

  ### Layer 3: Analysis (youtube-video-analyst)
  Tool: shipshitdev/youtube-video-analyst (skills.sh)
  - Input: transcript (from Layer 2)
  - Output: 11-section forensic analysis + reusable templates
  - Extraction: viral mechanics, hooks, retention patterns, linguistic signatures

  ### Layer 4: Memory & Query (Obsidian + obsidian-rag)
  Storage:
  - One markdown file per video in Obsidian vault
  - YAML front-matter: title, URL, channel, analysis_date, keywords
  - Body: analysis output from Layer 3
  - Format: Compatible with obsidian-rag indexing

  Retrieval (cross-session learning):
  - obsidian-rag: Semantic search across all video analyses
  - Query: "What viral hooks work in tech education?" → RAG returns matching videos + templates
  - Agent: Can generate similar content or identify patterns across dozens of videos

integration_with_mde: |

  Location: src/mde/youtube_review.py (new module)

  Public API:
  ```python
  async def review_youtube_video(
      url: str,
      vault_path: Path | None = None,
      model_size: str = "base"
  ) -> VideoAnalysisResult:
      """
      Review a YouTube video: transcribe → analyze → store in Obsidian vault.

      Returns: VideoAnalysisResult with all 11 analysis sections + template suggestions
      """
  ```

  Entry point: uv run mde-py youtube-review <URL> [--vault-path <path>] [--model base|small|medium]

  Subcommand in mde CLI:
  - Part of broader research CLI alongside existing commands
  - Integrates with existing mde logging (loguru) + validation (pydantic)
  - Outputs: Structured JSON + markdown for piping to Obsidian

  Skill wrapper: Claude Code skill that calls mde-py youtube-review
  - Enables /youtube-review <URL> in Claude Code sessions
  - Automatically writes analysis to user's Obsidian vault
  - Returns RAG-queryable results

