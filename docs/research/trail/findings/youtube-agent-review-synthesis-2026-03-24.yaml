synthesis_title: "Optimal Architecture for AI Agents to Review Full YouTube Videos"

executive_summary: |
  For AI agents to fully review YouTube videos with self-learning capability, the recommended
  stack is: yt-dlp (download) + faster-whisper (transcription) + youtube-video-analyst skill
  (forensic analysis) + obsidian-rag (long-term memory & RAG). This hybrid approach avoids
  paid API keys, integrates with mde Python package, and enables multi-session learning.

