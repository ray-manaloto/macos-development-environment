open_questions: |

  Q1: Should we use youtube-transcript-api or yt-dlp for caption extraction?
  A1: youtube-transcript-api is lighter for caption-only scenarios. Use as primary;
      fall back to yt-dlp if transcript-api fails.

  Q2: Should transcription happen locally (slower) or via API (cost/privacy)?
  A2: faster-whisper locally. OpenAI API is paid ($0.006 per minute). Local is preferred
      per user constraints.

  Q3: How to handle multiple-hour videos? Whisper latency?
  A3: faster-whisper + base model: ~2-3 minutes per hour of video (acceptable).
      If too slow, offer --model tiny (faster, less accurate) as fallback.

  Q4: Should obsidian-rag be installed separately or bundled?
  A4: Assume user has Obsidian + obsidian-rag plugin already installed.
      mde writes vault files; obsidian-rag indexes them automatically.

  Q5: What if user doesn't use Obsidian?
  A5: Still write .md files to a local directory. Obsidian is optional for vault storage;
      RAG queries require obsidian-rag, but analysis is useful standalone.

