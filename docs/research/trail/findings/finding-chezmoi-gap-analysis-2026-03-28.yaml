gaps_for_mde_project:
  HIGH_PRIORITY:
    - "State management API: Project does not expose chezmoi state bucket clearing; could add Python wrapper for run_onchange_/run_once_ reset without shell scripting"
    - "Watchman integration: Project manually runs chezmoi apply; could leverage watchman for auto-sync on source changes (eliminates manual apply step)"
    - "Machine-specific config templates: Project generates LLVM arch-specific paths but doesn't use chezmoi's laptop/desktop detection or system_profiler queries; could simplify config templating"
    - "Declarative package mgmt via .chezmoidata: Project currently uses Brewfile.tmpl; could migrate to .chezmoidata/packages.yaml + run_onchange_ for cleaner separation"

  MEDIUM_PRIORITY:
    - "External include sources (.chezmoiexternal): Project doesn't import plugins or configs from external repos; could use for sharing plugin manifests or tool configs across machines"
    - "Script environment variables (scriptEnv): Project uses mise env but could leverage scriptEnv for chezmoi-specific secrets/config without polluting shell env"
    - "Template SHA256 checksums: Project's run_onchange_install-packages.sh could embed file content hashes for change detection (already supported pattern)"
    - "Verbose logging integration: Project's validation could use chezmoi doctor output parsing to expose warnings as Python objects for programmatic handling"
    - "Configuration warnings suppression: Project could explicitly disable configFileTemplateHasChanged warning in chezmoi.toml if not using dynamic config"

  LOW_PRIORITY:
    - "Edit with auto-apply: Project doesn't expose chezmoi edit --apply/--watch; could add skill for interactive dotfile editing with auto-apply"
    - "Commit message templating: Project's scripts auto-commit but don't use commitMessageTemplate; could add custom prompt template"
    - "Status/diff exclusions: Project could configure diff.exclude=[\"scripts\"] in chezmoi.toml to hide script diffs from chezmoi status output"

implication: |
  The mde project currently treats chezmoi as a static dotfile deployer. Gap analysis reveals 5 high-value patterns not yet adopted:

  1. **State API** (HIGH): Adding Python wrappers around `chezmoi state delete-bucket` enables programmatic reset of run_onchange_/run_once_ state without shell commands. This supports clean re-runs during testing.

  2. **Watchman auto-sync** (HIGH): Replacing manual `chezmoi apply` triggers with watchman-based file watching eliminates manual apply steps and keeps dotfiles in-sync automatically.

  3. **Machine-specific templates** (HIGH): Migrating from manual sysctl/system_profiler calls to chezmoi's built-in functions (e.g., laptop/desktop detection, CPU cores) simplifies config.toml.tmpl significantly.

  4. **Declarative packages** (MEDIUM): Moving from Brewfile.tmpl imperative here-docs to .chezmoidata/packages.yaml + run_onchange_ separates data (package list) from logic (installation script), improving maintainability.

  5. **External includes** (MEDIUM): Using .chezmoiexternal.toml to import shared plugin configs or tool manifests reduces duplication across chezmoi repos and enables version-locked external dependencies.

  **Recommended next step**: Evaluate HIGH-priority gaps against project roadmap. State API (1) is lowest risk, highest ROI for testing automation. Watchman integration (2) requires careful env-var handling for password managers but unlocks auto-sync.

