agent_specialist_guidance:
  ruff_specialist:
    - "Always run ruff check before ruff format (fix may need reformatting)"
    - "Use --output-format=json for machine-readable output"
    - "Know the full ignore list rationale — each ignored rule has a documented reason"
    - "Check preview status before suggesting new rules"
    - "Use --statistics for high-level violation summary"
    - "Apply --fix for safe fixes, require human approval for --unsafe-fixes"
    - "Understand per-file-ignores patterns (tests vs scripts vs generated)"
  ty_specialist:
    - "Pin to exact version in mise config (breaking changes weekly)"
    - "Maintain exclude list for generated files"
    - "Use allowed-unresolved-imports aggressively for third-party"
    - "Monitor ty releases for rule default changes"
    - "Test upgrade before applying — config may need adjustment"
    - "ty is NOT a drop-in replacement for pyright yet"
  uv_specialist:
    - "Always use 'uv run <entry-point>' not 'uv run python'"
    - "Run 'uv lock' after any pyproject.toml dependency change"
    - "Use 'uv sync' to ensure environment matches lockfile"
    - "Understand workspace vs path dependencies tradeoffs"
    - "Use dependency-groups for dev/test/lint separation"

