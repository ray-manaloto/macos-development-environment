evidence: |
  ## Gemini CLI Native Capabilities (Confirmed)

  **Help output (gemini --help, v0.35.0):**
  ```
  Options:
    -p, --prompt                    Run in non-interactive (headless) mode with the given prompt. Appended to input on stdin (if any).  [string]
    -o, --output-format             The format of the CLI output.  [string] [choices: "text", "json", "stream-json"]
    -e, --extensions                A list of extensions to use. If not provided, all extensions are used.  [array]
    --raw-output                    Disable sanitization of model output (e.g. allow ANSI escape sequences).
  ```

  **Key observations:**
  - `--prompt` supports headless/non-interactive mode (no TUI startup)
  - `--output-format` supports three modes: text, json, stream-json
  - `--extensions` flag exists to filter extensions (empty string disables all)
  - No explicit `--system-prompt` flag documented

  **Tested subprocess behavior:**
  - Direct `subprocess.run(["gemini", "-p", "...", "--output-format", "json"])` timeouts after 5-10 seconds
  - Even with `--extensions ""` flag, still times out
  - Cause: MCP server discovery, credential loading, extension bootstrap phase
  - Implications: Cannot reliably wrap Gemini CLI via subprocess for < 5s latency requirements

  ## No Python SDK Wrappers Found

  **PyPI search results:**
  - "gemini-cli": 0 results for Python packages
  - "gemini-cli-wrapper": 0 results
  - "google-gemini": Returns google-generativeai (official SDK, requires API key)
  - Pattern: Unlike Codex (acodex + codex-python-sdk both on PyPI), Gemini has NO third-party subprocess wrappers

  **GitHub search results:**
  - `language:Python gemini-cli wrapper`: 0 meaningful results
  - `language:Python gemini subprocess`: Only general chatbot wrappers, not CLI-specific
  - Conclusion: Subprocess wrapper pattern for Gemini is UNDISCOVERED territory (no prior art)

  ## Official Google Generative AI Python SDK

  **Package:** google-generativeai (PyPI official)
  **Requires:** API key (GOOGLE_API_KEY environment variable)
  **Issue:** User's subscription-only access model (via gemini-cli) is incompatible with API key auth
  **Status:** NOT installed in mde environment

  ## Vercel AI SDK Community Provider

  **URL:** https://ai-sdk.dev/providers/community-providers/gemini-cli
  **Language:** TypeScript (not Python)
  **Status:** Documented but full implementation not fetched (pages >450KB, agent-fetch timeout)
  **Implication:** TypeScript implementation may have solved startup overhead, but logic not available for Python port

  ## nichochar/gemini-cli-sdk (Current Broken SDK)

  **Issues with current wrapper:**
  1. Requires `OPENAI_API_KEY` to parse Gemini plaintext output via LLM (paid dependency)
  2. `system_prompt` parameter is silently ignored (never passed to CLI)
  3. `max_turns` parameter is silently ignored (never passed to CLI)
  4. Cannot suppress MCP errors (hard requirement for some use cases)
  5. No JSON output support (returns string parsing only)

  ## Subprocess Pattern Precedent (From Prior Research)

  **acodex (Python, Codex CLI wrapper):**
  - Spawns `codex` CLI and communicates via JSONL over stdin/stdout
  - Supports streaming, structured output, and safety controls
  - No system prompt support (not a CLI feature)
  - Handles long startup by accepting initialization cost

  **Implication:** Python subprocess wrappers ARE viable, but Gemini CLI's extension system adds 5-10s overhead

implication: |
  ## For Replacing nichochar/gemini-cli-sdk

  **Option 1: Direct Gemini CLI Wrapper (Recommended)**
  - Build thin subprocess wrapper in `src/mde/domain/gemini_wrapper.py`
  - Pattern: Similar to acodex but for Gemini CLI
  - Features:
    - Direct subprocess.Popen() with --prompt for non-interactive mode
    - Parse JSON output via `--output-format json`
    - Return structured GeminiResponse(content, model, usage)
  - Limitations:
    - 5-10s startup overhead per request (MCP/extension initialization)
    - No system prompt support (not a Gemini CLI feature)
    - No streaming (unless `--stream-json` flag works)
  - Cost: ~150-200 LOC, zero external dependencies

  **Option 2: Use Official google-generativeai SDK**
  - Would require user to generate API key from Google Cloud Console
  - Breaks subscription-only access model (user explicitly rejected API key auth)
  - NOT viable given project constraints

  **Option 3: Gemini CLI Daemon Process**
  - Run `gemini app-server` in background (JSON-RPC protocol, like codex)
  - Check if Gemini CLI supports app-server mode (parallel with Codex CLI)
  - Would amortize 5-10s startup cost across many requests
  - Requires investigation: Does gemini-cli have app-server subcommand?

  **Option 4: Accept Vercel AI SDK's TypeScript Implementation**
  - Port gemini-cli provider logic from Vercel AI SDK to Python
  - Likely complexity: 300-500 LOC
  - Would need to fetch full Vercel docs (currently >450KB, timed out)

  ## Recommended Next Steps

  1. **Test Gemini CLI for app-server mode**: `gemini app-server --help` (may unlock daemon pattern)
  2. **Verify JSON output structure**: `echo "test prompt" | gemini -p "respond with JSON" --output-format json` (capture schema)
  3. **Benchmark startup overhead**: Time 10 consecutive calls, measure amortization potential
  4. **Check system prompt workaround**: Test stdin vs environment variable vs config file for instruction passing
  5. **Fetch Vercel AI SDK docs**: Use alternative approach (split into chunks) to extract gemini-cli provider implementation

