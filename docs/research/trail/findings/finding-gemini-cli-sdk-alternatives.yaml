  1. Gemini CLI (v0.35.0 installed) supports `--output-format json` and `--prompt` for non-interactive headless mode
  2. Gemini CLI has `--extensions ""` flag to disable all MCP extensions during invocation
  3. No Python SDK wrappers for Gemini CLI exist on PyPI (unlike acodex for Codex, codex-python-sdk for Codex)
