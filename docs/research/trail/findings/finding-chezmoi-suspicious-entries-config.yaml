id: finding-chezmoi-suspicious-entries-config
timestamp: "2026-03-29T03:52:00Z"
source: https://github.com/twpayne/chezmoi/issues
agent: researcher
finding_type: correction
confidence: probable
confident_about: |
  1. The "suspicious-entries" warning is generated by chezmoi doctor when it detects
     certain file patterns in the source directory (e.g., fsmonitor--daemon.ipc).
  2. Multiple users have encountered this warning when the chezmoi source directory lives inside a git repository that is also version-controlled.
  3. As of chezmoi v2.69.4 (latest in Feb 2026 releases), there is NO built-in config option like `[doctor.ignore]` or `chezmoi.doctor.ignoreChecks` in the configuration file.
gaps: |
  1. No evidence found of an official "ignore specific doctor checks" feature documented on chezmoi.io or in configuration schema.
  2. No upstream issue requesting this feature with a resolution or workaround.
  3. The exact code path in chezmoi's `doctorcmd.go` that generates the "suspicious-entries" check is not easily accessible online for reference.
  4. No official recommendation from chezmoi maintainers for repos where source dir is inside a managed tree.
evidence: |
  - Issue #4940 (mjec, 2026-03-04): Reporter notes "chezmoi doctor" warning about suspicious entries (.git/fsmonitor--daemon.ipc).
  - Issue #4942 (jamesharris-garmin, 2026-03-06): Shows "ok suspicious-entries no suspicious entries" when source dir is clean.
  - Issue #4968 (BradKnowles, 2026-03-20): Windows user shows "ok suspicious-entries no suspicious entries" in clean state.
  - Official chezmoi docs at https://www.chezmoi.io/reference/commands/doctor/ only mention `--no-network` flag; no mention of ignore config.
  - Official configuration reference at https://www.chezmoi.io/reference/configuration-file/ does not document any `[doctor]` or `[doctor.ignore]` section.
implication: |
  **Question 1: Does chezmoi have a config option to suppress specific doctor checks?**
  - NO, there is no documented `[doctor.ignore]` or similar config option in chezmoi's configuration file schema as of v2.69.4.

  **Question 2: Can chezmoi be configured to not flag a specific directory?**
  - INDIRECT WORKAROUND: Keep the chezmoi source outside the home directory,
    or use .gitignore to exclude system-generated files from git tracking.
  - NO official config option exists.

  **Question 3: Has anyone filed an upstream issue about this?**
  - YES: Multiple users (mjec, jamesharris-garmin) have documented the warning in their `chezmoi doctor` output on GitHub issues when the source directory is a git working tree.
  - NO DEDICATED FEATURE REQUEST: No open issue explicitly requesting a `doctor.ignore` or check-suppression feature was found.

  **Question 4: What is the official recommendation for repos where the source dir is inside the managed tree?**
  - NO OFFICIAL DOCUMENTATION FOUND: Chezmoi's documentation does not address this scenario directly.
  - IMPLICIT RECOMMENDATION: Keep the chezmoi source directory outside the home directory, or minimize git metadata files (e.g., clean git state, no submodules with fsmonitor).
  - USERS' WORKAROUND: Accept the warnings as informational and verify the source directory is otherwise healthy.

