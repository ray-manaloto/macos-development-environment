evidence: |
  **Claude Code Hook System (22 events, v2.1.81):**
  - PreToolUse: fires before ANY tool execution, can block with exit code 1
  - PostToolUse: fires after successful tool, cannot block but can set exit code
  - Stop: fires when user clicks stop button, CAN block/prevent stop
  - These are blocking events; blocking events fire before/during user action
  - Matcher field available: "matcher": "Bash" restricts hook to specific tools

  **Chezmoi Native Hook Events (from chezmoi.io):**
  - Each CLI command (add, edit, apply, update) can have pre/post hooks
  - Hooks execute via shell command or script
  - Environment variables available: CHEZMOI=1, CHEZMOI_COMMAND, CHEZMOI_COMMAND_DIR, CHEZMOI_ARGS
  - Even run on --dry-run
  - Example: [hooks.apply.post] command="echo" args=["post-apply-hook"]

  **Mise-Toolkit Plugin Guard Pattern (rsm-subagents/plugins/mise-toolkit):**
  Location: hooks/scripts/guard-install.sh
  Strategy: PreToolUse:Bash hook intercepts direct install commands (brew install, npm -g, pipx install, etc.)
  Implementation:
    - Pattern matching on blocked commands: BLOCKED_PATTERNS array
    - Regex matching: grep -qi against command string
    - Exception handling: pip install -e (editable local) is allowed
    - Error message: clear explanation + suggestion to use mise
    - Exit code 1: blocks tool execution
  Execution via hk.json:
    ```json
    {
      "hooks": {
        "PreToolUse": [
          {
            "matcher": "Bash",
            "hooks": [
              {
                "type": "command",
                "command": "bash ${CLAUDE_PLUGIN_ROOT}/hooks/scripts/guard-install.sh \"${TOOL_INPUT}\""
              }
            ]
          }
        ]
      }
    }
    ```

  **Chezmoi Daily Command Workflow:**
  - chezmoi add $FILE: home → source
  - chezmoi edit $FILE: edit source copy in $EDITOR
  - chezmoi status: summary of pending changes
  - chezmoi diff: detailed diff
  - chezmoi apply: source → home
  - chezmoi cd: shell into source directory

  Protection points in Claude Code:
  1. When user edits ~/.bashrc directly, PreToolUse could say "use chezmoi edit instead"
  2. When user runs chezmoi apply, PostToolUse could remind "did you commit changes to git?"
  3. When user stops session, Stop hook could say "don't forget to commit chezmoi changes"

  **Community Awesome Lists (No Chezmoi Hooks Found):**
  - hesreallyhim/awesome-claude-code (32.2K⭐): Lists 0 chezmoi-specific hooks
  - rohitg00/awesome-claude-code-toolkit (899⭐): 19 hooks documented, 0 chezmoi-specific
  - ccplugins/awesome-claude-code-plugins (646⭐): Lists hooks and plugins, 0 chezmoi integration
  - davepoon/buildwithclaude (2.6K⭐): Curated hub, 0 chezmoi hooks
  Conclusion: No existing community implementations to reference

implication: |
  1. **Three distinct, high-value hooks are implementable for chezmoi Claude Code plugin:**

     a) **PreToolUse:Bash "prevent direct home-dir edits" hook** (HIGHEST priority)
        - Intercepts edit/vim/nano/sed commands on files in ~/ that are chezmoi-managed
        - Suggests: "use chezmoi edit ~/.bashrc instead of direct edit"
        - Pattern: blocks if target matches files in chezmoi source state
        - Implementation: maintain list of chezmoi-managed paths, pattern-match stdin
        - Risk: false positives on unmanaged dotfiles; would need chezmoi verify output to avoid noise
        - Value: prevents drift and workflow confusion (agent might edit deployed file instead of source)

     b) **PostToolUse:Bash "remind commit after chezmoi apply" hook** (MEDIUM priority)
        - Fires after `chezmoi apply` succeeds
        - Reminds: "chezmoi changes should be committed to git"
        - Non-blocking, just a prompt/notification
        - Implementation: detect "chezmoi apply" in TOOL_INPUT, fire reminder
        - Value: keeps dotfiles repo synchronized with deployed state

     c) **Stop "commit chezmoi before exit" hook** (MEDIUM priority)
        - Fires when user clicks stop button
        - Prompts: "Do you want to commit pending chezmoi changes before stopping?"
        - CAN block the stop (exit code 1 = prevent stop)
        - Implementation: check `git status` in chezmoi source, prompt if dirty
        - Value: prevents accidentally losing uncommitted dotfiles changes
        - Risk: annoying if user *intended* to not commit (power-off, debug, etc.)

  2. **Guard pattern from mise-toolkit is directly applicable:**

     - PreToolUse hook matches tool name ("Bash" in hk.json matcher field)
     - Regex pattern matching on TOOL_INPUT or stdin
     - Exit code 1 blocks execution
     - Clear error message + suggestion
     - This exact pattern can be reused for chezmoi protection

  3. **Integration consideration: chezmoi's native hooks vs Claude Code hooks:**

     - chezmoi already has pre/post hooks (in .chezmoi.toml or chezmoi.toml)
     - Claude Code hooks fire BEFORE chezmoi CLI invocation
     - Recommendation: use Claude Code hooks for PREVENTION (stop bad commands)
     - Use chezmoi native hooks for REMEDIATION (auto-git-commit after apply, etc.)
     - No conflict; they compose well

  4. **Matcher field behavior:**

     - PreToolUse matcher="Bash" catches ALL Bash tool uses (too broad)
     - Alternative: could match on specific commands if TOOL_INPUT includes command
     - Recommendation: filter in hook script (guard-install.sh pattern) rather than matcher

  5. **Stop hook blocking implications:**

     - Stop hook can prevent user from interrupting session
     - Using it to block session exit is INTRUSIVE
     - Better approach: use as NON-blocking PostToolUse reminder, not Stop blocking
     - If using Stop: make the decision VERY clear ("Are you sure? 3 uncommitted files in .chezmoisource/")

