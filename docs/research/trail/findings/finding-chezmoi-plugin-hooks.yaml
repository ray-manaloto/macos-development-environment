# Detailed Hook Recommendation Summary

hook_recommendations:
  - hook_type: PreToolUse
    matcher: Bash
    priority: HIGH
    name: prevent-direct-dotfile-edits
    purpose: Stop agents from editing deployed dotfiles directly; enforce chezmoi workflow
    trigger_condition: |
      Bash command attempts to edit/modify files that are chezmoi-managed
      Examples: vim ~/.bashrc, nano ~/.zshrc, sed ~/.config/nvim/init.vim
    implementation_approach: |
      1. On PreToolUse Bash, extract command and target paths from TOOL_INPUT
      2. Cross-reference target against chezmoi source state (run chezmoi verify)
      3. If target is managed: block (exit code 1) + suggest chezmoi edit
      4. If target is not managed: allow (exit code 0)
    blocking_behavior: "exit code 1 blocks tool execution"
    user_experience: |
      User: vim ~/.bashrc
      Plugin: "BLOCKED: ~/.bashrc is managed by chezmoi.
               Use: chezmoi edit ~/.bashrc
               Then: chezmoi apply"
    gotchas: |
      - Performance: chezmoi verify on every Bash command could be slow
      - False positives: unmanaged files in ~/ would be allowed
      - Race condition: if user adds new file to chezmoi during session
      Mitigations:
        - Cache chezmoi managed paths at session start
        - Provide --bypass flag for emergency edits
        - Document in chezmoi-config skill
    metrics: |
      Success: agents never edit deployed dotfiles directly; all changes go through source
      Failure: performance impact if PreToolUse is too slow (baseline: mise-toolkit guards are <100ms)

  - hook_type: PostToolUse
    matcher: Bash
    priority: MEDIUM
    name: remind-chezmoi-commit
    purpose: Remind agents to commit changes to chezmoi source repo
    trigger_condition: |
      Bash command is `chezmoi apply` (successful execution)
    implementation_approach: |
      1. On PostToolUse Bash (after success), check if command was `chezmoi apply`
      2. If yes, run: git status in chezmoi source directory
      3. If any changes are staged/unstaged: emit reminder notification
      4. Include list of changed files in reminder
    blocking_behavior: "none (observational only, exit code 0)"
    user_experience: |
      User runs: chezmoi apply
      Plugin: "[Post-Apply Reminder] Chezmoi changes deployed.
               Remember to commit your changes:
               - .chezmoisource/dot_bashrc (modified)
               - .chezmoisource/dot_config/nvim/init.vim (added)

               git add .chezmoisource/
               git commit -m 'config: update bashrc and nvim config'"
    gotchas: |
      - Could be noisy if user runs chezmoi apply multiple times per session
      - PostToolUse fires after success but we need git status (two commands)
      - Reminder is informational only; agent might ignore
    metrics: |
      Success: git status in .chezmoisource/ shows 0 uncommitted files post-apply
      Soft failure: agents see reminder but don't commit (observable via git log)

  - hook_type: Stop
    matcher: null
    priority: LOW
    name: offer-commit-before-exit (optional / non-blocking variant)
    purpose: Optional notification when user is about to stop session with uncommitted chezmoi changes
    trigger_condition: |
      User clicks stop button AND chezmoi source directory has uncommitted changes
    implementation_approach: |
      Option A (Non-blocking, RECOMMENDED):
        1. Fire Stop hook, check git status in chezmoi source
        2. If dirty, emit notification with commit suggestion
        3. exit code 0 (allow stop)

      Option B (Blocking, INTRUSIVE, NOT recommended):
        1. Fire Stop hook, check git status
        2. If dirty, exit code 1 (block stop, force user to commit first)
        3. User experience: "Cannot stop: 2 uncommitted files in .chezmoisource/. Commit or discard."
    blocking_behavior: |
      Option A: exit code 0 (allow), just notifies
      Option B: exit code 1 (block), prevents stop until changes committed
    user_experience_a: |
      User clicks stop
      Plugin: "[Session Stop] You have uncommitted chezmoi changes:
               - .chezmoisource/dot_bashrc
               - .chezmoisource/dot_zshrc

               Remember to run: git add .chezmoisource/ && git commit"
      Result: session stops normally

    user_experience_b: |
      User clicks stop
      Plugin: "BLOCKED: Cannot stop with uncommitted chezmoi changes.
               Run: git add .chezmoisource/ && git commit"
      Result: session continues, user forced to commit or lose changes
    recommendation: |
      Use Option A (non-blocking reminder) — less intrusive
      Blocking Stop hook is too heavy-handed; use PostToolUse reminder instead
      If blocking is needed, better to enforce via git hooks in chezmoi repo

  - hook_type: PreToolUse
    matcher: Bash
    priority: MEDIUM-OPTIONAL
    name: warn-on-direct-mise-config-edit
    purpose: Prevent editing ~/.config/mise/config.toml directly; enforce chezmoi template
    trigger_condition: |
      Bash command attempts to edit ~/.config/mise/config.toml
      Pattern: vim/nano/sed on ~/.config/mise/config.toml
    implementation_approach: |
      1. Detect if TOOL_INPUT contains ~/.config/mise/config.toml
      2. Suggest using chezmoi edit instead (.chezmoisource/dot_config/mise/config.toml.tmpl)
      3. block (exit code 1)
    note: |
      This is a SPECIFIC case of the general prevent-direct-edits hook above.
      Implementation: could be part of same hook with special handling for mise config
      OR separate hook focused specifically on mise config (if that's the priority)
      Recommendation: include in general hook, call out mise specifically in error message

# Architecture Recommendations

hook_file_structure:
  description: "Recommended file organization for chezmoi plugin hooks"
  structure: |
    rsm-subagents/plugins/chezmoi-plugin/
    ├── hooks/
    │   ├── hooks.json (or hk.json) — hook configuration
    │   ├── scripts/
    │   │   ├── prevent-direct-dotfile-edits.sh — PreToolUse Bash guard
    │   │   ├── remind-chezmoi-commit.sh — PostToolUse Bash reminder
    │   │   ├── offer-commit-on-stop.sh — Stop hook (optional)
    │   │   └── lib/
    │   │       ├── chezmoi-helpers.sh — utility functions
    │   │       └── git-helpers.sh — git status checks
    │   └── README.md — hook documentation
    └── SKILL.md — main plugin skill file (references hooks/)

hooks_json_template: |
  {
    "hooks": {
      "PreToolUse": [
        {
          "matcher": "Bash",
          "hooks": [
            {
              "type": "command",
              "command": "bash ${CLAUDE_PLUGIN_ROOT}/hooks/scripts/prevent-direct-dotfile-edits.sh",
              "timeout": 5000
            }
          ]
        }
      ],
      "PostToolUse": [
        {
          "matcher": "Bash",
          "hooks": [
            {
              "type": "command",
              "command": "bash ${CLAUDE_PLUGIN_ROOT}/hooks/scripts/remind-chezmoi-commit.sh",
              "timeout": 3000
            }
          ]
        }
      ]
    }
  }

