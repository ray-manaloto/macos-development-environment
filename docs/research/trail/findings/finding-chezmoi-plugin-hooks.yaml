confident_about: |
  - Claude Code hook events available (22 events documented in v2.1.81)
  - PreToolUse/PostToolUse hooks have blocking capability via exit codes
  - Stop hook fires when user interrupts, can block with exit code
  - chezmoi ships its own hook system (pre/post commands per CLI event)
  - mise-toolkit plugin demonstrates guard pattern (guard-install.sh blocks direct installs)
