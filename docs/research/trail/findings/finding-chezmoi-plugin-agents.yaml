  **Safety Constraints from chezmoi-config skill (lines 10-40):**
  FORBIDDEN:
  - `chezmoi apply` — Applies changes to home directory
  - `chezmoi apply --force` — Forcefully applies changes
  - `chezmoi update` — Updates source state and may change managed files

  ALLOWED (read-only):
  - `chezmoi diff` — Preview what would change
  - `chezmoi apply --dry-run` — Simulate changes without applying
  - `chezmoi doctor` — Check configuration validity
  - `chezmoi data` — Display template data variables
  - `chezmoi managed` / `unmanaged` / `ignored` — List operations
  - `chezmoi execute-template < file.tmpl` — Preview expanded template output
  - `chezmoi verify` — Verify source state integrity (DRIFT DETECTION)

  **Drift Detection from src/mde/validate/chezmoi.py (lines 33-50):**
  ```python
  def _check_chezmoi_verify(result: ValidationResult) -> None:
      """Run chezmoi verify to detect drift."""
      try:
          proc = subprocess.run(
              ["chezmoi", "verify", "--exclude=scripts"],
              capture_output=True,
              text=True,
              timeout=30,
          )
          if proc.returncode != 0:
              result.add(
                  path="chezmoi",
                  message="chezmoi verify detected drift",
                  severity=Severity.WARNING,
                  rule="chezmoi.drift",
              )
  ```
  — Already integrated into `uv run mde-py validate --all`. Agent should leverage this.

