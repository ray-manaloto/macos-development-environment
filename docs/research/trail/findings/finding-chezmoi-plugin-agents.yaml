implication: |
  1. **Chezmoi-specialist agent needs enhancement for plugin context:**
     - Add 5-6 explicit <example> blocks (like mise-specialist) showing when to trigger agent
     - Include <commentary> lines explaining which skill applies to each scenario
     - Document when chezmoi-specialist coordinates with mise-specialist (template edits to .chezmoisource/dot_config/mise/)

  2. **Proactive triggers for chezmoi plugin should be:**
     - **Direct edit detection**: When user edits a file known to be chezmoi-managed (~/.zshrc, ~/.gitconfig, ~/.config/*, etc.), agent detects via `chezmoi unmanaged` and suggests `chezmoi add` + template conversion
     - **Drift alerts**: When `uv run mde-py validate --all` reports "chezmoi.drift", agent auto-activates to diagnose via `chezmoi diff` and `chezmoi status`
     - **Template syntax errors**: When user attempts to edit .chezmoisource/*.tmpl files, agent validates via `chezmoi execute-template` before apply
     - **Cross-platform config**: When adding new dotfile, agent detects if it's OS-conditional (e.g., .gitconfig with credential.helper) and suggests `.tmpl` conversion + template syntax
     - **Secret detection**: When `chezmoi-config` skill finds plaintext secrets in source, agent suggests moving to password manager template syntax

  3. **Tools for chezmoi plugin agent:**
     - **Must have**: Read, Glob, Grep, Bash (same as current specialist)
     - **Should add**: Write, Edit (for template creation via agent)
     - **Must NOT have**: WebFetch, WebSearch (current constraints correct)

  4. **Model selection for chezmoi plugin:**
     - **Option A (current)**: Haiku — fast for status checks, diff reading, validation
     - **Option B**: Inherit (like mise-specialist) — defers to controller's model, better for complex template work
     - **Recommendation**: Keep Haiku for plugin default (speed), but allow controller to override for template-heavy workflows

  5. **Skills referenced should be exact:**
     - chezmoi-config — comprehensive (read-only mode, safe)
     - chezmoi-workflows — comprehensive (14 task sections)
     - Consider adding: chezmoi-drift-detection (new skill, wraps `chezmoi verify` and suggests remediation), chezmoi-template-validation (new skill, tests template syntax and previews output)

  6. **Safety constraints for plugin agent:**
     - **FORBIDDEN**: NEVER run `chezmoi apply`, `chezmoi apply --force`, `chezmoi update` without explicit user approval via comment "apply this change"
     - **MANDATORY WORKFLOW**: Run `chezmoi diff` first, show diff to user, wait for approval before any apply
     - **VALIDATION SLO**: Always end chezmoi operations with `chezmoi verify` or `chezmoi doctor` to confirm integrity
     - **Multi-machine awareness**: If .chezmoi.os or .chezmoi.hostname differ from user's current machine, warn before applying templates

  7. **Integration with mise-specialist:**
     - When editing `.chezmoisource/dot_config/mise/config.toml.tmpl`, chezmoi-specialist should coordinate with mise-specialist
     - After template changes: chezmoi-specialist runs `chezmoi diff` (dry-run preview), then mise-specialist validates .toml syntax
     - Pipeline: chezmoi edit → chezmoi diff → mise validation → user approval → chezmoi apply → mise install → mise lock

  8. **Detection of managed files (for auto-trigger logic):**
     - Use `chezmoi managed` to build cache of files agent should monitor
     - On user edit of cached file: check `chezmoi status` for "modified" flag, suggest `chezmoi add` or template update
     - This enables proactive pattern: "I see you edited ~/.zshrc (chezmoi-managed). Should I sync this change to source?"

  9. **Plugin architecture differences from standalone agent:**
     - **Standalone agent**: Responds to explicit user invocation ("use the chezmoi-specialist")
     - **Plugin agent**: Should be embedded in plugin.json with triggers (file globs, file-modified events, validate --all drift reports)
     - **Skills remain same**: Both plugin and standalone use chezmoi-config and chezmoi-workflows skills
     - **Model stays same**: Haiku for performance, inherited model for complex template work

