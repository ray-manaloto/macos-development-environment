evidence: |
  **Installation (macOS via Homebrew):**
  ```bash
  brew install gnupg
  brew install dopplerhq/cli/doppler
  doppler --version
  doppler update  # for upgrades
  ```

  **Local Development Setup:**
  ```bash
  doppler login                    # Browser-based auth, once per workspace
  cd /your/project
  doppler setup                    # Interactive: select project + config
  # Optional: create doppler.yaml for automation
  ```

  **doppler.yaml (optional declarative setup):**
  ```yaml
  setup:
    - project: example
      config: dev_personal
  ```

  **Secrets Injection:**
  ```bash
  doppler run -- your-command-here
  doppler run --command="./configure && ./process-jobs; ./cleanup"
  # Access in code: process.env["SECRET_NAME"], os.getenv("SECRET_NAME"), etc.
  ```

  **Service Tokens (for production/CI):**
  ```bash
  doppler setup  # Select project/config first
  doppler configs tokens create token-name --plain
  # Or in one command:
  doppler configs tokens create --project your-project --config your-config token-name --plain
  ```

  **Three ways to use Service Token:**
  1. Persisted (best for VMs): `doppler configure set token --scope /usr/src/app`
  2. Environment variable: `export DOPPLER_TOKEN='dp.st.prd.xxxx'`
  3. CLI flag: `doppler run --token='dp.st.prd.xxxx' -- command`

  **Ephemeral Service Token (auto-delete after duration):**
  ```bash
  export DOPPLER_TOKEN=$(doppler configs tokens create ephemeral-token --max-age 1m --plain)
  ```

  **Pricing Tiers:**
  - Developer: Free for 3 users, $8/mo per additional user
    - 5 config syncs, 3-day activity logs, CLI, service tokens, API access
  - Team: Free for 14 days, then $21/mo per user
    - 100 config syncs, 90-day logs, SAML SSO, secret rotation, change requests
  - Enterprise: Custom pricing
    - Unlimited syncs, EKM, dynamic secrets, 99.95% SLO

  **Integrations (20+ platforms):**
  - Cloud: AWS (Parameter Store, Secrets Manager), Azure (Key Vault, App Service), GCP, DigitalOcean
  - CI/CD: GitHub Actions, GitLab CI, CircleCI, Bitbucket, Codefresh
  - Platforms: Heroku, Render, Vercel, Netlify, Railway, Fly.io, Kubernetes, Docker
  - Infrastructure: Terraform Cloud, supabase, Laravel Forge, Cloudflare Pages

  **Architecture Concepts:**
  - Workplace: Your organization in Doppler (multi-tenant)
  - Project: Logical grouping of secrets (e.g., "api-service", "frontend")
  - Config: Environment within project (e.g., "dev_personal", "staging", "production")
  - Secrets: Key-value pairs stored in a specific config
  - Config Syncs: Integrations that push secrets to external platforms
  - Service Token: Read-only credential scoped to single config; best practice for production
  - Fallback File: Encrypted local cache (~/.config/doppler/fallback.json) enables offline access

  **API Access:**
  - REST API with auth token formats: personal, service, OIDC
  - Postman collection available
  - Endpoints for: workplaces, users, projects, configs, secrets, tokens, integrations

implication: |
  **For your solo developer setup:**

  1. **Doppler as primary source of truth:** Use Doppler Dashboard or API as the canonical store. Pros: cloud backup, 20+ integrations, RBAC-ready (if expanding team), encrypted fallback for offline use. Cons: requires internet for initial fetch, not local-first like Keychain.

  2. **fnox+Keychain as local cache:** fnox already syncs with Keychain. Consider wrapping doppler run to populate Keychain cache on startup (for offline use cases). Cons: bidirectional sync would require custom tooling.

  3. **Doppler-first with Keychain fallback pattern:**
     - Primary: `doppler run -- <command>` (Doppler is source of truth)
     - Fallback: Use encrypted fallback file if offline (built-in, no extra config)
     - Optional: fnox push to Keychain for native macOS integration (requires custom wrapper)

  4. **Import strategy (not documented):** No bulk import endpoint found in docs. Workaround: Use Doppler Dashboard UI to manually add secrets, OR use API to script bulk creation:
     ```bash
     curl -X POST https://api.doppler.com/v3/configs/config_id/secrets \
       -H "Authorization: Bearer $DOPPLER_TOKEN" \
       -d '{"name": "KEY", "value": "value"}'
     ```

  5. **mise integration gaps:** Doppler doesn't have native mise task support. To integrate with mise:
     - Create `.doppler.yaml` in project root with project+config
     - Wrap doppler CLI in a mise task: `[tasks.dev] run = "doppler run -- <dev-command>"`
     - Or: Load doppler secrets into env before mise task: `export $(doppler secrets download --no-file -z 2>/dev/null)`

  6. **Comparison with fnox+Keychain:**
     | Feature | Doppler | fnox+Keychain |
     |---------|---------|---------------|
     | Cloud sync | Yes (multi-platform) | No (local only) |
     | Team RBAC | Yes (built-in) | No (local only) |
     | Offline access | Encrypted fallback | Native macOS |
     | API automation | Yes (Postman + REST) | Limited (CLI only) |
     | Import from fnox | Manual or custom script | N/A |
     | Cost | Free-$21/user | $0 (built-in) |
     | Integrations | 20+ platforms | None (Keychain-locked) |
     | Secret rotation | Team+ plan | Manual |

  7. **Recommendation for your context:**
     - If solo dev + local-first preference: Keep fnox+Keychain (no cloud dependency)
     - If planning team scaling or want integrations: Migrate to Doppler + use Keychain for offline backup
     - If hybrid: Doppler primary (cloud source of truth) + fnox wrapper to sync to Keychain locally

  8. **Next steps needed:**
     - Test Doppler free tier to confirm 3-user limit doesn't apply to solo dev
     - Verify API bulk secrets endpoint (docs preview was truncated)
     - Design fnox↔Doppler sync wrapper if planning hybrid approach
     - Check if mise has context7 docs for Doppler-specific tasks

