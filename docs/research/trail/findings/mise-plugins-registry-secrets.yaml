confident_about: |
  1. **Plugin System Architecture**: Mise's plugin system is built on git clones of plugin repos.
     Plugins are installed via `mise plugins install <name> [git-url]`, auto-discovery via shorthand
     (e.g., `mise install cmake` auto-installs cmake plugin if not present).
     Plugins can use Lua hooks or shell scripts for integration.

  2. **asdf Compatibility**: Mise plugins are largely asdf-compatible but not 100%. The plugin registry
     shows both asdf and mise implementations for most tools (e.g., eza can be installed via
     asdf:lwiechec/asdf-eza or mise:mise-plugins/mise-eza). Mise has extended asdf with Lua-based
     hooks (mise_env.lua, etc.) for richer env var handling.

  3. **Plugin Hook System**: Plugins expose hooks via Lua scripts (e.g., mise_env.lua, metadata.lua).
     The fnox-env plugin example shows a plugin can:
     - Dynamically load config (fnox config-files)
     - Parse output (JSON) and inject env vars
     - Set redact=true to hide sensitive values in logs
     - Cache results and watch files for changes (cacheable, watch_files)

  4. **Secrets Management via Plugins**: Mise does not have native secrets vault; instead it uses
     plugin system for secrets. The fnox-env plugin is the recommended pattern:
     - Plugin calls fnox to export secrets in JSON format
     - Secrets are injected into environment with redact=true
     - Uses profile-based filtering (dev vs production profiles)
     - Supports environment-specific config (mise.<ENV>.toml)
     - Cacheable with file watching for security updates

  5. **Registry System**: Mise maintains a unified registry of 100+ tools with multiple backend
     options per tool. Registry format shows:
     - Tool name (e.g., "jq")
     - Available backends: aqua, asdf, cargo, github, npm, pipx, vfox, http, s3, etc.
     - Each backend can provide the tool (e.g., jq available via aqua OR asdf OR cargo)
     - Registry is at ~/.local/share/mise/registry.db (queried via `mise registry`)

  6. **Backends**: 18 supported backends:
     - aqua (OSS registry), asdf (legacy), cargo (Rust), conda, core, dotnet, forgejo, gem,
     github (direct release), gitlab, go, npm, pipx, spm, http, s3, ubi (deprecated), vfox
     - Each backend has configuration settings (e.g., aqua.baked_registry, aqua.cosign)
     - Can disable backends: disable_backends=[] setting

  7. **Environment Management**: Multi-environment support via mise.<ENV>.toml files:
     - [env] section for base environment
     - [env.production] section for production-specific overrides
     - Plugins can access environment name and customize behavior
     - Settings: hook_env.cache_ttl (default 0s), hook_env.chpwd_only (false)

  8. **Redaction & Secrets Patterns**:
     - Plugins can return {redact=true} to hide env vars in logs
     - mise env --redacted flag shows only redacted values
     - No built-in _.file or _.path patterns like some other tools; secrets come via plugins
     - fnox integration is the primary secrets pattern (via fnox-env plugin)

  9. **Environment Variables**:
     - mise env -J exports as JSON with key/value pairs
     - mise env --json-extended shows source information
     - GIT_TERMINAL_PROMPT=0 prevents interactive git prompts (security best practice)
     - Env vars can be set directly in [env] section of config.toml or via plugins

  10. **Registry Customization**: Can disable default registry (disable_default_registry=false)
      and add custom backends. Specific backend settings:
      - aqua.baked_registry: use pre-built registry instead of fetching
      - pipx.registry_url: customizable PyPI mirror
      - dotnet.registry_url: customizable NuGet mirror
      - go_download_mirror: customizable Go download mirror

evidence: |
  - fnox-env plugin source code: ~/.local/share/mise/plugins/fnox-env/hooks/mise_env.lua
    shows Lua-based hook pattern with JSON parsing, file watching, and redact flag
  - Config file: ~/.config/mise/config.toml has [plugins] section with fnox-env URL,
    [env] section with plugin configuration, and [settings] for backend options
  - mise plugins ls output shows 3 installed plugins (1password-cli, eza, fnox-env)
  - mise registry output shows tool entries with backend priorities (aqua, asdf, etc.)
  - mise backends ls shows 18 available backends
  - mise settings ls --all shows 100+ configurable options including backend-specific ones
  - mise env -J shows JSON export of environment vars
  - Lock file (mise.lock) contains platform-specific URLs and checksums for reproducibility

implication: |
  1. **For Team Development**: Use plugins (fnox-env) instead of shell scripts for secrets.
     This provides redaction, caching, multi-environment support, and centralized secrets management.
     Store plugin config in mise.toml, not scattered across shell aliases.

  2. **For Cross-Platform Teams**: Use backend preference lists in registry. Multiple backends
     per tool means teams can have platform-specific preferences (e.g., asdf on Linux, aqua on macOS)
     without forking tools.

  3. **For Secrets Management**: Deprecate direct env var storage. The fnox-env plugin pattern is:
     - Install fnox via mise: "github:jdx/fnox" = "latest"
     - Configure fnox with .fnox/config
     - Enable fnox-env plugin: [plugins] fnox-env = "https://github.com/jdx/mise-env-fnox"
     - Set [env] _.fnox-env = { tools = true, profile = "dev" }
     This gives you profile-based secrets, redaction, caching, and portability.

  4. **For Plugin Development**: Follow Lua hook pattern (mise_env.lua with PLUGIN:MiseEnv function).
     Plugin.metadata.lua declares dependencies and version. Plugins support shell scripts OR Lua.
     Use file watching for config-driven tools (like fnox config files).

  5. **For Registry Customization**: Use baked registries (aqua.baked_registry=true) for air-gapped
     environments. Can also use S3/HTTP backends for private tool repositories.

  6. **Limitation**: Mise registry is tool-centric, not environment-centric. Use mise.<ENV>.toml
     for environment-specific tool versions/configurations, but plugin behavior must be parameterized
     (e.g., profile="dev" vs profile="production").

