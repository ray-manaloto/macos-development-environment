confident_about: |
  1. **SDK Installation**: Python package `honcho-ai` available via pip/uv, TypeScript package `@honcho-ai/sdk` via npm/yarn/pnpm
  2. **Client Initialization**: Honcho client created with workspace_id and api_key, points to api.honcho.dev by default
  3. **Core Entities**: Workspaces (top-level containers) -> Peers (users/agents) -> Sessions (interaction threads) -> Messages (units of data)
  4. **Core Operations**: Create peers with honcho.peer(), create sessions with honcho.session(), add messages with session.add_messages()
  5. **Memory Access**: Query via chat endpoint (peer.chat()), get context (session.context()), search messages (peer.search()), get representations (session.representation())
  6. **Session Management**: Sessions provide temporal boundaries, cross-session peer context, multi-peer support, async background reasoning with PostgreSQL storage
