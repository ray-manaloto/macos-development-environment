evidence: |
  **Installation** (from quickstart):
  - Python: `pip install honcho-ai` or `uv add honcho-ai`
  - TypeScript: `npm install @honcho-ai/sdk`

  **Client Init** (Python example):
  ```python
  from honcho import Honcho
  honcho = Honcho(workspace_id="first-honcho-test", api_key=HONCHO_API_KEY)
  ```

  **Peer Operations**:
  - Create: `user = honcho.peer("user")`
  - Chat: `response = alice.chat("What learning styles does the user respond to best?")`
  - Search: `results = alice.search("Math Homework")`

  **Session Operations**:
  - Create: `session = honcho.session("session-1")`
  - Add messages: `session.add_messages([alice.message("text"), tutor.message("text")])`
  - Get context: `context = session.context(summary=True, tokens=10_000)`
  - Convert to LLM format: `openai_messages = context.to_openai(assistant=tutor)`
  - Get representation: `alice_representation = session.representation(alice)`

  **Architecture** (from docs):
  - Data flow: Messages written to PostgreSQL -> Background reasoning triggered -> Conclusions stored in vector collections -> Agents query for context
  - Reasoning is async and non-blocking
  - Workspace-level authentication and configuration
  - Session-level perspective-taking configuration options
  - Support for batch create up to 100 messages per call

  **Self-Hosting** (from GitHub):
  - Requires: Python 3.9+, uv 0.4.9+, PostgreSQL with pgvector
  - Config: .env file with DB_CONNECTION_URI and LLM provider keys (Anthropic, OpenAI, Gemini, Groq)
  - Docker Compose setup available via docker-compose.yml.example
implication: |
  For mde integration:
  1. Honcho can be added as Python dependency (honcho-ai) alongside existing loguru logging
  2. Self-hosted option enables local development without managed service for iterative work
  3. Peer/Session/Message model maps cleanly to agent memory patterns (peer = agent state, session = interaction context)
  4. Async reasoning architecture means no blocking on message writes - compatible with async event-driven design
  5. Multiple LLM provider support (Anthropic, OpenAI, Gemini, Groq) allows flexible backend switching
  6. Vector storage backend enables semantic search alongside traditional message history
