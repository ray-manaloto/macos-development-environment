agent: researcher
finding_type: pattern
confidence: confirmed
confident_about: |
  Five production self-improving agent frameworks exist with measurable economic impact.
  All share a closed-loop pattern: task execution → failure detection → skill reflection → skill rewriting → library update.
  Token savings 46-56% over baseline in Phase 2 when skills are pre-warmed.
  Three distinct skill evolution architectures: deployment-time (Memento), performance monitoring (OpenSpace), user modeling (Hermes).
gaps: |
  How these systems handle skill versioning conflicts (when old+new skills both valid).
  Optimal skill indexing/retrieval thresholds for libraries >1000 skills.
  Whether dream consolidation works for skill memory (not just session memory).
  Integration with agent team architectures (multi-agent skill sharing).
  How to measure skill quality across heterogeneous tasks.
evidence: |
  OpenSpace: "46% fewer tokens" on GDPVal (50 professional tasks), 4.2× higher earnings vs ClawWork baseline.
  Memento: HLE/GAIA benchmarks show progressive improvement over learning rounds; skill library grows with learned skills, not just tool accumulation.
  Hermes: "only agent with a built-in learning loop"; creates skills from experience, improves during use, periodically nudges persistence.
  HyperAgents: Meta-agent optimizes task agents with self-referential improvements; requires code execution risk tolerance.
  Dream consolidation prompt: Four-phase consolidation (orient → gather → consolidate → prune) for session memory management.
implication: |
  For mde's autonomous review system (in Phase 0d re-run): implement a minimal read-write reflection loop for debate/review skills.
  Skills should be indexed by semantic similarity (not just string matching) to avoid retrieval failures in large libraries.
  Session memory (Claude Code) can use dream consolidation; skill memory needs separate versioning strategy.
  Monitor skill utility after each task execution; rewrite skills with <0.6 utility or >2 consecutive failures.
  Reward signal should be economic (cost/quality ratio) not just quality, matching OpenSpace and Hermes patterns.
