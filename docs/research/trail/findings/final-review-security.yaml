# New Issues Introduced by Fixes

NEW_01_stop_orphan_collectors_no_timeout_exception_handling:
  severity: P2
  status: FINDING
  file: src/mde/domain/observability_stack.py
  lines: 38-42
  description: >
    stop_orphan_collectors() has a timeout=30 on the `docker stop` call
    (line 40) but does NOT catch subprocess.TimeoutExpired. If a container
    hangs during stop, the exception propagates up to stack_up() which also
    does NOT catch it (stack_up only catches TimeoutExpired from its own
    subprocess.run at line 69-75). The orphan-stop call at line 66 is
    outside that try block.
  impact: >
    A hung orphan container causes stack_up() to raise an uncaught
    TimeoutExpired, which bubbles to docker_aggregate.py's stack_up()
    where it IS caught (line 33-35). So the failure is not silent —
    it will be reported as "TIMEOUT: observability stack_up" — but
    the error message is misleading: it implies the Compose up timed out,
    not that an orphan container removal hung.
  recommendation: >
    Wrap the docker stop call in stop_orphan_collectors with a try/except
    subprocess.TimeoutExpired and print a targeted message, or add a
    try/except around the stop_orphan_collectors() call in stack_up().

NEW_02_verify_health_check_no_network_timeout:
  severity: P3
  status: FINDING
  file: src/mde/domain/memory_stack.py
  lines: 103-104
  description: >
    The honcho-api health check command (lines 103-104) calls
    urllib.request.urlopen without a timeout argument inside the container.
    The outer subprocess timeout=15 covers the docker exec invocation, but
    if the container is running and the HTTP server is accepting connections
    but not responding, urllib.request.urlopen will block indefinitely inside
    the container until the 15s subprocess timeout fires. This is acceptable
    behavior but differs from the compose.yaml healthcheck which passes
    timeout=3. Minor inconsistency — the verify check is slightly more
    permissive than the healthcheck definition.
  recommendation: >
    Add timeout=10 to urlopen for consistency with compose.yaml healthcheck.
    Not a blocking issue.

