SR_04_strip_on_passwords:
  status: VERIFIED
  description: >
    memory_stack.py line 28: password = os.environ.get("HONCHO_DB_PASSWORD", "").strip()
    observability_stack.py line 52: password = os.environ.get("GRAFANA_PASSWORD", "").strip()
    Both password reads use .strip(). Edge case analysis: .strip() on an
    empty string returns empty string (no breakage). On a password that
    legitimately contains leading/trailing whitespace (unusual but valid),
    strip() would incorrectly accept a whitespace-only value or trim a real
    password. However the trimmed value is only used for the truthiness check
    (not passed to docker), so worst case is a false-positive empty-password
    detection on whitespace-only env vars, which is correct behavior.
    No regression introduced.

