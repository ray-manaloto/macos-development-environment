## Key Design Decisions

### 1. Monorepo vs. Multi-Repo
**Decision**: Monorepo (rsm-subagents) with plugins/ subdirectories.
**Rationale**: Easier to maintain shared patterns, unified CI/CD, simpler marketplace.json management, single source-of-truth for plugin registry.

### 2. Backwards Compatibility
**Decision**: Semantic versioning (MAJOR.MINOR.PATCH) for each plugin independently.
**Rationale**: Plugins are independent; version mismatches won't break the marketplace.

### 3. Extraction vs. Duplication
**Decision**: Extract from mde project, don't duplicate.
**Rationale**: Avoid drift between mde agents/skills and marketplace plugins. Update mde project first, then sync to marketplace.

### 4. Hook Policy
**Decision**: Each plugin can include hooks but should be minimal and scoped.
**Rationale**: Hooks change Claude Code behavior globally; minimize surprises. Document all hooks in plugin README.

### 5. Skill Reusability
**Decision**: Skills can be shared across plugins if they form a cohesive domain.
**Rationale**: mise-toolkit reuses all 8 skills; chezmoi-toolkit reuses 2. No need to isolate.

