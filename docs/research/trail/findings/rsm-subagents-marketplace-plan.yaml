}
```

## Plugin Installation & Discovery

### Installation via Claude Code
```bash
# From marketplace (once published)
/plugin marketplace add ray-manaloto/mise-toolkit
/plugin install mise-toolkit

# Local development
cc --plugin-dir /path/to/rsm-subagents/plugins/mise-toolkit

# All plugins at once
cc --plugin-dir /path/to/rsm-subagents/plugins/*
```

### Plugin Metadata (plugin.json)
Each plugin must include `.claude-plugin/plugin.json`:
```json
{
  "name": "mise-toolkit",
  "version": "1.0.0",
  "agents": ["mise-specialist"],
  "skills": ["mise-tool-management", "mise-tasks", ...],
  "hooks": ["guard-install"],
  "requiredFeatures": ["claude-code-2.0"],
  "marketplace": {
    "id": "ray-manaloto/mise-toolkit",
    "description": "...",
    "tags": ["mise", "tool-management"],
    "installCommand": "/plugin add ray-manaloto/mise-toolkit"
  }
}
```

