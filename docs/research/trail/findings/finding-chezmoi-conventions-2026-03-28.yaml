questions_for_follow_up:
  - Should .zshrc be added to chezmoi management? Risk: chezmoi apply could
    overwrite manual customizations. Benefit: drift detection, reproducibility.
  - Should .gitconfig be managed? It likely has machine-specific settings
    (user.email, credential.helper) that belong in templates.
  - Can .chezmoiignore be added to suppress suspicious-entries doctor warning?
  - Does the bootstrap gap matter? Does anyone actually clone this repo on a
    fresh machine, or is it only applied on the existing machine?
  - Would splitting into a dedicated dotfiles repo (separate from mde Python
    package) eliminate the mixing friction?
