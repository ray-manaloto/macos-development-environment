  ## pi-mono Registry Pattern (Best Type Safety)

  ### Architecture
  ```typescript
  // Model registry with full type safety
  export interface Model<TApi extends Api> {
      id: string
      provider: KnownProvider
      displayName: string
      description?: string
      cost: { input: number, output: number, ... }
      supportsTools: boolean
      supportsImages: boolean
      supportsThinking: boolean
      thinkingLevels?: ('off' | 'low' | 'medium' | 'high' | ...)[]
  }

  // Fully typed model retrieval
  const model = getModel('openai', 'gpt-4o-mini')  // Type: Model<OpenAIApi>
  const model2 = getModel('anthropic', 'claude-3-sonnet')  // Type: Model<AnthropicApi>

  // Generic across providers
  export function getModels<TProvider extends KnownProvider>(
      provider: TProvider,
  ): Model<ModelApi<TProvider, keyof MODELS[TProvider]>>[]
  ```

  ### Streaming with Events
  ```typescript
  const s = stream(model, context)

  for await (const event of s) {
      switch (event.type) {
          case 'text_start': console.log('[Text started]'); break
          case 'text_delta': process.stdout.write(event.delta); break
          case 'text_end': console.log('[Text ended]'); break
          case 'thinking_start': console.log('[Thinking...]'); break
          case 'thinking_delta': process.stdout.write(event.delta); break
          case 'toolcall_start': console.log(`[Tool: ${event.toolCall.name}]`); break
          case 'toolcall_delta': console.log('[Streaming args]'); break
          case 'toolcall_end': console.log(`Args: ${JSON.stringify(event.toolCall.arguments)}`); break
          case 'done': console.log(`Reason: ${event.reason}`); break
          case 'error': console.error(`Error: ${event.error}`); break
      }
  }

  const finalMessage = await s.result()
  ```

  ### Tool Definition with TypeBox
  ```typescript
  import { Type } from '@mariozechner/pi-ai'

  const tools: Tool[] = [{
      name: 'get_time',
      description: 'Get current time',
      parameters: Type.Object({
          timezone: Type.Optional(Type.String({
              description: 'e.g., America/New_York'
          }))
      })
  }]

  // Note: Use StringEnum for Google compatibility, not Type.Enum
  const weatherTool: Tool = {
      name: 'get_weather',
      parameters: Type.Object({
          location: Type.String(),
          units: StringEnum(['celsius', 'fahrenheit'], { default: 'celsius' })
      })
  }
  ```

  ### Cross-Provider Handoff (Unique to pi-mono)
  ```typescript
  // Context is serializable/transferable
  const context: Context = {
      systemPrompt: '...',
      messages: [...],
      tools: [...]
  }

  // Send to Model A
  const response1 = await complete(modelA, context)
  context.messages.push(response1)

  // Hand off to Model B
  const response2 = await complete(modelB, context)
  context.messages.push(response2)

  // Continue with Model C, etc.
  ```

