confident_about: |
  - Two distinct production patterns exist: provider-factory (opencode) and registry (pi-mono)
  - Both handle tool calling, streaming, usage tracking, and session management
  - Provider-factory is more extensible for custom consensus layers
  - Registry pattern is more type-safe across heterogeneous API shapes
  - Tool execution can be sequential or parallel (opencode explicitly supports cancellation)

gaps: |
  - No consensus/voting mechanisms visible in production codebases
  - Disagreement resolution strategies not documented
  - Cost optimization across models not addressed
  - Failover/retry patterns only partially visible

