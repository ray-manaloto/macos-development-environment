  ## opencode Provider-Factory Pattern (Most Suitable for Consensus)

  ### Architecture
  ```go
  // Provider interface (unified)
  type Provider interface {
      SendMessages(ctx, messages, tools) (*ProviderResponse, error)
      StreamResponse(ctx, messages, tools) <-chan ProviderEvent
      Model() Model
  }

  // Factory creates type-specific client
  type baseProvider[C ProviderClient] struct {
      options providerClientOptions
      client  C  // AnthropicClient | OpenAIClient | GeminiClient | CopilotClient | ...
  }

  func NewProvider(providerName string, opts ...ProviderClientOption) (Provider, error) {
      switch providerName {
      case models.ProviderCopilot:
          return &baseProvider[CopilotClient]{...}
      case models.ProviderAnthropic:
          return &baseProvider[AnthropicClient]{...}
      // ... more providers
      }
  }
  ```

  ### Concrete Example: Instantiating Multiple Models
  ```go
  // Create agents for consensus
  agents := map[string]Provider{}

  for _, modelName := range []string{
      models.ModelClaude3Sonnet,
      models.ModelGemini2Pro,
      models.ModelGPT4Turbo,
  } {
      model := models.SupportedModels[modelName]
      provider, err := NewProvider(model.Provider,
          WithModel(model),
          WithAPIKey(apiKey),
          WithSystemMessage(prompt),
      )
      agents[modelName] = provider
  }

  // Stream from all in parallel
  type AgentResult struct {
      model string
      response *ProviderResponse
      err error
  }

  results := make([]AgentResult, 0)
  for name, agent := range agents {
      go func(n string, a Provider) {
          resp, err := a.SendMessages(ctx, messages, tools)
          results = append(results, AgentResult{n, resp, err})
      }(name, agent)
  }
  ```

  ### Tool Execution Loop (Sequential + Parallel)
  ```go
  // From agent.go: streamAndHandleEvents

  // Tool calls collected from streaming response
  toolCalls := assistantMsg.ToolCalls()  // []ToolCall

  // Sequential execution with early cancellation:
  for i, toolCall := range toolCalls {
      select {
      case <-ctx.Done():
          // Cancel remaining tools
          for j := i; j < len(toolCalls); j++ {
              toolResults[j] = ToolResult{
                  ToolCallID: toolCalls[j].ID,
                  Content: "Tool execution canceled by user",
                  IsError: true,
              }
          }
          goto out
      default:
          toolResult, err := tool.Run(ctx, toolCall)
          toolResults[i] = ToolResult{
              ToolCallID: toolCall.ID,
              Content: toolResult.Content,
              IsError: err != nil,
          }
      }
  }

  // With parallel execution possible via goroutines:
  wg := sync.WaitGroup{}
  for i, toolCall := range toolCalls {
      wg.Add(1)
      go func(idx int, tc ToolCall) {
          defer wg.Done()
          tool.Run(ctx, tc)  // Parallel execution
      }(i, toolCall)
  }
  wg.Wait()
  ```

  ### Event Stream Types
  ```go
  type ProviderEvent struct {
      Type EventType  // content_start, tool_use_start, tool_use_delta, tool_use_stop,
                      // content_delta, thinking_delta, content_stop, complete, error
      Content string
      Thinking string
      ToolCall *ToolCall
      Response *ProviderResponse
      Error error
  }
  ```

  ### Cost Tracking (Built-in)
  ```go
  func (a *agent) TrackUsage(ctx, sessionID string, model Model, usage TokenUsage) error {
      sess, _ := a.sessions.Get(ctx, sessionID)

      // Calculate cost per model
      cost := model.CostPer1MInCached/1e6*float64(usage.CacheCreationTokens) +
              model.CostPer1MOutCached/1e6*float64(usage.CacheReadTokens) +
              model.CostPer1MIn/1e6*float64(usage.InputTokens) +
              model.CostPer1MOut/1e6*float64(usage.OutputTokens)

      sess.Cost += cost
      sess.CompletionTokens = usage.OutputTokens + usage.CacheReadTokens
      sess.PromptTokens = usage.InputTokens + usage.CacheCreationTokens

      a.sessions.Save(ctx, sess)
  }
  ```

