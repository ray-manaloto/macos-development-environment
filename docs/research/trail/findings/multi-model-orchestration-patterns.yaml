  ### Recommended Multi-Model Consensus Architecture for Your Project

  **Hybrid Approach: opencode factory + consensus layer**

  1. **Provider wrapper per CLI (subprocess)**
     ```go
     // src/mde/llm/codex_wrapper.go
     type CodexProvider struct {
         cmd *exec.Cmd
         stdin io.WriteCloser
         stdout io.ReadCloser
     }

     func (p *CodexProvider) Run(ctx context.Context, prompt string) (*RunResult, error) {
         // Write prompt to stdin, parse JSONL events from stdout
     }

     // Similar: GeminiProvider, ClaudeProvider
     ```

  2. **Consensus orchestrator**
     ```go
     type ConsensusOrchestrator struct {
         providers map[string]Provider  // codex, gemini, claude
         timeout time.Duration
     }

     func (o *ConsensusOrchestrator) RunConsensus(ctx, prompt) (string, error) {
         results := make(map[string]*Result)

         // Stream from all in parallel
         for name, provider := range o.providers {
             go func(n string, p Provider) {
                 stream := p.StreamResponse(ctx, prompt)
                 results[n] = collectEvents(stream)
             }(name, provider)
         }

         // Vote on best result
         return o.voteBest(results)
     }
     ```

  3. **Event aggregation per provider**
     - Collect `ItemCompletedEvent`, `TurnCompletedEvent` from each
     - Parse `structured_response` or fallback to `final_response`
     - Compare across models (token count, reasoning, tool calls)

  4. **Cost tracking**
     - Track usage per provider
     - Sum or compare costs vs accuracy
     - Implement cost-based ranking for future calls

  **Alternative: TypeScript Port with pi-mono Patterns**
  - More effort, but gives you full type safety across models
  - Better for long-term maintainability
  - Easier integration with Node.js ecosystem tools

