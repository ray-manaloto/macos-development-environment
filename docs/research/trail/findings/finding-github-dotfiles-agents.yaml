gaps: |
  CONFIRMED MISSING PATTERNS (from other repos):

  1. **Drift Detection & Reconciliation**
     - No repos implement `chezmoi verify` + automated repair
     - No drift detection between deployed state and source truth
     - No automated alerting when `chezmoi verify` fails

  2. **Lifecycle Coordination (chezmoi → mise → brew)**
     - pelted/.dotfiles: mise, zoxide, fzf (no coordinator)
     - barnabasJ/dotfiles: agents folder + commands (no lifecycle)
     - guaje/dotfiles: chezmoi + age (no mise coordination)
     - No single repo coordinates all three: brew install → mise tasks → chezmoi apply

  3. **Secret Rotation & Expiration Monitoring**
     - pelted/.dotfiles: 1Password integration (read-only)
     - guaje/dotfiles: age + fnox (static encryption)
     - No repos implement: secret expiration checks, rotation scheduling, keychain update triggers

  4. **Shell Performance Monitoring & Benchmarking**
     - pelted/.dotfiles: "fast startup" (no metrics)
     - DarkPhilosophy/zsh-bench: Tool exists but not integrated into dotfiles workflow
     - No repos measure: startup time per change, profiling on apply, regression detection

  5. **Bootstrap/Provision Automation**
     - Most: bash bootstrap.sh (one-time, imperative)
     - No: repeatability verification, idempotent agent-driven provisioning
     - No: multi-machine orchestration with consistency checks

  6. **Skills Inventory & Discovery**
     - jalexandercarr/dotfiles: aide CLI for template management (brilliant!)
     - barnabasJ/dotfiles: Agents folder system with symlinks (solves chezmoi conflicts)
     - No repos: automated skill discovery, skill versioning, skill marketplace integration

  7. **Dependency Graph Visualization**
     - No repos map: brew packages → mise tools → chezmoi templates dependencies
     - No automated detection of: circular deps, orphaned tools, breaking version changes

