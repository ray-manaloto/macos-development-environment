title: Community Plugin Self-Learning Scan
date: 2026-03-29
researcher: claude-sonnet-4-6
total_plugins_scanned: 500
relevant_plugins_found: 275
top_candidates_deep_reviewed: 15
methodology: >
  Fetched marketplace manifest from anthropics/claude-plugins-community.
  Scored all 500 plugins against 20 self-learning keywords (memory, learn, evolve,
  consolidate, reflect, calibrate, optimize, session, pattern, extract, wisdom,
  evolution, feedback, loop, auto-update, self-improv, observe, track, monitor,
  knowledge). Deep-read READMEs for top 15 by score. Focused on extractable
  techniques, not just install/no-install decisions.

---
plugins:

  - name: evolve-loop
    repo: https://github.com/mickeyyaya/evolve-loop
    category: learning
    relevance: HIGH
    techniques:
      - "6-phase autonomous improvement cycle: DISCOVER → BUILD → AUDIT → SHIP → LEARN → next cycle"
      - "4 specialized agents: Scout (scans codebase + past learnings for task selection), Builder (isolated worktree), Auditor (quality gate blocks MEDIUM+ severity), Operator (monitors health)"
      - "After every cycle, extracts 'instincts' — reusable patterns about what worked/failed — fed into next cycle as task candidates"
      - "Every 5 cycles, a meta-cycle evaluates the pipeline itself: adjusts agent prompts, token budgets, and strategies based on measured performance"
      - "Strategy presets: innovate (new features), harden (stability), repair (fix-only); selectable per run"
      - "Unsolicited insight surfacing: while building, agents flag latent bugs/opportunities beyond the stated goal"
      - "Quality gate: Auditor blocks any change rated MEDIUM severity or higher — bad code doesn't ship"
      - "Pure markdown instructions, no external deps: works anywhere git works"
    applicable_pattern: >
      The LEARN phase pattern (extract instincts → feed next cycle) maps directly to our
      research pipeline. After each research cycle, a meta-agent could score the cycle
      quality and propose changes to agent prompts, source selection weights, and scoring
      rubrics. The meta-cycle (every N cycles) that evaluates the pipeline itself is the
      most transferable technique — we could implement this as a scheduled review of our
      baseline improvement score vs. expected vs. actual.
    install_recommended: false
    rationale: >
      Our research pipeline already has a scoring baseline (0.450). The techniques are more
      valuable as patterns to extract than as a plugin to install (different use case: code
      improvement, not research improvement). Extract the LEARN phase and meta-cycle patterns.

  - name: pskoett-ai-skills
    repo: https://github.com/pskoett/pskoett-ai-skills
    category: learning
    relevance: HIGH
    techniques:
      - "Self-improvement skill: hook-based activation triggers on correction events (user says 'No, that's wrong...', 'Actually...')"
      - "Structured learning log files: .learnings/LEARNINGS.md, ERRORS.md, FEATURE_REQUESTS.md — each file has distinct job"
      - "Learning promotion ladder: session log → project CLAUDE.md → AGENTS.md → global instructions"
      - "Pattern-Key field tracks recurring patterns: harden.input_validation, simplify.dead_code"
      - "Recurrence-Count + First-Seen + Last-Seen fields enable frequency-based promotion decisions"
      - "Context-surfing skill: monitors context window quality during multi-step execution; exits with handoff file on drift"
      - "Intent-framed-agent: captures intent contract at execution start, monitors scope drift"
      - "Simplify-and-harden: post-completion self-review with 3 passes (simplify, harden, document)"
      - "Full pipeline lifecycle: plan-interview → intent-framed-agent + context-surfing (concurrent) → simplify-and-harden → self-improvement"
    applicable_pattern: >
      The structured learning log format (LEARNINGS.md / ERRORS.md with Pattern-Key and
      Recurrence-Count) is immediately applicable to our session-learning workflow. We
      could add Pattern-Key and Recurrence-Count to our auto memory entries to drive
      promotion decisions: when a pattern appears 3+ times it gets promoted to CLAUDE.md
      or a policy rule. The correction-event trigger (UserPromptSubmit hook detecting
      correction language) is a specific, implementable hook we're missing.
    install_recommended: true
    rationale: >
      The self-improvement skill is a direct match for our agent note-taking protocol.
      The hook-based correction capture and structured LEARNINGS.md format could replace
      our current ad-hoc auto-memory approach with a more structured, promotable system.

  - name: auto-memory
    repo: https://github.com/severity1/claude-code-auto-memory
    category: auto-update
    relevance: HIGH
    techniques:
      - "PostToolUse hook tracks Edit/Write/Bash operations; Stop hook triggers isolated agent update"
      - "Isolated agent runs in separate context window — doesn't consume main session tokens"
      - "Marker-based updates: only modifies AUTO-MANAGED sections, preserves manual CLAUDE.md content"
      - "Monorepo support: hierarchical CLAUDE.md with subtree tracking"
      - "/auto-memory:sync command for git-diff-based sync when files changed outside Claude Code"
      - "/auto-memory:calibrate for full recalibration of all CLAUDE.md files"
      - "Zero-config after init: automatic tracking without user intervention"
      - "Token-minimal design: PostToolUse hook has no output, minimizing context overhead"
    applicable_pattern: >
      The marker-based update pattern (AUTO-MANAGED sections in CLAUDE.md) is directly
      applicable to our project. We could add AUTO-MANAGED markers to our CLAUDE.md
      sections that should update automatically (e.g., tool list, subcommand list, test
      counts), while preserving manually curated policy sections. The isolated-agent
      pattern (running memory updates in a separate context) is key to avoiding context
      bloat in the main session.
    install_recommended: true
    rationale: >
      Our CLAUDE.md is under 100-line budget pressure. Auto-maintaining the factual sections
      (tool counts, subcommands, etc.) while keeping policy sections manual is exactly what
      we need. The isolated-agent approach avoids context bloat.

  - name: remember
    repo: https://github.com/Digital-Process-Tools/claude-remember
    category: memory
    relevance: HIGH
    techniques:
      - "Hierarchical compression: raw tool use → now.md → today-YYYY-MM-DD.md → recent.md → archive.md"
      - "Haiku-based compression: Claude Haiku summarizes each layer, cost < $0.01/session"
      - "NDC (now-day-consolidation) compression runs hourly on raw session buffer"
      - "SessionStart hook auto-injects identity.md + remember.md + now.md + today-*.md + recent.md + archive.md"
      - "Stop hook monitors save cadence, blocks exit until save completes when threshold reached"
      - "identity.md: persistent agent persona file that loads every session"
      - "remember.md: handoff note written at session end, read at session start"
    applicable_pattern: >
      Already installed. The hierarchical compression technique (raw → compressed → weekly → archive)
      is the key pattern. We could apply the same to our research pipeline: raw findings → scored
      summary → weekly synthesis → archival. The identity.md pattern (persistent persona) is
      something our agent definitions could use.
    install_recommended: false
    rationale: Already installed. This is the baseline memory system for this project.

  - name: pmm
    repo: https://github.com/NominexHQ/pmm-plugin
    category: memory
    relevance: HIGH
    techniques:
      - "16 specialized memory files, each with a distinct job: decisions, lessons, preferences, timeline, graph, vectors, taxonomies, assets"
      - "2-tier loading: Tier 1 (12 essential files) auto-loaded via SessionStart hook; Tier 2 (graph, vectors) load on demand"
      - "Git-backed memory: every save is a git commit with rationale; git log is the memory audit trail"
      - "/pmm:hydrate --all: bootstraps memory from current session context (for projects mid-stream)"
      - "/pmm:recall: synthesizes a focused briefing across all memory files before context switching"
      - "Decisions tracked with rationale (not just what, but why) — prevents context rot"
      - "Configurable sliding window size, model selection (Haiku default), verbosity"
      - "Auto-save via Stop hook with configurable threshold"
    applicable_pattern: >
      The 2-tier loading strategy (always-on essentials vs. on-demand detail) is directly
      applicable to our 3-layer memory architecture. The 16-file structure with distinct
      jobs (decisions.md vs. lessons.md vs. preferences.md) is more granular than our current
      auto-memory MEMORY.md index approach — could improve signal-to-noise in session startup.
      The git-backed audit trail for memory changes is something we should add to our workflow.
    install_recommended: false
    rationale: >
      Overlaps heavily with our existing remember plugin. The technique of 16 specialized
      files is worth extracting as a pattern for restructuring our MEMORY.md index, but we
      shouldn't add another memory layer on top of the existing one.

  - name: engram
    repo: https://engram.fyi
    category: memory
    relevance: HIGH
    techniques:
      - "Automatic consolidation: memory is periodically reorganized and deduplicated without user intervention"
      - "Knowledge graphs: relationships between entities tracked as graph edges, not just flat notes"
      - "Semantic recall: vector search retrieves relevant context based on current task, not recency"
      - "Cross-session persistence: memory survives between sessions natively"
      - "Description: 'semantic recall, automatic consolidation, knowledge graphs'"
    applicable_pattern: >
      The knowledge-graph approach (tracking relationships between findings, not just facts)
      is more powerful than flat markdown files for research consolidation. Our YAML findings
      files don't capture inter-finding relationships. A graph layer over the findings could
      enable queries like "what findings relate to the remember plugin?" across the full catalog.
    install_recommended: false
    rationale: >
      Hosted service (engram.fyi) — would require an API key and external data dependency.
      Extract the graph relationship pattern for our NotebookLM integration instead.

  - name: harnesskit
    repo: https://github.com/ice-ice-bear/harnesskit
    category: observation
    relevance: HIGH
    techniques:
      - "4-stage adaptive cycle: Detect → Configure → Observe → Improve"
      - "Zero-token shell hooks: detection and observation via bash+jq, no LLM calls = no context cost"
      - "3 guardrail presets: beginner/intermediate/advanced — controlled by repo detection output"
      - "Session observation: tracks errors, tool usage, plugin effectiveness per session via hooks"
      - "/harnesskit:insights analyzes accumulated session data; /harnesskit:apply executes proposed changes"
      - "Auto-applies skill/agent/hook/rule improvements based on session analysis"
      - "Error pattern detection: repeated errors trigger guardrail upgrades"
    applicable_pattern: >
      The zero-token shell hook for observation is the key transferable technique. Our current
      PostToolUse hooks use LLM calls for analysis — moving the observation/aggregation layer
      to bash+jq would dramatically reduce context overhead. The Detect→Configure→Observe→Improve
      cycle maps to our research pipeline phases. The error-pattern-to-guardrail promotion is
      a specific mechanism we could implement: recurring errors from ERRORS.md trigger new rules.
    install_recommended: false
    rationale: >
      The core loop (detect→observe→improve) is more valuable as a pattern than the plugin
      itself. The zero-token observation hook technique is directly applicable to our existing
      hook infrastructure.

  - name: superpowers-optimized
    repo: https://github.com/REPOZY/superpowers-optimized
    category: reflection
    relevance: HIGH
    techniques:
      - "Cross-session 4-file memory stack: project-map.md (structure cache) + session-log.md (decision history) + state.md (task snapshot) + known-issues.md (error map)"
      - "context-snapshot.json: written every session start via git diff HEAD~1..HEAD to capture blast radius of recent changes"
      - "Automatic 3-tier workflow routing: micro (bypass all gates) / lightweight (single checkpoint) / full (complete pipeline)"
      - "Self-consistency verification: multi-path reasoning at critical decision points"
      - "Adversarial red team agent + auto-fix pipeline: finds bugs checklists miss, converts findings to failing tests"
      - "Known-issues.md: project-specific error map prevents rediscovering the same bug"
      - "5 research-backed principles: less is more, fresh context beats accumulated context, compliance != competence, verify your own reasoning, accountability drives accuracy"
      - "9 proactive hooks: dangerous-command blocker, secrets protector, subagent guard, edit tracker, session stats, stop reminders, skill activator, session start, context engine"
    applicable_pattern: >
      The known-issues.md pattern (project-specific error map) is directly applicable as
      an extension to our ERRORS.md. The context-snapshot.json (git diff at session start)
      is a lightweight zero-cost way to know what changed since last session — something
      our remember plugin doesn't do. The 3-tier routing (micro/lightweight/full) could
      apply to our research pipeline: trivial source adds skip scoring, new domains get full
      multi-source synthesis.
    install_recommended: false
    rationale: >
      Heavy overlap with our existing superpowers/ultrapowers workflow. Extract the
      context-snapshot.json technique (git diff at session start) and known-issues.md pattern.

  - name: agent-recall
    repo: https://github.com/d-wwei/agent-recall
    category: memory
    relevance: HIGH
    techniques:
      - "Cross-platform memory: same SQLite database shared across Claude Code, Cursor, Codex CLI, Gemini CLI, OpenCode"
      - "3 self-awareness layers: agent persona (name, personality, environment), user profile (bootstrapped via 3-round interview), active task recovery"
      - "Bootstrap interview: 3-round structured interview to learn user context at setup time"
      - "SQLite + FTS5 + Chroma: structured relational data + full-text search + vector embeddings"
      - "Observation compression: tool executions captured → compressed via AI → injected at next session start"
      - "Promotion and archival: memory entries promoted (episodic → semantic → principle) based on recurrence"
      - "Background HTTP worker (localhost:37777): platform-agnostic 18-endpoint API"
      - "70-80% platform-agnostic code: thin adapter (~80 lines) per platform"
    applicable_pattern: >
      The user-profile bootstrap interview is a specific pattern we lack: a structured onboarding
      that captures user preferences, project context, and working style before any session begins.
      The promotion ladder (episodic → semantic → principle) directly maps to our memory tiers
      (session → project warm → knowledge cold). The cross-platform SQLite backend is overkill
      for our single-tool setup, but the platform-agnostic API pattern is worth noting.
    install_recommended: false
    rationale: >
      Our remember plugin covers the core memory need. The bootstrap interview and promotion
      ladder patterns are worth extracting but don't justify adding another memory layer.

  - name: mine
    repo: https://github.com/anipotts/claude-code-tips
    category: observation
    relevance: MEDIUM
    techniques:
      - "Mines every Claude Code session into a local SQLite database via JSONL parsing"
      - "18+ natural language query intents: /mine mistakes (error patterns), /mine hotspots (most-edited files), /mine loops (repeated patterns), /mine search (full-text)"
      - "Cost tracking: per-project, per-session token and cost accounting"
      - "Error memory: captures and re-surfaces errors Claude keeps repeating across sessions"
      - "/mine loops: detects repeated behavior patterns across sessions — signals for automation opportunities"
      - "context-save hook: preserves state before compaction"
    applicable_pattern: >
      The 'mine loops' command (detecting repeated cross-session patterns) is the most novel
      technique here. If we could detect that Claude is repeatedly doing the same manual step
      (e.g., always running ruff before commits), that's a signal to automate it. The error
      memory (re-surfacing repeated errors) could augment our ERRORS.md approach with automatic
      recurrence detection from session logs.
    install_recommended: false
    rationale: >
      Interesting observability approach but adds another SQLite database alongside our existing
      stack. The loop detection pattern is extractable without installing the plugin.

  - name: lesson-skill-loop
    repo: https://github.com/aliksir/lesson-skill-loop
    category: skill-evolution
    relevance: MEDIUM
    techniques:
      - "Analyzes development session tag patterns to identify skill creation opportunities"
      - "Proposes new skill creation based on recurring task patterns in session history"
      - "Syncs improvements between related skills to prevent drift"
      - "Checks for skill health degradation over time"
      - "Bridges from ad-hoc session patterns to formalized, installable skills"
    applicable_pattern: >
      The session-pattern-to-skill pipeline is a direct implementation of the feedback loop
      we want: things done repeatedly in sessions become proposed skills. This is the
      automation of our Library-First policy — instead of waiting for humans to notice
      repetitive work, the loop proposes formalizing it.
    install_recommended: false
    rationale: >
      The description is thin (README 404'd). The concept is sound and maps to our skill
      evolution goals, but the implementation is unknown.

  - name: coding-wisdom
    repo: https://github.com/ErinYu/coding-wisdom
    category: knowledge
    relevance: MEDIUM
    techniques:
      - "4 structured wisdom categories: Development Principles, Debug Principles, Trivial User Features, Non-Consensus Tips"
      - "Capture mode: rich interactive prompts after sessions (title, context, principle, why-it-works, tags)"
      - "Browse mode: explore accumulated wisdom by category"
      - "Search mode: find relevant wisdom before starting new tasks (inject before context is needed)"
      - "Tag-based retrieval for cross-reference"
    applicable_pattern: >
      The pre-task search (find relevant wisdom before starting, not just injecting all of it)
      is a key pattern we're missing. Our MEMORY.md injects everything; wisdom search would
      let agents query for relevant patterns by task type. The 4-category structure (Development
      Principles, Debug Principles, Trivial User Features, Non-Consensus Tips) maps cleanly to
      our feedback memory entries.
    install_recommended: false
    rationale: >
      The capture format is simpler than our LEARNINGS.md approach. The pre-task search
      pattern is extractable without the plugin.

  - name: bake-claude-md-files
    repo: https://github.com/publicala/bake-claude-md-files
    category: auto-update
    relevance: MEDIUM
    techniques:
      - "Converts CLAUDE.md rules into automated checks (eslint, phpstan, CI, git hooks) to free up agent context"
      - "Inventories existing tooling before proposing new checks — never duplicates existing automation"
      - "Presents proposed changes for approval before implementing"
      - "Removes automated rules from CLAUDE.md after checks pass — rule is now enforced by tooling, not context"
      - "Preserves human-judgment rules that can't be automated"
    applicable_pattern: >
      The 'bake' pattern (CLAUDE.md rule → automated check → remove from context) is a
      direct technique for reducing our context budget. Policy rules that could be enforced
      by ruff rules, mise hooks, or pytest fixtures should be 'baked' out of CLAUDE.md.
      This is the inverse of auto-memory: instead of keeping CLAUDE.md up-to-date, it
      removes rules that are better expressed as tooling.
    install_recommended: true
    rationale: >
      Addresses our CLAUDE.md context budget problem directly. The bake pattern (policy → tooling → remove)
      is complementary to auto-memory (auto-update factual sections). Together they keep CLAUDE.md
      minimal: factual sections auto-update, policy sections get baked into tools when possible.

  - name: skill-doctor
    repo: https://github.com/amaljithkuttamath/skill-doctor
    category: reflection
    relevance: MEDIUM
    techniques:
      - "Diagnoses skill health: missing tool restrictions, wasted tokens from inline file reads, vague descriptions that never auto-trigger"
      - "Uses claude-code-guide agent to evaluate each skill against current best practices"
      - "Saves findings to ~/.skill-doctor/diagnosis.json for structured review"
      - "3-command workflow: diagnose → treat → rollback"
      - "Rollback capability: can revert skill changes if treatment degrades performance"
    applicable_pattern: >
      The skill-health diagnostic pattern (measure trigger effectiveness, token efficiency,
      best-practice compliance) applies to our rsm-subagents plugins. A periodic skill audit
      that measures whether skills are auto-triggering correctly, whether descriptions are
      precise enough, and whether tool restrictions are minimal could catch drift. The rollback
      pattern is also directly applicable to our skill evolution workflow.
    install_recommended: false
    rationale: >
      Our existing `uv run mde-py validate --plugins` covers structural validation. skill-doctor
      adds semantic/quality analysis. Worth running manually before major plugin releases, not
      as a permanent installation.

  - name: vynn
    repo: https://github.com/beee003/vynn-mcp
    category: learning
    relevance: MEDIUM
    techniques:
      - "optimize_prompt: AI-powered prompt optimization for individual workflow steps"
      - "apply_prompt_optimization: applies optimized prompts to running workflows"
      - "get_model_recommendation: recommends model swaps per step (e.g., use Haiku for step 3, Sonnet for step 7)"
      - "backtest: runs backtests on workflow strategies with natural language or structured configs"
      - "batch_backtest: parameter sweep across strategy variations to find optimal configs"
      - "get_analytics: workflow performance analytics over time"
      - "Cron scheduling for recurring workflow execution"
    applicable_pattern: >
      The backtest + parameter sweep pattern is the closest thing to true self-improvement
      we've seen: run the same research workflow with different agent prompts, model choices,
      and source weights, then compare outcomes against a baseline metric. This is what our
      research pipeline's improvement score (0.450 baseline) is designed for — but we don't
      have the backtesting infrastructure to actually optimize against it.
    install_recommended: false
    rationale: >
      Hosted service (the-vynn.com) requiring API key. The backtesting pattern is worth
      implementing natively in our research pipeline rather than depending on an external service.

---
additional_patterns_noted:

  - pattern: "Zero-token shell hooks for observation"
    source_plugins: [harnesskit, mine, superpowers-optimized]
    description: >
      Use bash+jq in PostToolUse/SessionEnd hooks for metrics collection (error counts,
      tool usage, edit frequency) without LLM calls. Reserve LLM calls for analysis,
      not data collection.
    applicable_to: our existing hook infrastructure

  - pattern: "Git-backed memory audit trail"
    source_plugins: [pmm]
    description: >
      Every memory save is a git commit. Memory changes are traceable to specific sessions.
      Combined with our existing git workflow, this provides full provenance for agent learning.
    applicable_to: docs/research/trail/ provenance records

  - pattern: "context-snapshot.json at session start"
    source_plugins: [superpowers-optimized]
    description: >
      Run 'git diff HEAD~1..HEAD' at SessionStart, write result to context-snapshot.json
      (in .generated/). Zero LLM cost, instant answer to 'what changed since last session'.
    applicable_to: our remember plugin / SessionStart hook

  - pattern: "Correction-event trigger hook"
    source_plugins: [pskoett-ai-skills]
    description: >
      UserPromptSubmit hook detects correction language ('No, that's wrong', 'Actually...',
      'Don't do that') and automatically triggers the self-improvement skill to log the
      correction. Zero manual discipline required.
    applicable_to: src/mde/hooks/ auto-discovered hook

  - pattern: "Promotion ladder with recurrence tracking"
    source_plugins: [pskoett-ai-skills, agent-recall]
    description: >
      Track Pattern-Key, Recurrence-Count, First-Seen, Last-Seen on every learning entry.
      When Recurrence-Count crosses threshold (3?), auto-promote to CLAUDE.md or policy rule.
      Prevents wisdom from staying in session logs and never becoming institutional knowledge.
    applicable_to: .claude/projects/*/memory/ MEMORY.md index files

  - pattern: "Bake policy into tooling"
    source_plugins: [bake-claude-md-files]
    description: >
      Audit CLAUDE.md rules: if a rule can be expressed as a ruff rule, mise hook, or pytest
      fixture, implement it in tooling and remove from CLAUDE.md. Reduces context budget without
      losing enforcement. Our no-shell-scripts and mise-first policies are partially bakeable.
    applicable_to: CLAUDE.md, .claude/rules/, pyproject.toml

  - pattern: "Pre-task wisdom search"
    source_plugins: [coding-wisdom]
    description: >
      Before starting a task, query the wisdom/learnings store for relevant patterns by task
      type. Don't inject all memory — inject only what's relevant to the current task. This
      is the retrieval half of a RAG system applied to agent self-knowledge.
    applicable_to: research pipeline, SessionStart hook

  - pattern: "Meta-cycle pipeline self-evaluation"
    source_plugins: [evolve-loop]
    description: >
      Every N research cycles, run a meta-agent that evaluates the pipeline itself: which
      sources produced findings that increased the improvement score? Which agent prompts
      caused low-quality findings? Which scoring rubrics are biased? Adjust weights accordingly.
    applicable_to: src/mde/research/ pipeline, improvement score tracking

  - pattern: "Isolated agent for memory updates"
    source_plugins: [auto-memory]
    description: >
      Run CLAUDE.md and MEMORY.md updates in a separate isolated agent (clean context window)
      triggered by PostToolUse/Stop hooks. Main session context stays focused on the task.
      Memory maintenance never pollutes the working context.
    applicable_to: our remember plugin + auto-memory integration

---
summary:
  highest_priority_for_extraction:
    - "Correction-event trigger hook (pskoett-ai-skills) — implement as a new hook in src/mde/hooks/"
    - "context-snapshot.json at SessionStart (superpowers-optimized) — add to SessionStart hook"
    - "Promotion ladder with Pattern-Key + Recurrence-Count (pskoett-ai-skills) — add fields to MEMORY.md entries"
    - "Bake-policy-into-tooling audit (bake-claude-md-files) — run against current CLAUDE.md to reduce context budget"
    - "Meta-cycle pipeline evaluation (evolve-loop) — schedule periodic review of research baseline score"

  install_candidates:
    - name: pskoett-ai-skills
      priority: HIGH
      reason: "Self-improvement skill with structured LEARNINGS.md + correction-event hook is directly usable"
    - name: auto-memory
      priority: HIGH
      reason: "Marker-based CLAUDE.md auto-update with isolated agent solves our context budget problem"
    - name: bake-claude-md-files
      priority: MEDIUM
      reason: "Complementary to auto-memory; reduces context by baking rules into tooling"

  reject_list:
    - name: engram
      reason: Hosted service, external data dependency
    - name: vynn
      reason: Hosted service, API key required; backtest pattern is worth implementing natively
    - name: agent-recall
      reason: Redundant with remember plugin; cross-platform SQLite backend is overkill
    - name: mine
      reason: Another SQLite database; loop detection pattern is extractable without installation
    - name: superpowers-optimized
      reason: Heavy overlap with existing superpowers/ultrapowers workflow
    - name: pmm
      reason: Redundant with remember plugin; multi-file structure is an extractable pattern

# --- Reflection & Self-Learning Skills (batch 2) ---

batch_2_skills:

  - name: claude-reflect
    source: https://github.com/BayramAnnakov/claude-reflect
    category: self-learning
    relevance: HIGH
    what_it_does: >
      A Claude Code plugin (v2.6.0, 160 tests) that automatically captures user corrections
      and workflow patterns, then syncs them into CLAUDE.md and AGENTS.md as permanent memory.
      Also discovers repeating task patterns from session history and generates reusable /commands.
    techniques:
      - "Hybrid detection: fast regex pattern matching during session (real-time) + semantic AI validation on /reflect (batch)"
      - "Two-stage pipeline: Stage 1 auto-capture via hooks (session_start, every prompt, pre-compaction, post-commit); Stage 2 manual /reflect with human review before writing"
      - "Confidence scoring (0.60-0.95): higher of regex vs semantic confidence score per captured learning"
      - "Multi-language correction detection: Spanish 'no, usa Python' correctly identified even without English patterns"
      - "Multi-target sync: approved learnings pushed to global ~/.claude/CLAUDE.md, project CLAUDE.md, and auto-discovered subdirectory CLAUDE.md files"
      - "Skill discovery (/reflect-skills): scans past sessions for repeating task patterns and generates /command files (e.g., if 'review my productivity' detected 12x, suggests /daily-review)"
      - "Human review step: table of candidates with confidence scores; options to apply, edit-before-applying, or skip"
      - "--dedupe flag: finds and consolidates similar entries in CLAUDE.md to prevent bloat"
      - "Queue decay tracking: learnings in queue can be reviewed for staleness before applying"
    applicable_pattern: >
      The hybrid detection approach (fast regex + semantic validation) directly maps to our
      correction capture gap. The /reflect-skills pattern discovery (count repeating tasks across
      sessions, suggest automation) is a high-value addition to our research pipeline: we could
      scan agent transcripts for repeated research queries and auto-generate source-discovery skills.
