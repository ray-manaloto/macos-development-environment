    641 installs, Safe risk assessment
    Covers: health checks (HTTP/database/custom), service dependencies, networking patterns
    Examples include: MERN, LAMP, Next.js+PG+Redis stacks
    Health check patterns per database type:
      - PostgreSQL: pg_isready -U postgres
      - MySQL: mysqladmin ping
      - MongoDB: mongosh --eval "db.adminCommand('ping')"
      - Redis: redis-cli ping

  Devcontainer Lifecycle (containers.dev spec):
    1. onCreateCommand - first setup (no user-scoped access)
    2. updateContentCommand - refresh on content changes (periodic for caching/prebuild)
    3. postCreateCommand - final setup (user-scoped secrets available)
    4. postStartCommand - runs EVERY container start (ideal for sidecar monitoring)
    5. postAttachCommand - runs on tool attachment

  Command failure semantics:
    - If postCreateCommand fails → postStartCommand/postAttachCommand skipped
    - Array format bypasses shell (direct execution)
    - String format executes in /bin/sh (allows && chaining)
    - Object format allows parallel execution

  Base template includes (sickn33 skill):
    - Claude Code with marketplace plugins
    - Python 3.13 via uv
    - Node 22 via fnm
    - Network isolation (iptables, ipset, NET_ADMIN cap)
    - CLI tools: ripgrep, fd, fzf, tmux, git-delta, ast-grep
implication: |
  1. For devcontainer-specialist agent:
     - Use sickn33 approach (language detection → extensions → postCreateCommand chaining)
     - Model base template structure with network/observability stack pre-installed

  2. For compose integration in lifecycle hooks:
     - postStartCommand is optimal for sidecar health monitoring (runs every start)
     - Parallel object syntax allows concurrent service readiness checks
     - Database health checks MUST match container type (pg_isready vs mysql vs mongo)
     - Network isolation requires NET_ADMIN; verify devcontainer has this capability

  3. For observability stack setup:
     - Compose pattern: frontend/backend networks separated from monitoring
     - Use healthcheck.test with appropriate timeouts per service type
     - postStartCommand can orchestrate service readiness: postgres→redis→app→monitoring
     - Consider persisting monitoring data via volume mounts (prometheus.db, grafana dashboards)

  4. Lifecycle command structure for full stack:
     postCreateCommand: install deps, build images, compose pull
     postStartCommand: verify service health, configure monitoring scrapers, validate readiness

