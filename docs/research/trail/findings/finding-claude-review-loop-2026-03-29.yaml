  phase state machine, runner script generation, retry ceiling of 2, ERR trap, fail-open defaults.
  Source: plugins/review-loop/scripts/setup-review-loop.sh - argument parsing, state file creation.
  Source: plugins/review-loop/hooks/hooks.json - Stop hook, 30s timeout, ${CLAUDE_PLUGIN_ROOT} path.
  Source: plugins/review-loop/.claude-plugin/plugin.json - v1.8.0, MIT license, Hamel Husain.
  Key code: `codex ${CODEX_FLAGS} exec "$(cat ".claude/review-loop-codex-prompt.txt")"` in runner script.
  Key code: phase transition uses awk not sed; verified after write.
  Key design comment: "Instead of running Codex inside this hook (which blocks Claude and hides
  all output), we write the prompt and a runner script, then tell Claude to execute it via Bash
  so Codex output streams to the user."
implication: |
  For mde debate pipeline:
  1. Write prompts to temp files, never pass as CLI args (avoids shell escaping entirely).
  2. Stop hook must NOT run secondary model directly — write runner script + block exit.
  3. Secondary model writes output to a deterministic file path; Claude reads it afterward.
  4. `codex exec` is the correct non-interactive flag (not -p or --prompt).
  5. Retry ceiling (2 attempts) prevents infinite loop when Codex fails to produce output.
  6. Fail-open everywhere: any error should approve exit, never trap user in broken loop.
  7. Two-state YAML frontmatter file is sufficient for a task→review state machine.
