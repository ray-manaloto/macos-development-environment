confident_about: |
  Complete source-level understanding of how the plugin orchestrates Claude + Codex:
  stop hook writes files and blocks, Claude runs Codex via Bash, Codex writes review
  to a deterministic file path, stop hook verifies file existence on next exit attempt.
  CLI flag is `codex --dangerously-bypass-approvals-and-sandbox exec "<prompt>"`.
  Prompt is written to a file and read at runtime via $(cat) to avoid shell escaping.
  Multi-agent inside Codex is enabled via ~/.codex/config.toml [features] multi_agent = true.
  Plugin version 1.8.0 at 2026-03-29. 625 stars, 37 forks, 0 open issues/PRs.
