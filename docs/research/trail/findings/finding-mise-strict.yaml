confident_about: |
  1. **No official MISE_STRICT environment variable exists in mise core**
     - Searched mise repository and official documentation
     - No strict mode flag in mise settings or environment variables
     - The term "strict mode" in this project refers to MDE_AUTOFIX_STRICT environment variable

  2. **Project-specific strict mode: MDE_AUTOFIX_STRICT**
     - Defined in scripts/macos-dev-maintenance.sh (line 8)
     - Defaults to 0 (disabled)
     - Only activated when both MDE_AUTOFIX=1 AND MDE_AUTOFIX_STRICT=1
     - Purpose: Remove brew-managed runtimes (node, go, rust, python) in favor of mise-managed versions
     - Invokes remove_brew_runtimes() function (line 598-602)

  3. **Official mise environment variables identified**
     - MISE_PIN=1: Pins exact versions instead of fuzzy versions
     - MISE_YES=1: Auto-answers "yes" to prompts (equivalent to config yes = true)
     - MISE_TRUSTED_CONFIG_PATHS: Colon-separated paths for trusted config files
     - MISE_BACKENDS_<TOOL>: Override backend for specific tools (e.g., MISE_BACKENDS_CLAUDE)
     - MISE_ENV_CACHE=1: Enables mise env caching for secret resolution with fnox

  4. **Status.missing_tools setting (not strict mode)**
     - Available in mise settings at [settings] section of config.toml
     - Controls behavior when tools are missing
     - Options include: "if_other_versions_installed" (default) and others
     - Related to warning behavior, not strict mode

gaps: |
