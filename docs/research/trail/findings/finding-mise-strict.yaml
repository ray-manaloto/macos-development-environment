  2. **For mise integration**: If planning to add official strict mode validation to mise, consider that project-specific automation may already be using "strict" terminology for different purposes.

  3. **Documentation improvement**: Create a STRICT_MODE.md file documenting MDE_AUTOFIX_STRICT behavior, when to use it, and what it does:
