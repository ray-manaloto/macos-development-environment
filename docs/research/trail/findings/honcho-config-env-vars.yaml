implication: |
  Docker compose must set all three levels of the provider pyramid:
  1. API Keys at LLM layer (mandatory): LLM_ANTHROPIC_API_KEY, LLM_OPENAI_API_KEY, LLM_GEMINI_API_KEY
  2. Component selection at provider level (defines default models): DERIVER_PROVIDER, SUMMARY_PROVIDER, DREAM_PROVIDER
  3. Dialectic level overrides (per-reasoning-level): DIALECTIC_LEVELS__minimal__PROVIDER, etc.

  All ENABLED flags default to True (Deriver, Summary, Peer Card, Dream, Cache, Telemetry).
  Must explicitly set to False in compose to disable components without removing them.

  Backup providers allow graceful fallback when primary API fails.
