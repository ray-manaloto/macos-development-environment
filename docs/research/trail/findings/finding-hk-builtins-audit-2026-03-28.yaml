# ============================================================
# SUMMARY
# ============================================================

summary:
  currently_enabled: [ruff, ruff_format, shellcheck, typos, yamllint]

  enable_immediately:
    - name: taplo / taplo_format
      rationale: "Project has pyproject.toml, .mise.toml, _typos.toml, fnox.toml — all TOML, no formatter today"
      install: "taplo = 'latest' in global mise config"
    - name: hadolint
      rationale: "Project has Dockerfiles; hadolint already in global mise config"
      install: "Already installed — zero cost"
    - name: shfmt
      rationale: "shellcheck catches bugs; shfmt enforces consistent formatting of chezmoi .sh scripts"
      install: "shfmt = 'latest' in global mise config"
    - name: actionlint
      rationale: "3 workflow files in .github/workflows/ — catches type/expression errors"
      install: "actionlint = 'latest' in global mise config"
    - name: pkl
      rationale: "hk.pkl validation; pkl already in global mise config — zero cost"
      install: "Already installed"
    - name: check_conventional_commit
      rationale: "CLAUDE.md mandates conventional commits; this enforces it at commit-msg hook time"
      install: "hk util — built-in, zero cost; add to commit-msg hook"

  consider_later:
    - name: python_debug_statements
      rationale: "Zero-cost built-in; catches accidental pdb/breakpoint() commits"
    - name: check_merge_conflict
      rationale: "Zero-cost built-in; catches <<<< conflict markers"
    - name: detect_private_key
      rationale: "Zero-cost built-in; backstop for Doppler/fnox secrets policy"
    - name: check_added_large_files
      rationale: "Zero-cost built-in; prevents accidental binary commits"
    - name: check_case_conflict
      rationale: "Zero-cost built-in; macOS dev + Linux CI = real risk"
    - name: newlines
      rationale: "Zero-cost built-in; EOF newline hygiene across all file types"
    - name: trailing_whitespace
      rationale: "Zero-cost built-in; covers YAML/TOML/Markdown that ruff doesn't touch"
    - name: pkl_format
      rationale: "Formats hk.pkl; pkl already installed"
    - name: rumdl
      rationale: "Rust-based Markdown linter+fixer; covers docs/*.md"
    - name: ty
      rationale: "Already in quality gate; adds type checking at commit time"
    - name: yamlfmt
      rationale: "Normalizes YAML formatting; evaluate key-sort behavior first"
    - name: zizmor
      rationale: "GitHub Actions security scanning; supply-chain risk mitigation"
    - name: ghalint_workflow
      rationale: "Complements actionlint with security checks"

  skip_count: 67
  enable_count: 6
  consider_count: 13
  already_enabled_count: 5

  new_tools_to_install:
    - "taplo = 'latest'  # global mise"
    - "shfmt = 'latest'  # global mise"
    - "actionlint = 'latest'  # global mise"
    # hadolint, pkl, jq already installed
    # check_conventional_commit, python_debug_statements, etc. use hk util (built-in)
