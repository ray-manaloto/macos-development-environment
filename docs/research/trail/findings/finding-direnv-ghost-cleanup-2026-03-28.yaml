evidence: |
  - ~/.zshrc:80: plugins=(git gh direnv)
  - ~/.oh-my-zsh/plugins/direnv/direnv.plugin.zsh:2-5: explicit warning + early return when binary missing
  - `chezmoi managed --include=files | grep zshrc` → empty output (unmanaged)
  - `which direnv` → empty (binary absent)
  - `grep -rn "direnv" ~/.config/mise/` → no results (removed from mise)
  - ~/.config/mise/config.toml:16-19: fnox-env plugin + _.fnox-env = { tools = true } confirms
    mise already handles what direnv did for secret/env activation

implication: |
  Fix requires a MANUAL edit to ~/.zshrc (not via chezmoi apply).
  Remove "direnv" from the plugins=(...) line on line 80.
  This is a one-line change: `plugins=(git gh)` or `plugins=(git gh direnv)` → `plugins=(git gh)`.

  Remediation plan:
  1. Edit ~/.zshrc line 80: remove "direnv" from the plugins list
     - Before: plugins=(git gh direnv)
     - After:  plugins=(git gh)
  2. Reload shell: source ~/.zshrc  (or open new terminal)
  3. Verify warning is gone: open new terminal, no warning should appear
  4. No chezmoi changes needed — .zshrc is not chezmoi-managed
  5. No mise changes needed — direnv was already removed from mise config
  6. Consider: should .zshrc be brought under chezmoi management to prevent future drift?
     The .chezmoisource/ has dot_oh-my-zsh/custom/ but no dot_zshrc file exists.
     Adding it would require: chezmoi add ~/.zshrc (creates .chezmoisource/dot_zshrc)
     This is OPTIONAL but recommended for declarative config hygiene.

  fnox vs direnv functional parity:
  - direnv: per-directory .envrc files, shell hook triggers on cd, auto-loads env vars
  - mise + fnox-env: `_.fnox-env = { tools = true }` loads fnox secrets globally via mise
  - mise handles per-directory tool activation via .mise.toml (replaces direnv's `use nix/nvm/etc`)
  - fnox reads from macOS Keychain (sourced from Doppler) — NOT from .envrc files
  - CONCLUSION: mise+fnox FULLY replaces direnv for this project's use case (global secrets + tool activation)
  - CAVEAT: the sortakool/ai-rag .envrc uses raw `export VAR=value` style (not direnv stdlib)
    That project would need its own approach if direnv is removed globally — but that's an
    external project, not this repo's concern

