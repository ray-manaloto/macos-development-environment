confident_about: |
  1. EXACT INSTALLATION STEPS:
     - Run: npx tweakcc --apply (patches Claude Code LSP support)
     - Run claude CLI
     - Type: /plugin marketplace add Piebald-AI/claude-code-lsps
     - Run claude CLI again
     - Type: /plugins
     - Tab to Marketplaces > Browse plugins > select with spacebar > press i to install
     - Restart Claude Code

  2. FILE STRUCTURE:
     - Each plugin is a directory in /plugins
     - .lsp.json files are CANONICAL SOURCE for LSP configuration
     - .claude-plugin/marketplace.json entries are GENERATED FROM .lsp.json
     - DO NOT hand-edit marketplace.json entries—they are auto-generated
     - Validation workflow: node scripts/validate-all.mjs

  3. TWEAKCC PATCHES:
     - Detects both npm and native Claude Code installations
     - Patches Claude Code to make LSP support "usable" (official docs)
     - Also customizes system prompts, themes, thinking verbs, and more
     - Not optional—required for LSP functionality in Claude Code

  4. CLAUDE CODE VERSION REQUIREMENT:
     - Minimum: 2.0.74 (officially added LSP to changelog)
     - Marketplace targets: 2.1.50+ (supports startupTimeout field)
     - Latest tested: 2.1.52

  5. LSP CAPABILITIES OFFERED:
     - goToDefinition, goToImplementation, hover
     - documentSymbol (list all symbols in file)
     - findReferences (symbol references)
     - workspaceSymbol (cross-workspace search)
     - callHierarchy (prepareCallHierarchy)
     - incomingCalls, outgoingCalls

