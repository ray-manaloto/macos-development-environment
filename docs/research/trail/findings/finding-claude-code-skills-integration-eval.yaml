implication: |
  VERDICT: SKIP for autonomous-fix-review

  REASONING:

  1. **API Key Constraint (CRITICAL BLOCKER)**
     - Project constraint: "zero API expense; all LLM calls via subscription CLIs (codex/gemini/claude)"
     - claude-code-skills requires: `codex login` (OpenAI API key) and `gemini auth login`
       (Google API key)
     - Our setup: codex/gemini CLIs available but NO API credentials configured
     - Codex: "gpt-5.4" — not a real OpenAI model; likely fictional or requires auth
     - Gemini: "gemini-3-flash-preview" — Google's preview API requires billing account
     - RESULT: Skills will fail silently or hang waiting for credentials

  2. **Architectural Incompatibility**
     - Skills are designed for Linear integration (auto-detected workflow)
     - Our MDE doesn't use Linear; we use GitHub issues + git
     - Fallback to kanban_board.md is insufficient for our workflow

  3. **Context Budget Risk**
     - Plugin brings 128 skills + 7 plugins = ~96 entries in skills catalog
     - Our context budget is already at 96-99% token utilization for MCP schema bloat
     - Full plugin install would likely exceed skill description budget, risk disabling
       superpowers skills

  4. **Extraction Infeasible**
     - Skills depend on shared/ directory (MCP servers, agent_registry.json, etc.)
     - npx skills add does NOT copy shared/ resources
     - Cannot surgically extract ln-310/ln-510 without full plugin install

  5. **Fallback Behavior Unclear**
     - "Automatic fallback to Claude Opus if unavailable" — but which Claude model?
     - Our autonomous-fix-review uses Codex/Gemini via subprocess (not API)
     - No guarantee that skills use subprocess CLIs rather than direct API auth

  ALTERNATIVE APPROACH:
  Build custom autonomous-fix-review with native subprocess delegation:
  - Use existing (/codex + /gemini CLIs via subprocess, no auth required)
  - Parallel task execution (anyio.TaskGroup)
  - Debate protocol (structured YAML rounds, not natural language)
  - Fallback to claude-opus-4 if codex/gemini exit code != 0
  - Output: JSON provenance, not .agent-review/ markdown
  - No plugin dependency, no context budget impact

  This approach satisfies:
  ✓ Zero API key requirement
  ✓ Subscription CLI only (codex/gemini already in mise config)
  ✓ Structured output (JSON, not markdown)
  ✓ Parallel review (background tasks via anyio)
  ✓ Fallback mechanism (exit code detection)
  ✓ Fits within existing skill framework

