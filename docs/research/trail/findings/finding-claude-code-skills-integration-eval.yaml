name: "claude-code-skills Multi-Model Review Integration Evaluation"

summary: |
  levnikolaevich/claude-code-skills is a mature 7-plugin Claude Code suite with 128+ skills
  and native multi-model review capability (Codex + Gemini parallel delegation). MIT licensed.
  CRITICAL BLOCKER: Requires API keys for both Codex (@anthropic/codex-cli) and Gemini
  (@google/gemini-cli), and zero-cost subscription CLI access is NOT available for either.
  The plugin is directly installable but NOT compatible with our subscription-CLI-only constraint.

confident_about: |
  1. **Installation**: /plugin add levnikolaevich/claude-code-skills — direct installation via CLI
  2. **Multi-Model Review Skills**: ln-310-multi-agent-validator, ln-510-quality-coordinator,
     ln-813-optimization-plan-validator all implement Codex + Gemini parallel delegation
  3. **Review Workflow**: Parallel execution with fallback to Claude Opus; debate protocol
     for controversial findings; filtering ≥90% confidence + >2% impact
  4. **Architecture**: 7 plugins (agile-workflow, documentation-pipeline, codebase-audit-suite,
     project-bootstrap, optimization-suite, community-engagement, setup-environment)
  5. **CLI Requirements**: codex CLI (gpt-5.4) and gemini CLI (gemini-3-flash-preview) are
     hard dependencies for multi-model features
  6. **Output Format**: JSON via --json flag; audit trail to .agent-review/{agent}/ directory
  7. **License**: MIT (compatible)

gaps: |
