### Problem 3: Missing Tool References After Upgrade/Prune
**Severity**: MEDIUM
**Status**: Requires investigation + config update

Current missing tools reported by `mise doctor`:
```
aqua:atuinsh/atuin@18.13.4 is not installed (missing)
aqua:jdx/pitchfork@2.1.0 is not installed (missing)
aqua:anomalyco/opencode@1.3.0 is not installed (missing)
vfox:1password-cli@2.33.0 is not installed (missing)
npm:@googleworkspace/cli@0.21.1 is not installed (missing)
npm:agent-browser@0.22.1 is not installed (missing)
```

Analysis:
- `mise upgrade && mise prune` removed old versions
- `.mise.toml` and `~/.config/mise/config.toml` still reference these versions via vfox/aqua backends
- Global config at `~/.config/mise/config.toml` contains most tools (lines 26-165)
- Project `.mise.toml` only defines `hk = "latest"` (line 350)

Root cause:
- Global config pins specific versions (e.g., `atuin@18.13.4`, `pitchfork@2.1.0`)
- These are managed by chezmoi at `.chezmoisource/dot_config/mise/config.toml.tmpl`
- Cannot edit directly; changes must go through chezmoi workflow
- vfox backend used for `1password-cli@2.33.0` conflicts with aqua pinning

**Fix approach**:
1. Update `.chezmoisource/dot_config/mise/config.toml.tmpl` to use `latest` instead of specific versions
2. Verify which tools genuinely need version pinning vs. can use `latest`
3. Run `mise install && mise prune` to refresh

