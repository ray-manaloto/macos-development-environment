implication: |
  **No Python SDK exists for multi-model CLI orchestration.** All discovered tools are:

  1. **Skill/agent deployment frameworks** (markdown + config, not code)
  2. **Plugin ecosystems** (Claude Code plugin, Factory AI droid, VS Code extension)
  3. **Workflow templates** (JSON config, shell scripts, or agent markdown specs)
  4. **TypeScript/JavaScript tools** (catering to Node ecosystem, not Python)

  **Patterns that CAN be extracted into src/mde/domain/multi_model.py:**

  - **Consensus gate logic** (nyldn/claude-octopus v9: 75% agreement threshold across providers)
  - **Double Diamond workflow stages** (Discover → Define → Develop → Deliver)
  - **Provider detection + auto-activation** (scan for installed CLIs, activate workflows accordingly)
  - **Task routing heuristics** (match task description to specialized agent)
  - **Quality gate enforcement** (pass/fail checkpoints between stages)
  - **Context handoff protocol** (session-to-session memory via structured JSON)

  **NOT extractable as a Python library:**
  - Orchestration itself (too tightly coupled to CLI execution via subprocess)
  - Agent/skill definitions (stored as markdown, YAML, JSON — not Python code)
  - Plugin installation (tied to IDE-specific plugin marketplaces)

  **Better approach:** Create a lightweight Python _orchestration pattern library_ (not an SDK)
  that implements the above patterns, leaving skill/agent deployment to existing ecosystems.

