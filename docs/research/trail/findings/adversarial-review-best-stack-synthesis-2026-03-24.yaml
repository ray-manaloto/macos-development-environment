  **Recommended pre-existing stack for multi-model adversarial review:**

  Compose 4 proven open-source projects + 200-300 lines of glue code.
  NO new SDK required. User mandate: "assemble existing → build new (LAST RESORT)"

  Core Stack:
  1. **DSPy** — Debate orchestration foundation
  2. **Outlines** — Structured output enforcement
  3. **Anthropic SDK** — Baseline LLM provider
  4. **Custom SubprocessLMProvider** — CLI tool adapter

  Estimated implementation: 2-3 days (code + tests)

gaps: |
  1. **No framework combines all four components.**
     - DSPy doesn't know about structured output constraints (Outlines handles that)
     - Neither framework ships with subprocess/CLI backends
     - Neither has full debate/consensus orchestration patterns built-in

  2. **Debate patterns must be custom-built.**
     - DSPy provides building blocks (ChainOfThought, MultiChainComparison)
     - Consensus logic (voting, agreement %, fallback) is user-specific
     - Judge prompt templates must be created

  3. **SentinelOne reference is not available.**
     - Product doesn't exist publicly
     - Must build from first principles + reference LMSYS/OpenAI/Anthropic patterns

