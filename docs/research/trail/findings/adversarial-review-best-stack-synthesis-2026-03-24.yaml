  **IMPLEMENTATION ROADMAP (composing existing + minimal new code):**

  **Phase 1: DSPy Foundation (Day 1)**
  - Install: `pip install dspy-ai`
  - Create SubprocessLMProvider: 150 lines
  - Test: Unit test provider with `claude` CLI
  - Gate: Verify provider returns valid dspy.ChainOfThought outputs

  **Phase 2: Debate Orchestration (Day 1-2)**
  - Implement DebateOrchestrator: 100-150 lines
  - Debate workflow: Round 1 (parallel) → Round 2 (cross-challenge) → Judge vote
  - Judge prompts: Template-based Jinja2 (customizable per task type)
  - Test: Debate integration test (3 models, 1 round, consensus check)
  - Gate: DebateResult parses correctly, agreement% computed

  **Phase 3: Consensus & Fallback (Day 2)**
  - ConsensusScoringSystem: 50-100 lines
  - Voting logic: majority vote + agreement threshold
  - Fallback: escalate (return low_confidence flag) or retry with different judges
  - Test: Consensus edge cases (2 vs. 1 voting, 75% threshold)
  - Gate: Fallback logic tested; metrics logged

  **Phase 4: Integration & Polish (Day 2-3)**
  - Integrate with mde CLI: `uv run mde-py adversarial-review <task>`
  - Add caching: Debate reproducibility via functools.lru_cache
  - Structured output: Add Outlines if using non-API models
  - Documentation: Debate prompt library, consensus strategy guide
  - Test: End-to-end test (3 models, 2 rounds, structured output)
  - Gate: Quality checks (ruff, type checking, pytest, docstrings)

  **Total Implementation Time: 2-3 days**
  - 150 lines: SubprocessLMProvider
  - 100 lines: DebateOrchestrator
  - 100 lines: ConsensusScoringSystem
  - 100 lines: Judge prompts + templates
  - 150 lines: Tests + integration
  - **~600 lines total, NOT a new library**

  **Cost Comparison:**
  - Building from scratch: 2-4 weeks, 2000+ lines, new library maintenance
  - Composing existing: 2-3 days, 600 lines, zero new library maintenance
  - User preference honored: "assemble existing → build new (LAST RESORT)" ✓

