implication: |
  **RECOMMENDATION: Build a thin Python wrapper in src/mde/domain/**

  Option A (RECOMMENDED - "Option A: subprocess wrapper") is the ONLY viable path because:

  1. **Subscription auth works correctly**: No API key exposure, uses system auth
  2. **Zero dependencies**: No new PyPI packages needed (subprocess is stdlib)
  3. **Composable design**: Each CLI is a backend provider via simple wrapper functions
  4. **Type-safe implementation**: Can use Pydantic models for unified input/output
  5. **Follows mde philosophy**: Library-first (found 3 working CLIs), no building SDK
  6. **Consistent with policy**: No shell scripts — wrap in Python domain module

  **Pattern for src/mde/domain/multi_model.py:**

  ```python
  from dataclasses import dataclass
  from enum import Enum
  import subprocess
  from typing import Protocol

  class CodeReviewer(Protocol):
      def review(self, code: str, lang: str = "python") -> str: ...

  @dataclass
  class ReviewResult:
      model: str
      verdict: str  # "approved", "issues_found", "critical"
      details: str
      duration_sec: float

  class CodeXReviewer:
      def review(self, code: str, lang: str = "python") -> str:
          result = subprocess.run(
              ["codex", "review", code],
              capture_output=True, text=True, timeout=30
          )
          return result.stdout

  class GeminiReviewer:
      def review(self, code: str, lang: str = "python") -> str:
          result = subprocess.run(
              ["gemini", f"Review this {lang} code for issues: {code}"],
              capture_output=True, text=True, timeout=30
          )
          return result.stdout

  class ClaudeReviewer:
      def review(self, code: str, lang: str = "python") -> str:
          result = subprocess.run(
              ["claude", "--print", f"Review this {lang} code for issues: {code}"],
              capture_output=True, text=True, timeout=30
          )
          return result.stdout

  def adversarial_code_review(code: str, consensus_threshold: float = 0.66) -> dict:
      """Run code through all three models, return consensus verdict."""
      reviewers = {
          "codex": CodeXReviewer(),
          "gemini": GeminiReviewer(),
          "claude": ClaudeReviewer()
      }
      results = {}
      for name, reviewer in reviewers.items():
          results[name] = ReviewResult(
              model=name,
              verdict=parse_verdict(reviewer.review(code)),
              details=reviewer.review(code),
              duration_sec=0.0  # timing not captured yet
          )
      return {
          "individual_results": results,
          "consensus": calculate_consensus(results, consensus_threshold),
          "recommendation": "HOLD_FOR_REVIEW" if disagreement else "APPROVED"
      }
  ```

  **Why NOT the other options:**
  - B (DSPy/BAML): Requires API keys, defeats subscription-auth goal
  - C (Claude Code plugins): Can only spawn Claude agents, not CodeX/Gemini
  - D (MCP server bridge): Over-engineered for CLI input/output wrappers

