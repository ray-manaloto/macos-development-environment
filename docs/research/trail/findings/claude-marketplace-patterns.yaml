## Marketplace.json Schema (Root Catalog)

Required fields:
- `name` (string) — marketplace identifier
- `owner` (object) — owner details
  - `name` (string) — organization/person name
  - `email` (string, optional) — contact email
  - `url` (string, optional) — homepage URL
- `plugins` (array) — list of plugin descriptors

Optional fields:
- `$schema` (string) — pointer to https://anthropic.com/claude-code/marketplace.schema.json
- `description` (string) — marketplace purpose
- `version` (string) — marketplace version
- `metadata` (object) — additional context

Example:
```json
{
  "$schema": "https://anthropic.com/claude-code/marketplace.schema.json",
  "name": "cli-anything",
  "owner": { "name": "cli-anything contributors" },
  "metadata": { "description": "Build powerful, stateful CLI interfaces for any GUI application" },
  "plugins": [...]
}
```

## Plugin Descriptor Schema (in marketplace.json)

Required:
- `name` (string) — unique plugin identifier within marketplace
- `source` (string | object) — plugin location (3 patterns below)
- `description` (string) — plugin purpose

Optional:
- `version` (string) — semantic version
- `author` (object) — author details {name, email, url}
- `category` (string) — functional category (e.g., "development", "productivity", "security")
- `tags` (array) — searchable keywords
- `homepage` (string) — plugin documentation URL
- `repository` (string) — git repository URL
- `license` (string) — license type (e.g., "MIT")
- `keywords` (array) — additional search terms

## Source Pattern 1: Local Directory

```json
{
  "name": "my-plugin",
  "source": "./plugins/my-plugin",
  "description": "..."
}
```

Location: `{marketplace-root}/plugins/my-plugin/`

## Source Pattern 2: External Git URL

```json
{
  "name": "external-plugin",
  "source": {
    "source": "url",
    "url": "https://github.com/owner/repo.git",
    "sha": "commit-sha-hash"
  }
}
```

Claude Code clones the repo, checks out specific commit for reproducibility.

## Source Pattern 3: Git Subdirectory

```json
{
  "name": "subdir-plugin",
  "source": {
    "source": "git-subdir",
    "url": "owner/repo",  # GitHub shorthand
    "path": "plugins/subdir-plugin",
    "ref": "main",
    "sha": "commit-sha"
  }
}
```

Fetches specific directory from a git repository.

## Plugin Directory Structure

Each plugin directory must contain:
- `plugin.json` — individual plugin metadata
- Plugin source code (skills, scripts, config files)
- Optional: `.claude-plugin/plugin.json` (cached copy)

Example plugin.json:
```json
{
  "name": "pyright",
  "version": "0.1.0",
  "description": "Python language server with excellent type checking",
  "author": { "name": "Author Name", "email": "email@example.com" },
  "repository": "https://github.com/microsoft/pyright",
  "license": "MIT",
  "keywords": ["python", "lsp", "language-server", "type-checking"]
}
```

## Special Plugin Types

### Skills-Based Plugins

Array of skill paths in plugin descriptor:
```json
{
  "name": "document-skills",
  "source": "./",
  "skills": [
    "./skills/xlsx",
    "./skills/docx",
    "./skills/pptx"
  ]
}
```

Each skill directory: `{plugin-root}/skills/{skill-name}/`

### LSP Plugins

Include `lspServers` object:
```json
{
  "lspServers": {
    "python": {
      "command": "pyright-langserver",
      "args": ["--stdio"],
      "transport": "stdio",
      "extensionToLanguage": { ".py": "python" },
      "initializationOptions": {},
      "settings": {},
      "maxRestarts": 3
    }
  }
}
```

