## Discovery & Installation

**Adding a marketplace:**
```
/plugin marketplace add <owner/repo>
```

**Browse plugins:**
- `/plugin` command in Claude Code
- Lists all plugins from registered marketplaces
- Searchable by name, category, tags

**Install specific plugin:**
```
/plugin install <plugin-name>
```

Claude Code:
1. Finds plugin across all registered marketplaces
2. Resolves source (local, URL, or git-subdir)
3. Downloads/clones if needed
4. Runs plugin.json initialization
5. Caches in ~/.claude/plugins/cache/

## Registration Patterns

**Anthropic Official Registry:**
- `claude-plugins-official`: 90+ plugins (central authority model)
- Accept submissions via GitHub PRs to anthropics/claude-plugins-public
- Schema validation required

**Community Marketplaces:**
- Standalone git repos with marketplace.json
- Discovered by adding marketplace URL
- Examples: cli-anything, knowledge-work-plugins, context7-marketplace
- No central approval (user opts in to trust)

**Embedded Marketplaces:**
- Maintained by tool authors (Docker, Astral, etc.)
- Auto-discovered or manually added
- Tool-specific plugins (Docker MCP, uv workflows, etc.)

## Key Insights

1. **Schema-Driven**: All marketplaces conform to https://anthropic.com/claude-code/marketplace.schema.json
2. **Multi-Source**: Supports local dirs, git URLs, git subdirectories for flexibility
3. **Lazy Loading**: Plugins not downloaded until `/plugin install` called
4. **Caching**: Downloaded plugins cached in ~/.claude/plugins/cache/{owner}/{name}/{version}/
5. **Versioning**: Individual plugins have semantic versions; marketplace.json can pin commits via `sha`
6. **Categorization**: Plugins tagged with category + keywords for discoverability
7. **Trust Model**: Users explicitly add marketplaces; no automatic discovery
8. **Composition**: Skills can be bundled (arrays) or individual; LSPs have special lspServers section

## For rsm-subagents Marketplace

1. Create git repo: `ray-manaloto/rsm-subagents`
2. Root marketplace.json with owner + 3-5 domain-specific plugins
3. Each plugin in subdirectory: python-agent, mise-specialist, security-auditor, etc.
4. Each plugin.json with category, keywords, author
5. Source type: local (./plugins/) for tightly-coupled agents, or external git-url for published subagents
6. User registration: `git clone && /plugin marketplace add ray-manaloto/rsm-subagents`
7. Discovery: Plugin list filterable by category and keywords
