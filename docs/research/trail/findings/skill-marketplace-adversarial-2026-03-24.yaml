confident_about: |
  **No pre-built adversarial review skills exist in current Claude Code marketplaces.**

  Skill marketplace landscape:
  1. skills.sh — Primary Claude Code skill registry (~1000+ skills indexed)
  2. Awesome Claude Code — GitHub community collection (mirrors some of skills.sh)
  3. Factorial AI Marketplace — Alternative registry (lower volume)
  4. Awesome Claude Plugins — Pre-integrated plugin references

  **Multi-model orchestration skills exist** (sub-agents, consensus gates), but
  **dedicated adversarial review/debate skills are absent.**

gaps: |
  1. **No "adversarial review" skill published.**
     - Keyword searches: "adversarial", "debate", "consensus", "judge", "review" yield
       only general-purpose orchestration skills, not adversarial-specific
     - Closest matches: sub-agents, claude-octopus (has consensus gates but not adversarial framing)

  2. **Skills marketplace does NOT index internal/private skills.**
     - User can create private skills in .claude/skills/ without publishing
     - Adversarial review may exist in private skill collections (not discoverable)

  3. **No standardized "adversarial review" skill template.**
     - Skills are primarily for orchestration (calling other agents)
     - None specifically designed for multi-model comparison/debate

