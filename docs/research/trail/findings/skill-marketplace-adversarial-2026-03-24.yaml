  - 300+ indexed skills
  - Categories: agents, infrastructure, dev tools, productivity, learning
  - Subagents section: includes nyldn/claude-octopus, dsifry/metaswarm (orchestration patterns)
  - **No dedicated "adversarial review" or "LLM evaluation" category**

  **AWESOME CLAUDE PLUGINS:**
