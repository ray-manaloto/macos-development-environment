implication: |
  **CONCLUSION: Adversarial review skills must be created (not discovered).**

  **What EXISTS in skill marketplaces:**
  1. Multi-agent orchestration (claude-octopus, sub-agents) with consensus gates
  2. LLM routing (multi-provider routers)
  3. Code review automation (not for LLM models)
  4. General debate/discussion assistants (not adversarial evaluation)

  **What DOES NOT exist:**
  1. Dedicated "adversarial review" skill
  2. "Multi-model debate/consensus" skill (though claude-octopus has 75% consensus gates)
  3. "LLM judge" skill (alpaca_eval-style comparative evaluation)
  4. "Structured adversarial testing" skill

  **Recommended skill structure (for building new):**

  ```
  skills/
  ├── adversarial-review/
  │   ├── orchestrator.py  # main entry: DSPy + SubprocessLMProvider
  │   ├── debate_patterns.py  # MultiChainComparison logic
  │   ├── consensus_gate.py  # voting + agreement threshold
  │   └── prompt_templates.yaml  # adversarial judge prompts
  └── README.md  # skill documentation
  ```

  **Dependency:** Requires DSPy ecosystem (Task #2 finding: compose DSPy + custom adapter)

  **Alternative:** Clone claude-octopus architecture, extend with structured debate workflow

