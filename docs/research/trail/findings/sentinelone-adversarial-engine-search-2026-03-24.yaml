confident_about: |
  SentinelOne's "adversarial consensus engine" does NOT exist as a public library or open-source repository.

  SentinelOne is a **Managed Detection & Response (MDR) / Extended Detection & Response (XDR) platform**
  specializing in endpoint security, not LLM evaluation or multi-model orchestration.

  Core products:
  - Singularity XDR (platform)
  - Singularity Endpoint (EDR)
  - Singularity Cloud (cloud workload security)
  - Singularity Ranger (vulnerability management)
  - SentinelOne Ranger Threat Intel

gaps: |
