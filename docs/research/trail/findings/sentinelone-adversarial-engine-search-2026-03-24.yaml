     - sentinelone org: ~50 repositories (mostly Singularity API SDKs, examples, PoCs)
     - Search "sentinelone adversarial": 0 results
     - Search "sentinelone consensus": 0 results
     - Search "sentinelone engine": 7 results (all unrelated: naming/labeling/tagging engines for threat data)

  3. **What SentinelOne DOES publish:**
     - Singularity SDK (Python): https://github.com/sentinelone/singularity-sdk-python
     - REST API for threat hunting + endpoint management
     - Threat intelligence feeds
     - Detection rules (not consensus-based; signature/behavioral)

