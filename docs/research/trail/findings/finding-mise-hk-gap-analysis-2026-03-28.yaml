gaps: |
  1. **hk validate not in validation pipeline**: mde/validate/__init__.py calls validate_mise()
     but does NOT call hk validate. The pre-commit hook runs hk check automatically, but
     the validate CLI subcommand never explicitly tests hk.pkl config validity.

  2. **direnv installed but not documented in CLAUDE.md**: direnv v2.37.1 is present;
     no mention in project instructions. Could conflict with fnox secret activation
     (both use shell hooks) — compatibility unclear.

  3. **mise direnv integration not explored**: mise.jdx.dev/direnv.html covers:
     - Using direnv with mise via `use mise` in .envrc
     - Lazy loading tools via direnv
     - Integration with MISE_ENV_CACHE for fnox
     - Project has direnv installed but no .envrc file present

  4. **hk builtins documentation not used in project**: 178 builtins available (ruff,
     shellcheck, ty, mixed_line_ending, etc.). Project only uses ruff, ruff_format,
     shellcheck in hk.pkl. Other useful builtins not exposed:
     - prettier (for docs markdown)
     - markdown_lint (for docs validation)
     - yamllint (for config files)
     - typos (spelling check)

  5. **hk profiles not utilized**: hk supports --profile flag with slow/fast syntax.
     Project's hk.pkl has no [profiles] section. Could optimize pre-commit (fast)
     vs pre-push (slow + full quality gate).

  6. **mise integration with hk not fully exploited**: hk can run via mise tasks.
     Project defines [tasks."mde:validate"] but it calls `uv run mde-py validate`
     (Python code) instead of `hk check` or delegating to hk for structural checks.

  7. **Documentation gaps**:
     - No integration guide between fnox activate and direnv activate
     - hk.pkl amends upstream but upstream changes not monitored
     - Builtins like prettier/yamllint not adopted despite availability
