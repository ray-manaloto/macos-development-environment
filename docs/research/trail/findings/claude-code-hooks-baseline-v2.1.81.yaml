confident_about: |
  Complete inventory of all 22 hook events in Claude Code v2.1.81 as documented in
  the official hooks reference. Each event is documented with its purpose, when it
  fires, available stdin fields, blocking behavior, and matcher field configuration.
  Comparison with Agent SDK shows CLI hooks are superset of SDK hooks.

gaps: |
  - Exact JSON schema for each event's stdin fields not yet extracted from HTML (docs
    page uses rendered React, not embedded JSON schemas)
  - Exit code behavior table for all 22 events not yet fully documented
  - Precise field types (string vs int vs bool) for stdin fields requires SDK type definitions
  - HTTP hook response handling specific to each event requires additional research
  - Async/prompt/agent hook-specific behavior patterns need detailed examples

evidence: |
  Official hooks reference page (code.claude.com/docs/en/hooks) documents:

  1. LIFECYCLE HOOKS (5 events)
     - SessionStart: Fires when session starts
     - InstructionsLoaded: Fires when instructions/.claude/CLAUDE.md loaded
     - SessionEnd: Fires when session ends
     - PreCompact: Fires before context compaction
     - PostCompact: Fires after context compaction

  2. INTERACTION HOOKS (5 events)
     - UserPromptSubmit: Fires when user submits prompt
     - PreToolUse: Fires before any tool execution (can block)
     - PostToolUse: Fires after successful tool execution
     - PostToolUseFailure: Fires after tool execution fails
     - Stop: Fires when user clicks stop button (can block completion)

  3. AGENT/TEAM HOOKS (4 events)
     - SubagentStart: Fires when subagent starts (Agent SDK: documented in SDK)
     - SubagentStop: Fires when subagent stops
     - TeammateIdle: Fires when teammate agent goes idle (can block)
     - TaskCompleted: Fires when a task completes (can block)

  4. PERMISSION & SECURITY HOOKS (2 events)
     - PermissionRequest: Fires when permission requested (can block with decision)
     - ConfigChange: Fires when config changes (can block)

  5. FILE SYSTEM HOOKS (2 events)
     - WorktreeCreate: Fires when worktree created (can output operations)
     - WorktreeRemove: Fires when worktree removed

  6. NOTIFICATION & ELICITATION HOOKS (3 events)
     - Notification: Fires for notifications (no output/decision)
     - Elicitation: Fires to request LLM-based input (can return response)
     - ElicitationResult: Fires after elicitation response (can output)

  7. SPECIAL HOOKS (1 event)
     - StopFailure: Fires when stop command fails (new in v2.1.81)

implication: |
  For hook implementation in MDE:

  1. Design hk.pkl hook definitions around these 22 events, not assumptions
  2. Blocking vs non-blocking behavior differs by event (not all events can block)
  3. Some events (Elicitation, WorktreeCreate) have special "output" mode (not just exit codes)
  4. Matcher field behavior is event-specific (some match tool names, some don't)
  5. Agent SDK provides types for 12 events; CLI adds 10 additional events
  6. Hook configuration can be command, HTTP, prompt-based, or agent-based (4 execution modes)
  7. Async hooks (Configure an async hook section) supported for non-blocking events only

  Research phases needed:
  - Phase 2: Extract full stdin JSON schema for each event (requires SDK type definitions)
  - Phase 3: Document exit code behavior matrix (which events support exit code 1/2 blocking)
  - Phase 4: Catalog matcher field behavior per event
  - Phase 5: Elicitation + WorktreeCreate special output formats

