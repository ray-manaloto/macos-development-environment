# Hook Execution Modes (from documentation)
hook_execution_modes:
  - mode: command
    description: "Shell command execution (sh/bash/zsh)"
    supported_by: "All events"
    notes: "Receives stdin JSON, must use exit code for blocking"

  - mode: http
    description: "HTTP POST request to endpoint"
    supported_by: "All events"
    notes: "Receives JSON in request body, HTTP response status controls behavior"

  - mode: prompt
    description: "LLM prompt-based hook (Claude evaluates)"
    supported_by: "Most events; special handling for Elicitation"
    notes: "Uses Elicitation event for user input, returns structured response"

  - mode: agent
    description: "Run hook as full agent subprocess"
    supported_by: "Non-blocking events"
    notes: "Runs asynchronously; cannot block main Claude Code flow"

