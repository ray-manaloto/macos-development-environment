implication: |
  For our python-quality-toolkit plugin:

  REUSE from wshobson/agents:
  - marketplace.json schema (name, owner, metadata, plugins array)
  - plugin.json schema (name, version, description, author, license)
  - Skill file convention: skills/<skill-name>/SKILL.md with frontmatter (name, description)
  - Agent file convention: agents/<name>.md with frontmatter (name, description, model)
  - Command file convention: commands/<name>.md
  - Progressive disclosure pattern (skills loaded only when activated)
  - Plugin isolation pattern (each plugin self-contained)
  - Category system for organizing plugins

  BUILD (gaps in wshobson ecosystem):
  - Tool-wrapping skills that actually INVOKE ruff, ty, pyright, pytest (not just describe them)
  - Hooks (pre-commit, post-save) -- zero hooks in any wshobson plugin
  - Python automation modules (their repo is 99% markdown instruction, 0% executable code)
  - Quality gate integration (run ruff+ty+pytest as a gate)
  - pyproject.toml configuration skills (their skills mention it but don't generate configs)
  - ty-specific skill (wshobson has no ty coverage at all)
  - mise integration (wshobson assumes pip/uv but not mise-managed tools)

  PATTERN to adopt:
  - Single-purpose plugins with 2-8 components (their average is 3.4)
  - Skills as progressive disclosure markdown (load knowledge only when activated)
  - Keep agents at opus model for deep expertise, sonnet for reviews
  - Flat directory structure: plugins/<name>/{agents,commands,skills,hooks}/
