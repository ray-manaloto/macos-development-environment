confident_about: >
  wshobson/agents is the largest Claude Code plugin marketplace (32,251 stars).
  Contains 72 focused plugins, 112 agents, 146 skills, 16 orchestrators, 79 tools.
  The python-development plugin has 3 agents (python-pro, django-pro, fastapi-pro),
  1 command (python-scaffold), and 16 skills. Skills are pure markdown SKILL.md files
  with progressive disclosure (loaded only when activated). No hooks in any plugin.
  Repo is 99% markdown (515 .md files out of 613 total). Only 3 Python files exist
  (2 in skill asset dirs, 1 standalone tool). Only 1 shell script (helm chart validation).
  marketplace.json lives at .claude-plugin/marketplace.json with flat plugin array.
  Each plugin has its own .claude-plugin/plugin.json with name, version, description.
gaps: >
  No ruff-specific skill, no ty skill, no pyright skill, no pytest-specific skill.
  Ruff/mypy/pyright are MENTIONED in python-code-style and python-type-safety skills
  as text guidance but there are no tool-wrapping skills that actually invoke these tools.
  No hooks at all in any plugin. No Python modules for automation. Everything is
  instructional markdown, not executable. The python-pro agent references mypy/pyright
  but not ty specifically. No quality gate pattern. No pre-commit integration.
