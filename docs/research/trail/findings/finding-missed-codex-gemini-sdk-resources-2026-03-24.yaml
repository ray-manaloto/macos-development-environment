implication: |
  **For Claude Code agent dispatch:**

  1. **Two integration paths for Python-based agents:**
     - Path A: Wrap acodex (CLI-based) for direct Codex agent calls with streaming
     - Path B: Wrap codex-python-sdk (app-server-based) for JSON-RPC control via subprocess

  2. **Architectural choice:**
     - acodex is subprocess-simpler (just spawning codex CLI)
     - codex-python-sdk is more explicit about app-server protocol but heavier setup
     - Both support subscription auth only (no API key fallback in acodex)

  3. **MCP integration opportunity:**
     - codex-rs can run as MCP server (`codex mcp-server`)
     - Claude Code agents could theoretically register Codex as MCP server
     - Enables bidirectional tool calling (Codex as tool, Claude Code as tool)

  4. **Search query improvements:**
     - Add "acodex" to indexed keywords (underrecognized despite high quality)
     - Check community.openai.com for SDK announcements (spdcoding's post has 263 links)
     - Monitor GitHub releases for https://github.com/openai/codex (67k+ watchers)
     - Include Vercel AI SDK provider ecosystem as part of agent harness research

  5. **Subscription auth validation:**
     - Both acodex and codex-python-sdk default to ChatGPT Plus subscription auth
     - API key auth is secondary/optional in codex-python-sdk
     - Verify user's Codex setup includes ChatGPT auth before agent dispatch
