evidence: |
  **codex-python-sdk (spdcoding/codex-python-sdk)**
  - Repository: https://github.com/spdcoding/codex-python-sdk
  - Stars: 6 (early stage)
  - Language: Python
  - Latest push: 2026-03-15T16:51:30Z
  - Installation: `uv add codex-python-sdk` or `pip install codex-python-sdk`
  - What it is: Synchronous + asynchronous Python wrapper around `codex app-server` JSON-RPC protocol
  - Provides: High-frequency response APIs (responses_create, responses_events, responses_stream_text)
  - Thread/turn control: thread_start, thread_read, thread_list, thread_fork, thread_rollback
  - Policy hooks: RuleBasedPolicyEngine with command/file-change/tool-input approval
  - Features: Structured streaming ResponseEvent objects, predictable error types (NotAuthenticatedError, SessionNotFoundError)
  - Subscription auth: Works with ChatGPT Plus/Pro/Team/Edu/Enterprise plans OR API keys
  - Use case: Scripting, automation pipelines, UI integration
  - Community forum: Discussed at community.openai.com (263 incoming links to discussion)

  **acodex (maksimzayats/acodex)**
  - Repository: https://github.com/maksimzayats/acodex
  - Stars: 53 (Feb 2026)
  - Language: Python
  - Latest push: 2026-03-23T12:39:35Z
  - Installation: `uv add acodex` or `pip install acodex` (with structured-output extra for validation)
  - What it is: Fast, typed Python SDK wrapping Codex CLI directly via subprocess/JSONL events
  - Prerequisite: Codex CLI must be installed (`npm install -g @openai/codex` or `brew install --cask codex`)
  - Provides: Thread objects with run(), run_streamed(), streaming parsed events (ItemCompletedEvent, TurnCompletedEvent, TurnFailedEvent)
  - Structured output: Output validation via Pydantic models (output_type parameter)
  - Images: Supports UserInputLocalImage alongside text
  - Resume threads: Threads persisted under ~/.codex/sessions
  - Safety controls: ThreadOptions with sandbox_mode, approval_policy, web_search_mode, working_directory
  - Subscription auth: Works with ChatGPT Plus/Pro/Team/Edu/Enterprise plans
  - TS SDK parity: Vendored TypeScript SDK source of truth; vendored under vendor/codex-ts-sdk/src/
  - Use case: Agent threads, conversational loops, structured output validation
  - Quality gates: Ruff + mypy strict + 100% coverage

  **codex-rs (openai/codex)**
  - Repository: https://github.com/openai/codex (Rust implementation)
  - Stars: 67,350
  - Language: Rust
  - What it is: Official Codex CLI native executable (replaces legacy TypeScript CLI)
  - Installation: npm install -g @openai/codex OR brew install --cask codex OR download from GitHub Releases
  - Core subcommands:
    - `codex` - interactive TUI agent
    - `codex exec PROMPT` - non-interactive headless mode
    - `codex app-server` - JSON-RPC server over stdio (experimental websocket support)
    - `codex mcp-server` - MCP server mode (allows other MCP clients to use Codex as a tool)
    - `codex sandbox {macos,linux,windows}` - test sandbox policies
  - Config: TOML-based (~/.codex/config.toml) instead of JSON
  - MCP support: Client (connects to MCP servers) + Server (exposes Codex to other MCP clients)
  - Sandbox modes: read-only (default), workspace-write, danger-full-access
  - Notifications: Desktop notifications on task completion (configurable script)
  - Subscription auth: Sign in with ChatGPT (Plus/Pro/Team/Edu/Enterprise) or API key

  **codex-python-sdk community discussion (OpenAI Community)**
