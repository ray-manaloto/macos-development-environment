confident_about: |
  Two major Python SDKs for Codex exist:

  1. codex-python-sdk (spdcoding/codex-python-sdk) - focuses on app-server JSON-RPC
  2. acodex (maksimzayats/acodex) - wraps Codex CLI with subprocess/streaming

  Both are pip-installable, support sync/async, streaming, and work with subscription auth.
  The codex-rs implementation (67.3k stars) provides app-server HTTP endpoint.
  Vercel AI SDK has community providers for Codex CLI and Gemini CLI.
