# CROSS-CUTTING GAPS SUMMARY
# ─────────────────────────────────────────────
gaps_summary:
  high:
    - id: "hk-mise-install-flag"
      description: >
        hk was not installed with --mise flag. Hooks may fail for developers/IDE
        integrations where mise is not activated. Run `hk install --mise` to wrap
        hooks with `mise x` for robust PATH setup.
      effort: trivial
      command: "hk install --mise"

  medium:
    - id: "hk-log-file-integration"
      description: >
        No persistent hk log file. Add HK_LOG_FILE=.generated/logs/hk.log to mise
        env or quality gate so hook failures are preserved across sessions.
      effort: small
      suggestion: "Add to mise.toml [env]: HK_LOG_FILE = '.generated/logs/hk.log'"

    - id: "hk-timing-json-ci"
      description: >
        HK_TIMING_JSON not used. Per-step wall time report (.generated/hk-timing.json)
        would help identify slow steps in the quality gate.
      effort: small

  low:
    - id: "pklr-backend-test"
      description: >
        HK_PKL_BACKEND=pklr not tested. Would eliminate pkl CLI subprocess overhead.
        Experimental but worth evaluating.
      effort: trivial
      command: "HK_PKL_BACKEND=pklr hk validate"

    - id: "hk-validate-verbose"
      description: >
        mde/validate/hk.py could pass -v to `hk validate` for richer error output
        on failure. Currently surfaces stdout+stderr but without debug detail.
      effort: trivial
      location: "src/mde/validate/hk.py line 51"

    - id: "stash-mode"
      description: >
        hk.pkl uses stash = "none". stash = "git" is safer (ensures only staged
        content is checked). Low risk for this project but worth considering.
      effort: trivial

    - id: "profiles-for-ci"
      description: >
        hk supports profiles = List("ci", "full") on steps for conditional execution.
        Could make the quality_gate step CI-only or use a "fast" profile for
        iterative development.
      effort: small

  not_applicable:
    - id: "monorepo-groups"
      reason: "Single-package repo — Group type not needed"
    - id: "mise-tasks-in-hk"
      reason: "quality gate correctly calls uv run mde-py quality directly"

implication: >
  Most urgent action: run `hk install --mise` to ensure hook PATH reliability.
  Medium value: add HK_LOG_FILE to mise.toml env for persistent debugging.
  The mde validate/hk.py is correct and complete — no rework needed there.
  pklr backend worth testing once it stabilizes (eliminates pkl CLI dep).

