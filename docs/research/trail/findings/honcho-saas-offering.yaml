  - Medium: $0.05/query (steerable reasoning, fast)
  - High: $0.10/query (deep synthesis, async)
  - Max: $0.50/query (research-grade, async)

  SPECIAL PROGRAMS:
  - Startups (<$5M raised): $1,000 free credits + 12 months subsidized pricing
  - Enterprise: Custom plans with dedicated engineers

  SIGN-UP OFFER:
