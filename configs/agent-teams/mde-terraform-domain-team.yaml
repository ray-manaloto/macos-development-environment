team:
  id: mde-terraform-domain-team
  name: MDE Terraform Domain Team
  domain_id: terraform
  goal: Maintain mirror-first research, authority policy, starter bundles, presets, and learning writeback for the terraform domain.
  output_dir: reports/mde-domain-sdlc/terraform
  shared_artifacts_dir: .artifacts/mde-domain-sdlc/terraform
  repo_root: /Users/rmanaloto/dev/github/ray-manaloto/macos-development-environment
  bundle_path: configs/tool-bundles/terraform
  preset_ids: ["preset-terraform", "preset-platform-iac"]
  reference_source_group: terraform
  learning_record_id: domain-terraform

subagents:
  - id: mirror-refresh-agent
    stage: 1
    objective: Refresh mirror-first sources and capture freshness gaps for the terraform domain.
    required_skills: [skills/mde-agent-runtime-contract, skills/mise-enforcement, skills/research-source-discovery]
    output_files:
      - reports/mde-domain-sdlc/terraform/{{date}}-01-mirror-refresh.md
    prompt_file: prompts/agent-team/mde-domain-sdlc/mirror-refresh-agent.md

  - id: docs-tutorial-agent
    stage: 2
    objective: Extract practical documentation and tutorial guidance for the terraform domain.
    required_skills: [skills/mde-agent-runtime-contract, skills/mise-enforcement, skills/research-source-discovery]
    output_files:
      - reports/mde-domain-sdlc/terraform/{{date}}-02-docs-tutorial.md
    prompt_file: prompts/agent-team/mde-domain-sdlc/docs-tutorial-agent.md

  - id: repo-mining-agent
    stage: 2
    objective: Mine upstream repositories and exemplars for portable patterns in the terraform domain.
    required_skills: [skills/mde-agent-runtime-contract, skills/mise-enforcement, skills/github-repo-mining]
    output_files:
      - reports/mde-domain-sdlc/terraform/{{date}}-03-repo-mining.md
    prompt_file: prompts/agent-team/mde-domain-sdlc/repo-mining-agent.md

  - id: social-signal-agent
    stage: 2
    objective: Gather grounded social and discussion signals for the terraform domain.
    required_skills: [skills/mde-agent-runtime-contract, skills/mise-enforcement, skills/social-signal-mining]
    output_files:
      - reports/mde-domain-sdlc/terraform/{{date}}-04-social-signal.md
    prompt_file: prompts/agent-team/mde-domain-sdlc/social-signal-agent.md

  - id: authority-agent
    stage: 3
    objective: Define the authority model, companion manifests, and exception boundaries for the terraform domain.
    required_skills: [skills/mde-agent-runtime-contract, skills/mise-enforcement, skills/evidence-synthesis]
    output_files:
      - reports/mde-domain-sdlc/terraform/{{date}}-05-authority.md
    prompt_file: prompts/agent-team/mde-domain-sdlc/authority-agent.md

  - id: implementation-agent
    stage: 3
    objective: Turn accepted domain decisions into starter-bundle and preset recommendations for terraform.
    required_skills: [skills/mde-agent-runtime-contract, skills/mise-enforcement, skills/writing-plans]
    output_files:
      - reports/mde-domain-sdlc/terraform/{{date}}-06-implementation.md
    prompt_file: prompts/agent-team/mde-domain-sdlc/implementation-agent.md

  - id: validation-agent
    stage: 4
    objective: Define validation commands and acceptance rules for the terraform domain.
    required_skills: [skills/mde-agent-runtime-contract, skills/mise-enforcement, skills/evidence-synthesis]
    output_files:
      - reports/mde-domain-sdlc/terraform/{{date}}-07-validation.md
    prompt_file: prompts/agent-team/mde-domain-sdlc/validation-agent.md

  - id: learning-consolidator-agent
    stage: 5
    objective: Consolidate accepted findings into the domain-terraform learning record.
    required_skills: [skills/mde-agent-runtime-contract, skills/mise-enforcement, skills/evidence-synthesis, skills/writing-plans]
    output_files:
      - reports/mde-domain-sdlc/terraform/{{date}}-08-learning-consolidator.md
    prompt_file: prompts/agent-team/mde-domain-sdlc/learning-consolidator-agent.md
