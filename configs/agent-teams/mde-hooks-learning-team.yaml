team:
  id: mde-hooks-learning-team
  name: Hooks + Self-Learning Team
  goal: Create review enforcement hooks and self-learning outcome logging.
  output_dir: reports/hooks-learning
  shared_artifacts_dir: .artifacts/hooks-learning
  repo_root: .
  workflow_skill: superpowers:subagent-driven-development

subagents:
  - id: stop-hook-writer
    stage: 1
    objective: Create TaskCompleted hook that enforces verification evidence before completion.
    required_skills: [skills/mde-agent-runtime-contract, superpowers:verification-before-completion]
    required_plugins: [superpowers]
    output_files: [src/mde/hooks/verify_task.py]
    prompt_file: prompts/agent-team/hooks-learning/stop-hook-writer.md

  - id: learning-hook-writer
    stage: 1
    objective: Create PostToolUse hook that logs edit outcomes for pattern analysis.
    required_skills: [skills/mde-agent-runtime-contract]
    required_plugins: [superpowers]
    output_files: [src/mde/hooks/log_outcome.py]
    prompt_file: prompts/agent-team/hooks-learning/learning-hook-writer.md

  - id: settings-integrator
    stage: 2
    objective: Wire hooks into .claude/settings.json and revert global plugin disabling.
    required_skills: [skills/mde-agent-runtime-contract, superpowers:verification-before-completion]
    required_plugins: [superpowers]
    output_files: [.claude/settings.json]
    prompt_file: prompts/agent-team/hooks-learning/settings-integrator.md

  - id: hooks-reviewer
    stage: 3
    objective: Verify hooks fire correctly, don't block normal operation, and log structured output.
    required_skills: [skills/mde-agent-runtime-contract, superpowers:verification-before-completion, superpowers:systematic-debugging]
    required_plugins: [superpowers]
    gate_criteria:
      - "TaskCompleted hook exits 0 on normal completion"
      - "PostToolUse hook writes valid JSONL"
      - ".claude/settings.json has hooks section + reverted plugin disabling"
    output_files:
      - "reports/hooks-learning/{{date}}-review.md"
    prompt_file: prompts/agent-team/hooks-learning/hooks-reviewer.md
