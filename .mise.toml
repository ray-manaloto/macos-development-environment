[tasks."mde:notebooklm:status"]
description = "Check NotebookLM auth status for both CLI and MCP"
run = """
echo "=== CLI (notebooklm-py) ==="
notebooklm auth check --json 2>&1
echo ""
echo "=== MCP (notebooklm-mcp-cli) ==="
nlm notebook list --json 2>&1 | head -5 && echo "✓ MCP auth OK" || echo "✗ MCP auth expired — run: mise run mde:notebooklm:refresh"
"""

