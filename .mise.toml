[tasks."mde:codegen:statusline"]
description = "Regenerate statusline Pydantic models from JSON Schema"
run = """
uv run datamodel-codegen \
  --input src/mde/statusline/statusline-stdin.schema.json \
  --input-file-type jsonschema \
  --output src/mde/statusline/models.py \
  --output-model-type pydantic_v2.BaseModel \
  --target-python-version 3.12 \
  --use-annotated \
  --use-union-operator \
  --field-constraints \
  --use-default-kwarg \
  --collapse-root-models \
  --strict-nullable \
  --use-one-literal-as-default \
  --enum-field-as-literal all \
  --capitalise-enum-members \
  --allow-extra-fields \
  --formatters ruff-format ruff-check
"""

[tasks."mde:codegen:skillsmp"]
description = "Regenerate SkillsMP Pydantic models from JSON Schema + apply post-gen edits"
run = """
uv run datamodel-codegen \
  --input docs/schemas/skillsmp.schema.json \
  --input-file-type jsonschema \
  --output src/mde/research/clients/skillsmp_models.py \
  --output-model-type pydantic_v2.BaseModel \
  --target-python-version 3.12 \
  --use-annotated \
  --use-union-operator \
  --field-constraints \
  --use-default-kwarg \
  --collapse-root-models \
  --strict-nullable \
  --use-one-literal-as-default \
  --allow-extra-fields \
  --snake-case-field \
  --formatters ruff-format ruff-check && \
uv run python -m mde.codegen.postprocess_skillsmp && \
uv run ruff format src/mde/research/clients/skillsmp_models.py
"""

