        version: latest
      - name: "npm:@langchain/langgraph-cli"
        version: latest
      - name: "npm:@langchain/langgraph-ui"
        version: latest
      - name: "npm:openwork"
        version: latest

    agent_stack:
      - name: "npm:@teng-lin/agent-fetch"
        version: latest
      - name: "pipx:aider-chat"
        version: latest
      - name: "pipx:skypilot"
        version: latest
        config:
          extras: aws
      - name: "pipx:skillport"
        version: latest
      - name: "pipx:specify-cli"
        version: latest

    typescript_lsp:
      - name: "npm:pyright"
        version: latest
      - name: "npm:typescript"
