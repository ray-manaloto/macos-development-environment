# Mise tool definitions — data-driven template source
# Structure: mise.tools.<category> list, each entry has name + version
# Complex entries use 'config' map for extra settings (symlink_bins, extras)
# Platform-specific categories use *_darwin suffix — gated by template conditionals
# Backend prefixes (aqua:, github:, npm:, pipx:) are part of the name

mise:
  tools:
    core_runtimes:
      - name: bun
        version: latest
      - name: node
        version: latest
      - name: "core:python"
        version: latest
      - name: go
        version: latest
      - name: rust
        version: latest
      - name: pixi
        version: latest
      - name: uv
        version: latest
      - name: chezmoi
        version: latest
      - name: usage
        version: latest
      - name: pkl
        version: latest

    modern_utilities:
      - name: starship
        version: latest
      - name: ripgrep
        version: latest
      - name: fd
        version: latest
      - name: zoxide
        version: latest
      - name: bat
        version: latest
      - name: eza
        version: latest
      - name: fzf
        version: latest
      - name: delta
        version: latest
      - name: lsd
        version: latest
      - name: hyperfine
        version: latest
      - name: glow
        version: latest
      - name: atuin
        version: latest
      - name: "github:ast-grep/ast-grep"
        version: latest

    security:
      - name: "aqua:FiloSottile/age"
        version: latest
      - name: "aqua:getsops/sops"
        version: latest
      - name: doppler
        version: latest

    data_processing:
      - name: jq
        version: latest
      - name: yq
        version: latest

    code_quality:
      - name: shellcheck
        version: latest
      - name: hadolint
        version: latest
      - name: pre-commit
        version: latest
      - name: "pipx:mgrep"
        version: latest
      - name: "aqua:crate-ci/typos"
        version: latest
      - name: "pipx:yamllint"
        version: latest

    infrastructure:
      - name: "github:jdx/fnox"
        version: latest
      - name: "aqua:loft-sh/devpod"
        version: latest
      - name: github-cli
        version: latest

    infrastructure_darwin:
      - name: 1password-cli
        version: latest
      - name: aws-cli
        version: latest
        config:
          symlink_bins: true
      - name: azure-cli
        version: latest
      - name: pitchfork
        version: latest

    # clang/LLVM: managed by brew (brew install llvm lld), not mise.
    # conda backend was noisy and missing clang-format/clang-tidy/lldb/lld.
    infrastructure_darwin_cloud:
      - name: "aqua:aws/session-manager-plugin"
        version: latest


    system_utilities:
      - name: cloudflared
        version: latest
      - name: pandoc
        version: latest
      - name: tmux
        version: latest

    container_tools:
      - name: lefthook
        version: latest
      - name: devcontainer
        version: latest

    container_tools_darwin:
      - name: docker-cli
        version: latest

      - name: docker-compose
        version: latest

      - name: "aqua:moby/buildkit"
        version: latest

      - name: "github:docker/docker-agent"
        version: latest

      - name: xcodegen
        version: latest


    test_tools:
      - name: bats
        version: latest
      - name: "github:charmbracelet/gum"
        version: latest

    ai_agents:
      - name: gemini-cli
        version: latest
      - name: "npm:@ralph-orchestrator/ralph-cli"
        version: latest
      - name: codex
        version: latest
      - name: opencode
        version: latest
      - name: "npm:@modelcontextprotocol/inspector"
        version: latest
      - name: "npm:@mermaid-js/mermaid-cli"
        version: latest
      - name: "npm:jscpd"
        version: latest
      - name: "npm:@fission-ai/openspec"
        version: latest
      - name: biome
        version: latest
      - name: yt-dlp
        version: latest
      - name: rtk
        version: latest
      - name: "pipx:notebooklm-py"
        version: latest
        config:
          extras: browser
      - name: "pipx:mcp2cli"
        version: latest
      - name: "pipx:srclight/srclight"
        version: "v0.19.0"
        config:
          uvx_args: "--excludes /Users/rmanaloto/.config/mise/srclight-excludes.txt"
      - name: "npm:@googleworkspace/cli"
        version: latest
      - name: "npm:@claude-flow/cli"
        version: latest
      - name: "npm:ctx7"
        version: latest

    migrated_globals:
