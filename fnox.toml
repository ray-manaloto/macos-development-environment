# Repo-level fnox overlay.
# Global personal secrets live in ~/.config/fnox/config.toml with declarations
# pointing at the Doppler provider and age-encrypted sync cache. The
# architecture is documented in docs/plans/2026-04-08-secrets-crud-architecture-a.md.
#
# Do NOT add per-secret declarations here — they would shadow the global
# config and create false-confidence drift (see codex adversarial review
# finding H1, 2026-04-08). Repo-specific overrides (e.g. 1Password overlays)
# belong in fnox.local.toml which is gitignored.

if_missing = "warn"
