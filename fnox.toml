# Repo-level fnox overlay.
# Global personal secrets live in ~/.config/fnox/config.toml.
# Local 1Password-backed overlays belong in fnox.local.toml.

if_missing = "warn"

[secrets]
AWS_ACCESS_KEY_ID= { provider = "keychain", value = "AWS_ACCESS_KEY_ID", if_missing = "ignore" }
AWS_SECRET_ACCESS_KEY= { provider = "keychain", value = "AWS_SECRET_ACCESS_KEY", if_missing = "ignore" }
AWS_DEFAULT_REGION= { provider = "keychain", value = "AWS_DEFAULT_REGION", if_missing = "ignore" }
