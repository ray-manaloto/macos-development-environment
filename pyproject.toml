[project]
name = "mde"
version = "0.1.0"
description = "Typed Python library for macOS development environment management"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
    "claude-agent-sdk>=0.1.49",
    "httpx>=0.27",
    "claude-code-analytics>=0.1.1",
    "openlit>=1.38.1",
    "loguru>=0.7.3",
    "orjson>=3.11.7",
]

[project.scripts]
mde-py = "mde.__main__:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

# ── Ruff: ALL rules, zero exceptions ──
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
extend-exclude = [".agents/skills"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",     # conflicts with D211 (no-blank-line-before-class)
    "D213",     # conflicts with D212 (multi-line-summary-first-line)
    "COM812",   # conflicts with ruff formatter (missing-trailing-comma)
    "ISC001",   # conflicts with ruff formatter (single-line-implicit-string-concatenation)
    "PLC0415",  # lazy imports are deliberate for CLI startup speed
    "S607",     # partial executable paths unavoidable for system tools (mise, brew, etc.)
    "S603",     # subprocess calls with literal args are safe in this context
    "PLW1510",  # subprocess.run without check= is intentional (we inspect returncode)
    "UP036",    # version block for tomli compat is intentional
    "UP042",    # ditto
    "TC003",    # false positive: Path used at runtime for method calls
    "PLR0913",  # convenience methods with keyword-only args are readable
    "ANN401",   # Any in **kwargs is idiomatic for pass-through signatures
    "S105",     # false positive: enum member named PASS is not a password
]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = [
    "ARG001",   # utility functions may have unused args for interface consistency
    "D100",     # scripts don't need module docstrings
    "D103",     # scripts don't need function docstrings
    "E501",     # generated matrix script has long data literals
    "INP001",   # scripts/ is not a package
    "PIE810",   # endswith tuple merge is a style nit
    "PLW2901",  # loop var reassignment is intentional in text processing
]
# Per-file ignores for datamodel-codegen output (pattern: D100,D101,ERA001,E501,COM812 + extras)
"src/mde/statusline/models.py" = [
    "D100",     # generated file — no module docstring
    "D101",     # generated file — no class docstrings
    "ERA001",   # generated file — codegen header comments
    "E501",     # generated file — long descriptions from schema
    "COM812",   # generated file — trailing comma style
]
"src/mde/research/clients/skillsmp_models.py" = [
    "D100",     # generated file — no module docstring
    "D101",     # generated file — no class docstrings
    "ERA001",   # generated file — codegen header comments
    "N815",     # generated file — camelCase field aliases
    "E501",     # generated file — long descriptions from schema
    "COM812",   # generated file — trailing comma style
]
"src/mde/hooks/agent_frontmatter_model.py" = [
    "D100",     # generated file — no module docstring
    "D101",     # generated file — no class docstrings
    "ERA001",   # generated file — codegen header comments
    "N815",     # generated file — camelCase field names match Claude Code API
    "E501",     # generated file — long descriptions from schema
    "COM812",   # generated file — trailing comma style
]
"tests/**/*.py" = [
    "S101",     # assert is expected in tests
    "S108",     # temp file paths in test fixtures are fine
    "D102",     # test methods don't need docstrings
    "FBT003",   # boolean positional args in mock patches are idiomatic
    "INP001",   # test files don't need __init__.py
    "PLR2004",  # magic values in test assertions are readable
    "SLF001",   # accessing private members for test verification is expected
    "ARG002",   # unused fixture args are fine in tests
]
# T201: print() is intentional user-facing CLI output in these modules
"src/mde/cli.py" = ["T201"]
"src/mde/quality.py" = ["T201"]
"src/mde/telemetry_verify.py" = ["T201"]
"src/mde/validate/__init__.py" = ["T201"]
"src/mde/codegen/postprocess_skillsmp.py" = ["T201"]
"src/mde/domain/*.py" = ["T201"]
"src/mde/fix/*.py" = ["T201"]
"src/mde/hooks/session_start.py" = ["T201"]
"src/mde/hooks/post_compact.py" = ["T201"]
"src/mde/hooks/validate_agents.py" = ["T201"]
"src/mde/install/*.py" = ["T201"]
"src/mde/learn/*.py" = ["T201"]
"src/mde/lib/cache.py" = ["T201"]
"src/mde/maintain/*.py" = ["T201"]
"src/mde/research/cli.py" = ["T201"]
"src/mde/research/skill_discover.py" = ["T201"]
"src/mde/research/skillsmp.py" = ["T201"]
"src/mde/research/clients/skill*.py" = ["T201"]
"src/mde/secrets/*.py" = ["T201"]
"src/mde/status/*.py" = ["T201"]
"src/mde/statusline/render.py" = ["T201"]
"src/mde/statusline/schema.py" = ["T201"]
"src/mde/statusline/toggle.py" = ["T201"]
"src/mde/statusline/widget_toggle.py" = ["T201"]
"src/mde/teams/runner.py" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# ── ty: strict mode ──
[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src/mde"]
exclude = [".agents/skills", "src/mde/hooks/agent_frontmatter_model.py"]

[tool.ty.rules]
# Enable ALL rules that default to "ignore" — no silent type errors
division-by-zero = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
unsupported-dynamic-base = "error"
unused-ignore-comment = "warn"

# ── pyright ──
[tool.pyright]
exclude = [
    "src/mde/hooks/agent_frontmatter_model.py",  # generated file — constr/conint calls in type exprs
]

# ── pytest ──
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: tests requiring external tools (mise, chezmoi, docker, gh)",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.6",
    "ty>=0.0.1a12",
    "datamodel-code-generator[ruff]>=0.55.0",
]
