name: Devcontainer Image

on:
  pull_request:
    paths:
      - ".devcontainer/**"
      - "home/**"
      - ".github/workflows/devcontainer-image.yml"
      - ".github/dependabot.yml"
      - ".mise.toml"
      - "docs/devcontainer.md"
      - "scripts/**"
      - "templates/**"
  push:
    branches:
      - main
    paths:
      - ".devcontainer/**"
      - "home/**"
      - ".github/workflows/devcontainer-image.yml"
      - ".github/dependabot.yml"
      - ".mise.toml"
      - "docs/devcontainer.md"
      - "scripts/**"
      - "templates/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcontainer-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/ray-manaloto/macos-development-environment/devcontainer
  TEST_IMAGE_TAG: mde-devcontainer:ci-${{ github.sha }}

jobs:
  smoke-build:
    name: Smoke Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_slug: linux-amd64
          - platform: linux/arm64
            platform_slug: linux-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Build ${{ matrix.platform }} smoke image
        env:
          MDE_DEVCONTAINER_BUILD_PLATFORM: ${{ matrix.platform }}
          MDE_DEVCONTAINER_TEST_TAG: ${{ env.TEST_IMAGE_TAG }}-${{ matrix.platform_slug }}
        run: scripts/devcontainer-image-build.sh

      - name: Export smoke image artifact
        run: docker image save "${TEST_IMAGE_TAG}-${{ matrix.platform_slug }}" | gzip > devcontainer-image-${{ matrix.platform_slug }}.tar.gz

      - name: Upload smoke image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: devcontainer-image-${{ github.sha }}-${{ matrix.platform_slug }}
          path: devcontainer-image-${{ matrix.platform_slug }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  smoke-validate:
    name: Smoke Validate
    runs-on: ubuntu-latest
    needs:
      - smoke-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_slug: linux-amd64
          - platform: linux/arm64
            platform_slug: linux-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4

      - name: Download smoke image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: devcontainer-image-${{ github.sha }}-${{ matrix.platform_slug }}

      - name: Load smoke image
        run: gzip -dc devcontainer-image-${{ matrix.platform_slug }}.tar.gz | docker load

      - name: Validate devcontainer smoke contract
        env:
          MDE_DEVCONTAINER_TEST_TAG: ${{ env.TEST_IMAGE_TAG }}-${{ matrix.platform_slug }}
          MDE_DEVCONTAINER_RUN_PLATFORM: ${{ matrix.platform }}
        run: scripts/devcontainer-image-smoke.sh

  publish:
    name: Publish GHCR Image
    runs-on: ubuntu-latest
    needs:
      - smoke-validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf  # v6.0.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-

      - name: Build and publish multi-arch image
        id: build-push
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294  # v7.0.0
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true
