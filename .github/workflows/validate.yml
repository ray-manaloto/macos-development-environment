name: Validate
on:
  pull_request:
    paths: ["src/**", "tests/**", ".mise.toml", "configs/**", "pyproject.toml"]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --dev
      - run: uv run ruff check src/mde/ tests/mde/
      - run: uv run ruff format --check src/mde/ tests/mde/
      - run: uv run ty check src/mde/
      - run: uv run pytest tests/ -v
      - run: mise fmt --check
