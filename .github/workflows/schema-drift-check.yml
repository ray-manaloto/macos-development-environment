name: Check Agent Schema Drift
on:
  schedule:
    - cron: '0 8 * * 1'  # Weekly Monday 8am UTC
  workflow_dispatch:

jobs:
  check-drift:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and hash current docs
        # To update cached hash after schema changes:
        # curl -sL https://code.claude.com/docs/en/sub-agents | shasum -a 256 | awk '{print $1}' > docs/research/cache/subagents-docs.sha256
        run: |
          curl -sL https://code.claude.com/docs/en/sub-agents \
            | python3 -c "
          import sys, re
          html = sys.stdin.read()
          # Extract main content area, strip HTML tags, normalize whitespace
          main = re.search(r'<main[^>]*>(.*?)</main>', html, re.DOTALL)
          text = main.group(1) if main else html
          text = re.sub(r'<[^>]+>', '', text)
          text = re.sub(r'\s+', ' ', text).strip()
          print(text)
          " | sha256sum | awk '{print $1}' > /tmp/subagents-docs.sha256

      - name: Compare with cached hash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cached="docs/research/cache/subagents-docs.sha256"
          if [ ! -f "$cached" ]; then
            echo "::error::Cached hash not found at $cached — commit it first"
            exit 1
          fi

          if ! diff -q "$cached" /tmp/subagents-docs.sha256 > /dev/null 2>&1; then
            echo "::warning::Claude Code subagent docs have changed"
            if ! gh issue list --label "auto:agent-discovered" --state open \
                  --search "Agent schema drift detected" | grep -q .; then
              gh issue create \
                --title "Agent schema drift detected" \
                --body "The Claude Code subagent docs page has changed since the last cached snapshot. Review for new frontmatter fields and update docs/schemas/agent-frontmatter.schema.json accordingly." \
                --label "auto:agent-discovered"
            else
              echo "Drift issue already open — skipping duplicate creation."
            fi
          else
            echo "No drift detected."
          fi
