# OTEL Collector configuration for local LGTM dev stack.
# Receives OTLP telemetry, redacts secrets (CRIT-S1), batches for low-volume
# dev workloads, and fans out to Tempo (traces) and Loki (logs).

receivers:
  otlp:
    protocols:
      # gRPC receiver — Claude Code SDK sends here by default
      grpc:
        endpoint: "0.0.0.0:4317"
      # HTTP receiver — mde Python loguru OTEL sink sends here
      http:
        endpoint: "0.0.0.0:4318"

processors:
  # Secret redaction (CRIT-S1): strip sensitive data before storage.
  # Defense-in-depth — redact at Collector layer so Tempo/Loki never see secrets.
  transform:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          # Delete attributes whose keys match secret-like patterns.
          # process.command_args may contain inline secrets passed via CLI.
          - delete_key(attributes, "process.command_args")
          # Redact known API key prefixes in all attribute values.
          # These patterns cover Anthropic (sk-ant-*), GitHub (ghp_*, gho_*),
          # and OpenAI (sk-*) tokens.
          - replace_all_matches(attributes, "sk-ant-[A-Za-z0-9_-]+", "[REDACTED]")
          - replace_all_matches(attributes, "ghp_[A-Za-z0-9]+", "[REDACTED]")
          - replace_all_matches(attributes, "gho_[A-Za-z0-9]+", "[REDACTED]")
          - replace_all_matches(attributes, "sk-[A-Za-z0-9_-]+", "[REDACTED]")
    log_statements:
      - context: log
        statements:
          # Same secret-prefix redaction for log attributes
          - replace_all_matches(attributes, "sk-ant-[A-Za-z0-9_-]+", "[REDACTED]")
          - replace_all_matches(attributes, "ghp_[A-Za-z0-9]+", "[REDACTED]")
          - replace_all_matches(attributes, "gho_[A-Za-z0-9]+", "[REDACTED]")
          - replace_all_matches(attributes, "sk-[A-Za-z0-9_-]+", "[REDACTED]")

  # Dev-tuned batch settings: small batches for low-volume local workloads.
  # Default OTEL values (8192/200ms) are for production throughput —
  # 64 records / 2s timeout reduces memory footprint and query latency.
  batch:
    send_batch_size: 64
    timeout: 2s
    send_batch_max_size: 128

exporters:
  # Traces → Tempo via OTLP/HTTP on the Docker internal network
  otlphttp/tempo:
    endpoint: "http://tempo:4318"

  # Logs → Loki via the native Loki exporter on the Docker internal network
  loki:
    endpoint: "http://loki:3100/loki/api/v1/push"

  # Debug exporter for local troubleshooting — prints to Collector stdout
  debug:
    verbosity: basic

extensions:
  # Health check endpoint for Docker healthcheck and telemetry verify
  health_check:
    endpoint: "0.0.0.0:13133"

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform, batch]
      exporters: [otlphttp/tempo, debug]
    logs:
      receivers: [otlp]
      processors: [transform, batch]
      exporters: [loki, debug]
