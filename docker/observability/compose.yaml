# LGTM observability stack for the mde development environment.
#
# Uses the official Grafana OTEL-LGTM all-in-one image which bundles
# OTEL Collector, Tempo, Loki, Prometheus, and Grafana pre-configured.
# This replaces the previous 4-service custom compose.
#
# Source: https://github.com/grafana/docker-otel-lgtm
#
# Ports published to localhost only:
#   4317  - OTEL gRPC receiver (Claude Code)
#   4318  - OTEL HTTP receiver (Codex, Gemini)
#   3000  - Grafana UI
#   3100  - Loki API
#   3200  - Tempo API

name: mde-observability

services:
  lgtm:
    image: grafana/otel-lgtm:0.9.1@sha256:ab18c8f12da299291040af7892cc2d12cada234e3689a3c5639dc88dd47b62f5
    ports:
      - "127.0.0.1:4317:4317"   # OTEL gRPC
      - "127.0.0.1:4318:4318"   # OTEL HTTP
      - "127.0.0.1:3000:3000"   # Grafana
      - "127.0.0.1:3100:3100"   # Loki
      - "127.0.0.1:3200:3200"   # Tempo
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - lgtm-data:/data
    mem_limit: 1g
    cpus: 1.0

volumes:
  lgtm-data:
