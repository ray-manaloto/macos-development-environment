# Loki configuration for local LGTM dev stack.
# Single-tenant, filesystem storage — appropriate for dev workloads.

auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    # Single schema period starting from epoch — no migrations needed for dev
    - from: "2020-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# 72h retention keeps disk usage bounded; matches Tempo retention for consistency
limits_config:
  retention_period: 72h
