# Grafana datasource auto-provisioning for local LGTM dev stack.
# Datasources use Docker service names — no host networking needed.
apiVersion: 1

datasources:
  # Tempo — trace storage, default datasource for Explore view
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: true
    editable: false

  # Loki — log storage, queryable via LogQL in Explore view
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
