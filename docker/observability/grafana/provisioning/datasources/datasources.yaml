# Auto-provisioned datasources for the mde LGTM observability stack.
# Grafana reads this on startup — no manual datasource configuration needed.
apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
